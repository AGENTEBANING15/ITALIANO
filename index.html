f:[["Roma è più grande di Firenze.","Roma es más grande que Florencia."],["Il mio italiano è migliorato tantissimo.","Mi italiano mejoró muchísimo."],["È il migliore ristorante della città.","Es el mejor restaurante de la ciudad."],["Parla meglio di me.","Habla mejor que yo."],["Mia sorella maggiore vive a Lima.","Mi hermana mayor vive en Lima."],["Questo caffè è buonissimo!","¡Este café está buenísimo!"]],
c:[["Secondo te, è meglio vivere a Milano o a Napoli?","Según tú, ¿es mejor vivir en Milán o en Nápoles?"],["Dipende. Milano è più moderna di Napoli, ma è anche più cara.","Depende. Milán es más moderna que Nápoles, pero también más cara."],["E il clima?","¿Y el clima?"],["A Napoli il clima è molto migliore: fa meno freddo che a Milano.","En Nápoles el clima es mucho mejor: hace menos frío que en Milán."],["E il cibo?","¿Y la comida?"],["La pizza napoletana è la migliore del mondo, senza dubbio!","¡La pizza napolitana es la mejor del mundo, sin duda!"],["Ma a Milano si lavora meglio, no?","Pero en Milán se trabaja mejor, ¿no?"],["Forse. Però a Napoli si vive più felici!","Quizá. ¡Pero en Nápoles se vive más feliz!"]],
n:"Migliore acompaña a un sustantivo (un libro migliore); meglio acompaña a un verbo (scrive meglio).",
gt:"Comparativos y superlativos",gi:"<p><b>Paso 1 · Comparar:</b> <i>più / meno + adjetivo + <b>di</b></i> con nombres y pronombres (<i>più alto di te</i>); con <b>che</b> cuando comparas dos adjetivos, verbos o con preposición (<i>più bello che utile, meno freddo che a Milano</i>). Igualdad: <i>così… come / tanto… quanto</i>.</p><p><b>Paso 2 · Superlativo relativo:</b> <i>il più / il meno + adjetivo + di</i>: <i>il più alto della classe</i>. <b>Absoluto:</b> <i>-issimo</i> o <i>molto</i>: <i>bellissimo</i>.</p><p><b>Paso 3 · Irregulares:</b> buono → <i>migliore, il migliore, ottimo</i>; cattivo → <i>peggiore, il peggiore, pessimo</i>; bene → <i>meglio</i>; male → <i>peggio</i>; grande → <i>maggiore</i>; piccolo → <i>minore</i>.</p>",

tk:"Habla 1 minuto: compara Chimbote con otra ciudad (tamaño, clima, comida, precios) y di cuál es para ti la mejor.",
L:{t:"Classifica delle città",x:"Secondo una recente classifica, Trento è la città italiana dove si vive meglio. Ha meno traffico di Milano, l'aria è più pulita che a Roma e i servizi sono ottimi. Tuttavia, gli affitti sono più cari della media. La città peggiore della classifica, invece, ha problemi di lavoro, ma il suo clima è migliore e la vita costa molto meno.",q:[["¿Dónde se vive mejor según la clasificación?","~En Trento."],["¿Qué desventaja tiene Trento?","~Los alquileres son más caros que el promedio."],["¿Qué ventaja tiene la peor ciudad?","~Mejor clima y vida más barata."]]}},

c:[["Hai letto la notizia sui prezzi?","¿Leíste la noticia sobre los precios?"],["Sì. Secondo l'ISTAT, i prezzi del cibo sono aumentati del tre per cento.","Sí. Según el ISTAT, los precios de la comida aumentaron un tres por ciento."],["Più dell'anno scorso?","¿Más que el año pasado?"],["Sì, ma meno di due anni fa. Il ministro ha detto che entro l'estate la situazione sarebbe migliorata.","Sí, pero menos que hace dos años. El ministro dijo que para el verano la situación mejoraría."],["Speriamo! Intanto è stato annunciato uno sciopero dei trasporti.","¡Ojalá! Mientras tanto se anunció una huelga del transporte."],["Quando?","¿Cuándo?"],["Venerdì prossimo. I treni verranno cancellati per tutta la giornata.","El próximo viernes. Los trenes serán cancelados todo el día."],["Allora venerdì lavoro da casa!","¡Entonces el viernes trabajo desde casa!"]],

L:{t:"Notizia: nuovo treno veloce",x:"È stata inaugurata ieri la nuova linea ad alta velocità tra Napoli e Bari. Secondo il ministro dei trasporti, il viaggio durerà due ore, cioè un'ora in meno rispetto a prima. I biglietti verranno messi in vendita da lunedì. Alcuni cittadini hanno dichiarato che i prezzi sarebbero troppo alti, ma l'azienda ha promesso che ci saranno offerte per i giovani.",q:[["¿Qué se inauguró?","~La nueva línea de alta velocidad entre Nápoles y Bari."],["¿Cuánto durará el viaje?","~Dos horas, una hora menos que antes."],["¿Qué prometió la empresa?","~Ofertas para los jóvenes."]]}},

c:[["Buongiorno, si accomodi. Mi parli un po' di Lei.","Buenos días, tome asiento. Hábleme un poco de usted."],["Buongiorno. Mi chiamo Daniel, sono laureato in Economia e da dieci anni lavoro con le statistiche dei prezzi.","Buenos días. Me llamo Daniel, soy licenciado en Economía y hace diez años trabajo con las estadísticas de precios."],["Interessante. Perché vorrebbe lavorare con noi?","Interesante. ¿Por qué querría trabajar con nosotros?"],["Perché la vostra azienda è leader nel settore e vorrei crescere professionalmente.","Porque su empresa es líder en el sector y quisiera crecer profesionalmente."],["Qual è il Suo punto di forza?","¿Cuál es su punto fuerte?"],["Sono molto preciso e ho imparato a lavorare sotto pressione.","Soy muy preciso y aprendí a trabajar bajo presión."],["E un punto debole?","¿Y un punto débil?"],["A volte sono troppo perfezionista, ma sto imparando a delegare.","A veces soy demasiado perfeccionista, pero estoy aprendiendo a delegar."]],

f:[["Ogni regione ha i suoi piatti tipici.","Cada región tiene sus platos típicos."],["Gli italiani parlano anche con le mani.","Los italianos hablan también con las manos."],["L'aperitivo si fa verso le sette.","El aperitivo se hace hacia las siete."],["A Ferragosto tutti vanno al mare.","En Ferragosto todos van a la playa."],["In Italia si beve il caffè in piedi al bar.","En Italia se toma el café de pie en el bar."],["Ogni città pensa di essere la migliore.","Cada ciudad piensa que es la mejor."]],
c:[["Che cosa ti ha sorpreso di più dell'Italia?","¿Qué te sorprendió más de Italia?"],["I gesti! Pensavo che fosse un cliché, ma è vero.","¡Los gestos! Pensaba que era un cliché, pero es verdad."],["Ah sì? Per esempio?","¿Ah sí? ¿Por ejemplo?"],["Quando qualcuno chiede «Ma che vuoi?» unisce le dita così.","Cuando alguien pregunta «¿Pero qué quieres?» junta los dedos así."],["Ahah, è vero! E il cibo?","¡Jaja, es verdad! ¿Y la comida?"],["Mi è piaciuto che ogni regione abbia piatti così diversi.","Me gustó que cada región tenga platos tan distintos."],["Come in Perù, no?","Como en Perú, ¿no?"],["Esatto! Il ceviche del nord è diverso da quello di Lima, come la pizza di Napoli e quella di Roma.","¡Exacto! El ceviche del norte es distinto del de Lima, como la pizza de Nápoles y la de Roma."]],
n:"Campanilismo viene de «campanile» (campanario): el orgullo de cada pueblo por lo suyo. ¡Nunca digas que la pizza de otra ciudad es mejor!",
gt:"Repaso integrado: hablar de cultura",gi:"<p><b>Paso 1 · Costumbres:</b> si impersonale → <i>In Italia si cena tardi, si beve il caffè in piedi</i>.</p><p><b>Paso 2 · Impresiones:</b> congiuntivo → <i>Mi ha sorpreso che…, Pensavo che fosse…, Mi è piaciuto che…</i></p><p><b>Paso 3 · Comparar culturas:</b> comparativos → <i>più… di, così… come, diverso da</i>: <i>Il pranzo in Perù è più abbondante che in Italia</i>.</p>",

L:{t:"L'aperitivo",x:"L'aperitivo è nato a Torino alla fine del Settecento ed è diventato un rito in tutta Italia. Verso le sette di sera si va al bar con gli amici, si beve uno spritz o un analcolico e si mangiano piccoli stuzzichini. A Milano l'aperitivo è così abbondante che molti lo usano come cena: lo chiamano «apericena».",q:[["¿Dónde nació el aperitivo?","~En Turín, a fines del siglo XVIII."],["¿A qué hora se hace?","~Hacia las siete de la noche."],["¿Qué es el «apericena»?","~Un aperitivo tan abundante que sirve de cena."]]}},

f:[["Nonostante piova, esco lo stesso.","A pesar de que llueve, salgo igual."],["Ti presto la macchina, purché tu stia attento.","Te presto el carro, con tal de que tengas cuidado."],["Ho studiato poco, eppure ho passato l'esame.","Estudié poco, y sin embargo aprobé el examen."],["Non sono stanco, anzi, ho voglia di ballare!","No estoy cansado, ¡es más, tengo ganas de bailar!"],["Insomma, è stata una bella giornata.","En resumen, fue un día bonito."],["Riesco a capire quasi tutto.","Logro entender casi todo."]],
c:[["Allora, com'è andato il tuo primo anno di italiano?","Entonces, ¿cómo te fue tu primer año de italiano?"],["Benissimo! Nonostante il lavoro, sono riuscito a studiare ogni giorno.","¡Muy bien! A pesar del trabajo, logré estudiar cada día."],["Complimenti! Non è stato difficile?","¡Felicitaciones! ¿No fue difícil?"],["All'inizio sì, eppure adesso riesco a parlare senza pensare troppo.","Al principio sí, y sin embargo ahora logro hablar sin pensar demasiado."],["E il congiuntivo?","¿Y el subjuntivo?"],["Non mi spaventa più, anzi, mi piace!","Ya no me asusta, ¡es más, me gusta!"],["Andrai in Italia, allora?","¿Irás a Italia, entonces?"],["Sì, purché riesca a risparmiare abbastanza. Insomma, il sogno continua!","Sí, con tal de que logre ahorrar lo suficiente. En resumen, ¡el sueño continúa!"]],
n:"Nonostante, purché, a patto che, benché y prima che siempre llevan congiuntivo.",
gt:"Conectores avanzados",gi:"<p><b>Paso 1 · Con congiuntivo:</b> <i>nonostante, benché, sebbene</i> (aunque), <i>purché, a patto che</i> (con tal de que), <i>prima che, senza che</i>: <i>Nonostante <b>sia</b> tardi…</i></p><p><b>Paso 2 · Con indicativo:</b> <i>eppure</i> (y sin embargo), <i>anzi</i> (es más), <i>infatti</i> (de hecho), <i>perciò</i> (por eso), <i>altrimenti</i> (si no).</p><p><b>Paso 3 · Para ganar tiempo al hablar</b> (como «o sea, bueno, pues»): <i>allora, insomma, cioè, diciamo, ecco</i>. ¡Úsalos para sonar natural mientras piensas!</p>",

p:[["Completa: Nonostante ___ (fare) freddo, esco.","faccia"],["Completa: Ti aiuto, purché tu mi ___ (aiutare) dopo.","aiuti"],["Une con «y sin embargo»: Ho dormito poco. Non sono stanco.","Ho dormito poco, eppure non sono stanco."],["Di: «Logro entender casi todo».","Riesco a capire quasi tutto."],["¿Qué modo pide «purché»?","~El congiuntivo."]],
tk:"Habla 1 minuto sin parar sobre tu experiencia aprendiendo italiano. Usa al menos 5 conectores: nonostante, eppure, anzi, insomma, perciò.",
L:{t:"Il mio anno in Italia",x:"Quando sono arrivato a Bologna non capivo quasi niente. Nonostante studiassi tutti i giorni, al bar parlavano troppo veloce. Eppure, dopo tre mesi, qualcosa è cambiato: riuscivo a seguire le conversazioni, anzi, cominciavo a scherzare con i colleghi. Insomma, il segreto è non arrendersi, purché si abbia pazienza.",q:[["¿Cómo era al principio?","~No entendía casi nada."],["¿Qué cambió después de tres meses?","~Lograba seguir las conversaciones y bromear."],["¿Cuál es el secreto?","~No rendirse, con tal de tener paciencia."]]}},

c:[["Congratulazioni! Hai finito il corso!","¡Felicitaciones! ¡Terminaste el curso!"],["Grazie! Non pensavo che ci sarei riuscito in sessanta giorni.","¡Gracias! No pensaba que lo lograría en sesenta días."],["Qual è stata la parte più difficile?","¿Cuál fue la parte más difícil?"],["Il congiuntivo, senza dubbio. Eppure adesso lo uso senza pensarci.","El subjuntivo, sin duda. Y sin embargo ahora lo uso sin pensarlo."],["E adesso che farai?","¿Y ahora qué harás?"],["Vorrei prepararmi per la certificazione CILS B1.","Quisiera prepararme para la certificación CILS B1."],["Ottima idea. Se continui così, la supererai sicuramente.","Muy buena idea. Si sigues así, la aprobarás seguramente."],["Lo spero! Insomma, ne è valsa la pena.","¡Eso espero! En resumen, valió la pena."]],
n:"El periodo ipotetico de tipo 3 resume el curso: Se non avessi studiato, non sarei arrivato fin qui.",

  const ej=G[cur].ej.slice(0,3);return ej.map(([it,es])=>({q:`¿Cómo se dice en italiano? <b>«${es}»</b>`,r:it,o:ej.map(x=>x[0]).sort(()=>Math.random()-.5),ex:it+" = "+es}))}
function mpStart(){MP={k:0,ok:0,it:mpItems()};mpShow()}
function mpShow(){const b=sec("mp");if(!b)return;const x=MP.it[MP.k];

let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==="it-IT")||vs.find(v=>v.lang&&v.lang.startsWith("it"))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t,slow,pitch){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="it-IT";if(voice)u.voice=voice;u.rate=slow?0.55:rate;if(pitch)u.pitch=pitch;speechSynthesis.speak(u)}catch(e){toast("Tu navegador no permite audio aquí.")}}
const esc=s=>s.replace(/'/g,"\\'");
const spk=(t,ic="🔊")=>`<button class="spk" title="Escuchar" onclick="say('${esc(t)}')">${ic}</button>`;
const spkS=t=>`<button class="spk" title="Lento" onclick="say('${esc(t)}',1)">🐢</button>`;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’`]/g,"'").replace(/[^a-z' /]/g,"").replace(/\s+/g," ").trim();
const clean=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?¿¡]/g,"").replace(/\s+/g," ").trim();
function toast(m){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="card"><p>${m}</p><button class="btn p" onclick="this.closest('.modal').remove()">OK</button></div>`;document.body.append(d)}

  <li><b>💬 Conversación (10 min):</b> escucha el diálogo, oculta la traducción y repite al mismo tiempo que el audio (<i>shadowing</i>). Luego usa el juego de roles.</li>

  <p class="mut" style="margin-bottom:0">Meta: con los días 1-30 llegas a un A2 sólido (presentarte, comprar, pedir comida, contar el pasado y hacer planes). Con los días 31-60 (Avanzado) llegas al B1: narrar con todos los tiempos del pasado, opinar con el congiuntivo, imaginar, debatir, leer noticias, escribir correos formales y superar una entrevista. Cada día del Avanzado trae además una lectura con preguntas y una tarea de «habla 1 minuto».</p></details>

let MAXD=60;
function lockMsg(i){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:2.2rem">🔒</div><h2 style="margin:6px 0">No tienes acceso al Día ${i+1}</h2><p class="mut">Comunícate con el administrador para que habilite la siguiente clase.</p><button class="btn p" style="width:100%" onclick="this.closest('.modal').remove()">Entendido</button></div>`;document.body.append(d)}

const SECS=[["s-sonido","Il suono del giorno","Pronunciación",()=>sonido()],["s-aprender","Il vocabolario","Vocabulario",()=>aprender()],["s-gram","La grammatica","Gramática",()=>gramatica()],["s-verbo","Il verbo del giorno","Verbo",()=>verbo()],["s-conv","Il dialogo","Diálogo",()=>conversacion()],["s-prac","Esercizi","Práctica",()=>practica()]];
const EXS=[["escuchar","🎧 Escuchar"],["escribir","✍️ Escribir"],["pronunciar","🗣️ Pronunciar"],["final","🏁 Ejercicio final"]];
const sec=id=>document.getElementById(id);
const goTo=id=>{const el=sec(id);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"start"})};
function openDay(i,m){if(i+1>MAXD){lockMsg(i);return}const same=view==="day"&&cur===i;cur=i;view="day";if(!same)renderDay();
  const ex={escuchar,escribir,pronunciar,final}[m];
  if(ex){ex();document.querySelectorAll("[data-ex]").forEach(b=>b.classList.toggle("on",b.dataset.ex===m));goTo("s-ex")}
  else if(m){const id={sonido:"s-sonido",aprender:"s-aprender",gramatica:"s-gram",verbo:"s-verbo",conversacion:"s-conv",practica:"s-prac"}[m];if(id)goTo(id)}
  else scrollTo(0,0)}
function idxToggle(f){const m=sec("idx"),b=sec("fab");if(!m)return;const open=f===undefined?m.hidden:f;m.hidden=!open;b.textContent=open?"✕":"☰";if(open)idxMark()}
function idxGo(id){idxToggle(false);if(id)goTo(id);else scrollTo({top:0,behavior:"smooth"})}
function idxMark(){const ids=[...SECS.map(s=>s[0]),"s-ex"];let act=ids[0];ids.forEach(id=>{const e=sec(id);if(e&&e.getBoundingClientRect&&e.getBoundingClientRect().top<200)act=id});document.querySelectorAll("#idx [data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s===act))}
function renderDay(){
  const d=D[cur],L=lvlOf(cur);
  app.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn sm" onclick="home()">← Plan</button>
   <span class="row">${cur>0?`<button class="btn sm" onclick="openDay(${cur-1})">‹ Día ${cur}</button>`:""}${cur<ND-1?`<button class="btn sm" onclick="openDay(${cur+1})">Día ${cur+2} ›</button>`:""}</span></div>
   <p class="eyebrow"><span class="dot" style="display:inline-block;background:${L[1]}"></span> Día ${cur+1} de ${ND} · ${L[0]}</p>
   <h1 style="margin-top:4px">${d.t}</h1><p class="sub">🎯 <b>Objetivo:</b> ${E[cur].g}</p>
   <div id="idx" class="idx" hidden>${SECS.map((s,i)=>`<button data-s="${s[0]}" onclick="idxGo('${s[0]}')">${i+1} · ${s[2]}</button>`).join("")}<button data-s="s-ex" onclick="idxGo('s-ex')">7 · Ejercicios</button><button class="up" onclick="idxGo()">↑ Volver arriba</button></div>
   <button id="fab" class="fab" aria-label="Índice" onclick="idxToggle()">☰</button>
   ${SECS.map((s,i)=>`<section class="blk"><h3 class="sec" id="${s[0]}h">${i+1} · <i>${s[1]}</i> <small>${s[2]}</small></h3><div id="${s[0]}"></div></section>`).join("")}
   <section class="blk" id="s-ex"><h3 class="sec">7 · <i>Mettiti alla prova</i> <small>Ejercicios con nota</small></h3>

  SECS.forEach(s=>s[3]());

function playAll(){const ws=D[cur].w;let k=0;try{speechSynthesis.cancel()}catch(e){}
  const nx=()=>{if(k>=ws.length)return;const u=new SpeechSynthesisUtterance(ws[k][0]);u.lang="it-IT";if(voice)u.voice=voice;u.rate=rate;u.onend=()=>setTimeout(nx,700);k++;try{speechSynthesis.speak(u)}catch(e){}};nx()}

function tbl(t){if(t.h.length>=4)return tblCards(t);return `<div class="card" style="padding:0;overflow-x:auto"><table><caption class="cap">${t.c}</caption><tr><th></th>${t.h.map(x=>`<th class="th">${x}</th>`).join("")}</tr>${t.r.map(r=>{const s=t.k.map(j=>r[j]).join(". ").replace(/[→—]/g,",").replace(/\//g,",");return `<tr><td style="width:40px">${spk(s)}</td>${r.map((c,j)=>`<td style="width:auto;${t.k.includes(j)?"color:var(--ink);font-weight:500":"color:var(--mut)"}">${c}</td>`).join("")}</tr>`}).join("")}</table></div>`}
function tblCards(t){return `<div class="card"><p class="lbl" style="margin-top:0">${t.c}</p>${t.r.map(r=>{const s=t.k.map(j=>r[j]).join(". ").replace(/[→—]/g,",").replace(/\//g,",");return `<div class="rc"><div class="row" style="justify-content:space-between"><b>${t.h[0]?t.h[0]+": ":""}${r[0]}</b>${spk(s)}</div><div class="rg">${r.slice(1).map((c,j)=>`<div><small>${t.h[j+1]||""}</small><span style="${t.k.includes(j+1)?"font-weight:600":""}">${c}</span></div>`).join("")}</div></div>`}).join("")}</div>`}
function claves(ns,oj){const ex=t=>{const m=t.match(/<i>(.*?)<\/i>/);return m?m[1].replace(/<[^>]+>/g,""):""};
  const card=(cls,title,txt)=>{const e=ex(txt);return `<div class="clave ${cls}"><small>${title}</small><div>${txt}</div>${e?`<div class="cx">${spk(e)} <span>${e}</span></div>`:""}</div>`};
  return `<p class="lbl">🔑 Claves del día</p>${ns.map((n,i)=>{const m=n.match(/^<b>([^<]+):<\/b>\s*/);return card(i?"b":"v","🔑 Clave"+(m?": "+m[1]:""),m?n.slice(m[0].length):n)}).join("")}${card("a","⚠️ Ojo: error típico",oj)}`}

}
function sonido(){
  const s=S2[cur];let prev=null;
  sec("s-sonido").innerHTML=`<div class="card"><p class="mut" style="margin-top:0">${s.i}</p>

function sayList(slow){const ex=S2[cur].f.map(x=>x[1]);let k=0;try{speechSynthesis.cancel()}catch(e){}
  const nx=()=>{if(k>=ex.length)return;const u=new SpeechSynthesisUtterance(ex[k++]);u.lang="it-IT";if(voice)u.voice=voice;u.rate=slow?0.55:rate;u.onend=()=>setTimeout(nx,700);try{speechSynthesis.speak(u)}catch(e){}};nx()}

let VQ=null;
function vq(reset){const v=D[cur].v;
  if(reset||!VQ||VQ.d!==cur){const idx=[0,1,2,3,4,5].filter(k=>v[3][k]&&v[3][k]!=="—").sort(()=>Math.random()-.5);VQ={d:cur,o:idx,k:0,ok:0,bad:[]}}

function final(skip){
  if(!skip&&errList().length){preFinal();return}
  const d=D[cur],qs=[];
  const fr=shuf(d.f.filter(x=>x[0].split(" ").length>=3));
  fr.slice(0,3).forEach(x=>qs.push({t:"ord",it:x[0],es:x[1]}));
  const allW=[...new Set(d.c.concat(d.f).flatMap(x=>x[0].replace(/[.,!?:]/g,"").split(" ")).filter(w=>w.length>3))];
  const ci=shuf([0,1,2,3,4,5]),resp=ci.find(i=>i%2===1),rest=ci.filter(i=>i!==resp),dict=rest[0];
  rest.slice(1,3).forEach(i=>{const x=d.c[i],ws=x[0].replace(/[.,!?:]/g,"").split(" ").filter(w=>w.length>2),w=ws.sort((a,b)=>b.length-a.length)[0];
    qs.push({t:"gap",it:x[0],es:x[1],w,prev:i>0?d.c[i-1][0]:"",opts:shuf([w,...shuf(allW.filter(z=>z.toLowerCase()!==w.toLowerCase())).slice(0,3)])})});
  qs.push({t:"verb",v:d.v,i:Math.floor(Math.random()*6)});
  const wd=shuf(d.w)[0];qs.push({t:"trad",it:wd[0],es:wd[1]});
  const tf=fr[3]||shuf(d.f.filter(x=>!fr.slice(0,3).includes(x)))[0]||d.f[0];
  qs.push({t:"hard",m:"dict",it:d.c[dict][0],es:d.c[dict][1]});
  qs.push({t:"hard",m:"trad",it:tf[0],es:tf[1]});
  qs.push({t:"hard",m:"resp",it:d.c[resp][0],es:d.c[resp][1],prev:d.c[resp-1][0]});
  q={items:qs,k:0,ok:0};nextF();
}

function tips(){view="tips";
  app.innerHTML=`<button class="btn sm" onclick="home()">← Plan</button><h1>💡 Tips y trucos reales</h1><p class="sub">Lo que de verdad marca la diferencia al aprender italiano siendo hispanohablante.</p>
  ${TIPS.map(s=>`<div class="card"><h2>${s.t}</h2>${s.i.map(([tx,au])=>`<div class="w" style="margin:6px 0;align-items:flex-start"><div style="line-height:1.55">${tx}</div>${au?`<span>${spk(au)}</span>`:""}</div>`).join("")}</div>`).join("")}`;scrollTo(0,0)}

// ---------- repaso ----------
function repaso(){view="repaso";
  const dias=Object.keys(done).map(Number);const src=dias.length?dias:[...Array(nextDay()+1).keys()];
  const pool=shuf(src.flatMap(i=>D[i].w.concat(D[i].f.slice(0,2)))).slice(0,15);
  q={items:pool,k:0,ok:0,again:[]};nextR();
}
function nextR(){
  if(q.k>=q.items.length&&q.again.length){q.items=q.items.concat(q.again);q.again=[]}
  if(q.k>=q.items.length){app.innerHTML=`<button class="btn sm" onclick="home()">← Plan</button><div class="card" style="text-align:center"><h2>🧠 Repaso terminado</h2><p>Recordaste ${q.ok} tarjetas a la primera.</p><button class="btn p" onclick="repaso()">Otro repaso</button></div>`;return}
  const x=q.items[q.k];
  app.innerHTML=`<button class="btn sm" onclick="home()">← Plan</button><h1>🧠 Repaso rápido</h1><p class="sub">Tarjetas de los días que ya aprobaste. Tarjeta ${q.k+1}/${q.items.length}</p>
  <div class="card" style="text-align:center;min-height:240px"><div class="big">${x[0]}</div><div>${spk(x[0])} ${spkS(x[0])}</div>
  <div style="margin-top:16px"><button class="btn p" id="vb" onclick="this.style.display='none';document.getElementById('back').style.display='block'">Ver significado</button>
  <div id="back" style="display:none"><p style="font-size:1.3rem">${x[1]}</p><div class="row" style="justify-content:center"><button class="btn" onclick="q.again.push(q.items[q.k]);q.k++;nextR()">🔁 Repasar otra vez</button><button class="btn g" onclick="q.ok++;q.k++;nextR()">✓ Lo sabía</button></div></div></div></div>`;
  setTimeout(()=>say(x[0]),200);
}

// ---------- verbos ----------
function verbs(){view="verbs";
  app.innerHTML=`<button class="btn sm" onclick="home()">← Plan</button><h1>📚 Los ${D.length} verbos del plan</h1><p class="sub">Toca 🔊 para escuchar cada forma.</p>
  ${D.map((d,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><h2>${d.v[0]} <span class="mut" style="font-size:1rem">· ${d.v[1]} · ${d.v[2]}</span></h2><button class="btn sm" onclick="openDay(${i},'verbo')">Día ${i+1} →</button></div>${conjTable(d.v)}</div>`).join("")}`;scrollTo(0,0)}

document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches('input[type=text]')){document.body.classList.add("typing");const c=e.target.closest(".card")||e.target.parentElement;setTimeout(()=>{if(c&&c.scrollIntoView)c.scrollIntoView({block:"start",behavior:"smooth"})},380)}});
document.addEventListener("focusout",e=>{if(e.target.matches&&e.target.matches('input[type=text]'))setTimeout(()=>{if(!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input[type=text]')))document.body.classList.remove("typing")},150)});
let LEAVING=false;
function exitAsk(){if(document.querySelector(".modal.exit"))return;const d=document.createElement("div");d.className="modal exit";
  d.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:2rem">🚪</div><h2 style="margin:6px 0">¿Deseas salir del aplicativo?</h2><p class="mut">Tu avance aprobado ya está guardado.</p><div class="row" style="justify-content:center"><button class="btn" onclick="this.closest('.modal').remove()">No, quedarme</button><button class="btn p" onclick="exitYes()">Sí, salir</button></div></div>`;document.body.append(d)}
function exitYes(){LEAVING=true;document.querySelectorAll(".modal.exit").forEach(m=>m.remove());history.back();setTimeout(()=>{if(document.visibilityState==="visible"){LEAVING=false;try{history.pushState({it:1},"")}catch(e){}toast("Ya puedes cerrar esta pestaña.")}},700)}
try{history.pushState({it:1},"")}catch(e){}
window.addEventListener("popstate",()=>{if(LEAVING)return;try{history.pushState({it:1},"")}catch(e){}
  document.querySelectorAll(".modal:not(.exit)").forEach(m=>m.remove());
  if(view==="day"||view==="tips"||view==="repaso"||view==="verbs"){try{speechSynthesis.cancel()}catch(e){}home()}else exitAsk()});
window.addEventListener("beforeunload",e=>{if(USER&&!LEAVING){e.preventDefault();e.returnValue=""}});
start();
</script>

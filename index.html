{i:"<p>Las preposiciones <b>di, a, da, in, su</b> se unen al artículo en una sola palabra. Es uno de los puntos más importantes del italiano: aparece en casi cada frase.</p>",
 t:[{c:"Preposiciones articuladas",h:["","il","lo","la","l'","i","gli","le"],r:[["di","del","dello","della","dell'","dei","degli","delle"],["a","al","allo","alla","all'","ai","agli","alle"],["da","dal","dallo","dalla","dall'","dai","dagli","dalle"],["in","nel","nello","nella","nell'","nei","negli","nelle"],["su","sul","sullo","sulla","sull'","sui","sugli","sulle"]],k:[1,2,3,4,5,6,7]}],
 n:["<b>a</b> = a (ciudades, lugares): <i>vado a Roma, al bar</i>. <b>in</b> = en (países, regiones, medios): <i>in Italia, in treno</i>.","<b>da</b> = desde / a casa de: <i>vengo da Lima, vado dal medico</i>.","<b>Abitare:</b> <i>abito a Chimbote</i> (ciudad), <i>abito in Perù</i> (país)."]},
{i:"<p>Para preguntar la hora: <b>Che ore sono?</b> Se responde con <b>sono le</b> + número, excepto la una, el mediodía y la medianoche, que van con <b>è</b>.</p><p><b>Fare</b> (hacer) es irregular y aparece en muchas expresiones fijas: <i>fare colazione, fare la spesa, fare una passeggiata, fa caldo</i>.</p>",
 t:[{c:"La hora",h:["Hora","Italiano"],r:[["1:00","È l'una"],["3:00","Sono le tre"],["8:30","Sono le otto e mezza"],["5:15","Sono le cinque e un quarto"],["8:45","Sono le nove meno un quarto"],["12:00","È mezzogiorno"],["0:00","È mezzanotte"],["¿A qué hora?","A che ora? — Alle sette"]],k:[1]}],
 n:["Con los días: <i>il lunedì</i> = todos los lunes; <i>lunedì</i> = este lunes.","Días y meses se escriben con minúscula: <i>martedì, gennaio</i>."]},
{i:"<p><b>C'è</b> + singular y <b>ci sono</b> + plural equivalen a «hay».</p><p>Los verbos en <b>-ere</b> e <b>-ire</b> se conjugan casi igual. Algunos verbos en -ire (capire, finire, preferire) añaden <b>-isc-</b> en todas las personas excepto noi y voi.</p>",
 t:[{c:"scrivere (-ere)",h:["","Forma"],r:PR6.map((p,i)=>[p,["scrivo","scrivi","scrive","scriviamo","scrivete","scrivono"][i]]),k:[1]},
  {c:"dormire (-ire)",h:["","Forma"],r:PR6.map((p,i)=>[p,["dormo","dormi","dorme","dormiamo","dormite","dormono"][i]]),k:[1]},
  {c:"capire (-isc-)",h:["","Forma"],r:PR6.map((p,i)=>[p,["capisco","capisci","capisce","capiamo","capite","capiscono"][i]]),k:[1]}],
 n:["En «loro» la fuerza va atrás: <i>SCRI-vo-no, DOR-mo-no, ca-PI-sco-no</i>.","<b>Da + tiempo</b> = desde hace: <i>Studio italiano da una settimana</i>."]},
{i:"<p>Para negar basta poner <b>non</b> delante del verbo. A diferencia del inglés, en italiano la <b>doble negación es correcta</b>: <i>non… mai, non… niente</i>.</p><p>Para preguntar no cambia el orden de las palabras: solo sube la entonación al final, igual que en español.</p>",
 t:[{c:"Negaciones",h:["Italiano","Español","Ejemplo"],r:[["non… mai","nunca","Non mangio mai carne."],["non… niente","nada","Non capisco niente."],["non… nessuno","nadie","Non c'è nessuno."],["non… più","ya no","Non abito più qui."],["non… ancora","todavía no","Non ho ancora mangiato."]],k:[2]},
  {c:"Palabras para preguntar",h:["Italiano","Español","Ejemplo"],r:[["chi","quién","Chi è?"],["che cosa / cosa","qué","Che cosa fai?"],["dove","dónde","Dove abiti?"],["quando","cuándo","Quando parti?"],["perché","por qué","Perché studi italiano?"],["come","cómo","Come stai?"],["quanto / quanti","cuánto / cuántos","Quanto costa?"],["quale","cuál","Qual è il tuo nome?"]],k:[2]}],
 n:["<i>Perché</i> sirve para preguntar y para responder: <i>Perché? — Perché mi piace</i>.","<i>Qual è</i> se escribe sin apóstrofo."]},
{i:"<p>Los verbos reflexivos llevan un pronombre antes del verbo conjugado, igual que en español: <i>mi sveglio</i> = me despierto. En infinitivo, el pronombre se pega al final: <i>svegliarsi</i>.</p>",
 t:[{c:"svegliarsi (despertarse)",h:["","Forma"],r:PR6.map((p,i)=>[p,["mi sveglio","ti svegli","si sveglia","ci svegliamo","vi svegliate","si svegliano"][i]]),k:[1]},
  {c:"vestirsi (vestirse)",h:["","Forma"],r:PR6.map((p,i)=>[p,["mi vesto","ti vesti","si veste","ci vestiamo","vi vestite","si vestono"][i]]),k:[1]}],
 n:["Con modales el pronombre puede ir delante o pegado: <i>Mi devo alzare</i> = <i>Devo alzarmi</i>.","Conectores de secuencia: <i>prima</i> (primero), <i>poi</i> (luego), <i>dopo</i> (después), <i>alla fine</i> (al final)."]},
{i:"<p><b>Questo</b> (este) funciona como un adjetivo normal. <b>Quello</b> (ese / aquel) cambia como el artículo determinado.</p>",
 t:[{c:"questo",h:["","Singular","Plural"],r:[["masculino","questo libro","questi libri"],["femenino","questa camicia","queste camicie"]],k:[1,2]},
  {c:"quello (como el artículo)",h:["Artículo","quello","Ejemplo"],r:[["il / i","quel / quei","quel negozio, quei pantaloni"],["lo / gli","quello / quegli","quello zaino, quegli zaini"],["l'","quell'","quell'albergo"],["la / le","quella / quelle","quella borsa, quelle scarpe"]],k:[2]}],
 n:["<i>Che taglia porta?</i> = ¿qué talla usa? <i>Che numero porta?</i> = ¿qué número calza?","<i>La prendo</i> = me la llevo; <i>lo prendo</i> = me lo llevo."]},
{i:"<p><b>Potere, volere, dovere</b> van seguidos de un infinitivo: <i>Posso entrare? Devo lavorare. Voglio mangiare.</i> Los tres son irregulares.</p>",
 t:[{c:"potere / volere / dovere",h:["","potere","volere","dovere"],r:PR6.map((p,i)=>[p,["posso","puoi","può","possiamo","potete","possono"][i],["voglio","vuoi","vuole","vogliamo","volete","vogliono"][i],["devo","devi","deve","dobbiamo","dovete","devono"][i]]),k:[1,2,3]},
  {c:"Números grandes",h:["Cifra","Italiano"],r:[["20 / 30 / 40","venti / trenta / quaranta"],["50 / 60 / 70","cinquanta / sessanta / settanta"],["80 / 90","ottanta / novanta"],["100 / 200 / 500","cento / duecento / cinquecento"],["1000 / 2000","mille / duemila"]],k:[1]}],
 n:["Los números se escriben juntos: 250 = <i>duecentocinquanta</i>.","<i>Mille</i> en plural es <i>-mila</i>: duemila, tremila."]},
{i:"<p><b>Vorrei</b> (quisiera) es la forma más cortés de pedir algo; también <b>prendo</b> (tomo) o <b>per me</b> (para mí).</p><p>Los pronombres de objeto directo reemplazan a la cosa o persona y van <b>delante del verbo</b>: <i>La pizza? La prendo.</i></p>",
 t:[{c:"Pronombres de objeto",h:["Persona","Directo","Indirecto"],r:[["yo","mi","mi"],["tú","ti","ti"],["él","lo","gli"],["ella / usted","la / La","le / Le"],["nosotros","ci","ci"],["ustedes","vi","vi"],["ellos","li","gli"],["ellas","le","gli"]],k:[1,2]}],
 n:["Con infinitivo el pronombre se pega al final: <i>Voglio prenderlo</i>.","<i>Siete in due?</i> = ¿son dos personas? En Italia el <i>coperto</i> (cubierto) se cobra aparte."]},
{i:"<p>El <b>passato prossimo</b> es el pasado más usado al hablar. Se forma con <b>avere</b> (o essere) + <b>participio</b>. Sirve tanto para «comí» como para «he comido».</p>",
 t:[{c:"Participios regulares",h:["Infinitivo","Participio","Ejemplo"],r:[["-are","-ato","mangiare → ho mangiato"],["-ere","-uto","avere → ho avuto"],["-ire","-ito","dormire → ho dormito"]],k:[2]},
  {c:"Participios irregulares frecuentes",h:["Infinitivo","Participio"],r:[["fare","fatto"],["vedere","visto"],["prendere","preso"],["leggere","letto"],["scrivere","scritto"],["aprire","aperto"],["dire","detto"],["mettere","messo"],["bere","bevuto"],["chiudere","chiuso"]],k:[0,1]}],
 n:["<i>Ho già mangiato</i> = ya comí. <i>Non ho ancora mangiato</i> = todavía no he comido.","Con avere el participio no cambia: <i>Anna ha mangiato, loro hanno mangiato</i>."]},
{i:"<p>Usan <b>essere</b> los verbos de movimiento o cambio de estado (andare, venire, partire, arrivare, tornare, uscire, entrare, nascere, diventare, restare, stare) y <b>todos los reflexivos</b>.</p><p>Con essere, el participio <b>concuerda</b> con el sujeto como un adjetivo.</p>",
 t:[{c:"andare en passato prossimo",h:["","Masculino","Femenino"],r:PR6.map((p,i)=>[p,["sono andato","sei andato","è andato","siamo andati","siete andati","sono andati"][i],["sono andata","sei andata","è andata","siamo andate","siete andate","sono andate"][i]]),k:[1,2]},
  {c:"Reflexivos en pasado",h:["Presente","Pasado"],r:[["mi sveglio","mi sono svegliato/a"],["ti diverti","ti sei divertito/a"],["si alza","si è alzato/a"],["ci riposiamo","ci siamo riposati/e"]],k:[0,1]}],
 n:["Grupo mixto (hombres y mujeres): masculino plural: <i>siamo andati</i>.","<i>Dove sei nato?</i> → <i>Sono nato a Lima</i>."]},
{i:"<p>Para el clima se usa <b>fare</b>: <i>fa caldo, fa freddo, fa bel tempo</i>; o verbos propios: <i>piove</i> (llueve), <i>nevica</i> (nieva).</p><p>Para comparar: <b>più … di</b> (más … que), <b>meno … di</b> (menos … que) y <b>… come</b> (tan … como).</p>",
 t:[{c:"El clima",h:["Italiano","Español"],r:[["Che tempo fa?","¿Qué tiempo hace?"],["Fa caldo / fa freddo","Hace calor / hace frío"],["C'è il sole / c'è vento","Hay sol / hay viento"],["Piove / nevica","Llueve / nieva"],["È nuvoloso","Está nublado"],["Ci sono trenta gradi","Hace treinta grados"]],k:[0]},
  {c:"Comparativos",h:["Italiano","Español","Ejemplo"],r:[["più … di","más … que","Oggi fa più caldo di ieri."],["meno … di","menos … que","Roma è meno cara di Milano."],["… come","tan … como","È bella come Firenze."],["il più …","el más …","È il mese più freddo."],["migliore / peggiore","mejor / peor","Questo è migliore."]],k:[2]}],
 n:["Estaciones: <i>primavera, estate, autunno, inverno</i>.","Recuerda: Italia está en el hemisferio norte; su verano es de junio a setiembre."]},
{i:"<p>El <b>imperativo</b> sirve para dar órdenes o indicaciones. Con <b>tu</b> los verbos en -are terminan en <b>-a</b>; los demás en <b>-i</b>. Con <b>Lei</b> (formal) se cambia la vocal: -are → <b>-i</b>, -ere/-ire → <b>-a</b>.</p><p>Para el dolor se usa <b>fare male</b> como «doler»: <i>mi fa male</i> + singular, <i>mi fanno male</i> + plural.</p>",
 t:[{c:"Imperativo",h:["Verbo","tu","Lei (formal)"],r:[["riposare","riposa!","riposi!"],["prendere","prendi!","prenda!"],["dormire","dormi!","dorma!"],["bere","bevi!","beva!"],["andare","va'!","vada!"]],k:[1,2]},
  {c:"Doler",h:["Italiano","Español"],r:[["Mi fa male la testa.","Me duele la cabeza."],["Mi fa male la gola.","Me duele la garganta."],["Mi fanno male i piedi.","Me duelen los pies."],["Ti fa male?","¿Te duele?"]],k:[0]}],
 n:["Imperativo negativo con tu: <i>non</i> + infinitivo: <i>Non mangiare!</i> (¡no comas!).","Plurales irregulares: <i>la mano → le mani, il braccio → le braccia</i>."]},
{i:"<p>El <b>imperfetto</b> se usa para describir (cómo era algo), para hábitos del pasado (lo que hacías siempre) y para la acción de fondo que es interrumpida.</p><p><b>Passato prossimo</b> = acción terminada y concreta. <b>Imperfetto</b> = descripción o costumbre. <i>Mentre leggevo, è arrivato Marco</i> (mientras leía, llegó Marco).</p>",
 t:[{c:"Imperfetto regular",h:["","parlare","avere","dormire"],r:PR6.map((p,i)=>[p,["parlavo","parlavi","parlava","parlavamo","parlavate","parlavano"][i],["avevo","avevi","aveva","avevamo","avevate","avevano"][i],["dormivo","dormivi","dormiva","dormivamo","dormivate","dormivano"][i]]),k:[1,2,3]},
  {c:"Irregulares",h:["","essere","fare"],r:PR6.map((p,i)=>[p,["ero","eri","era","eravamo","eravate","erano"][i],["facevo","facevi","faceva","facevamo","facevate","facevano"][i]]),k:[1,2]}],
 n:["<i>Bere → bevevo; dire → dicevo</i>.","Pista: si en español dirías «-aba / -ía», casi siempre es imperfetto."]},
{i:"<p>Para hablar del tiempo hay tres palabras clave: <b>da</b> (desde hace, con presente), <b>fa</b> (hace, con pasado) y <b>per</b> (durante).</p><p>Con el imperfetto describes cómo era tu trabajo antes; con el presente + da, cuánto tiempo llevas en el actual.</p>",
 t:[{c:"Expresiones de tiempo",h:["Italiano","Español","Ejemplo"],r:[["da + tiempo","desde hace","Lavoro qui da tre anni."],["tiempo + fa","hace (pasado)","Ho cominciato due anni fa."],["per + tiempo","durante","Ho lavorato lì per cinque anni."],["prima","antes","Prima facevo l'insegnante."],["adesso / ora","ahora","Adesso sono economista."]],k:[2]}],
 n:["Con profesiones se usa a menudo <i>fare</i> + artículo: <i>faccio l'ingegnere</i> = soy ingeniero.","<i>Che lavoro fai?</i> = ¿en qué trabajas?"]},
{i:"<p>El <b>futuro semplice</b> expresa planes y suposiciones. Se forma con el infinitivo sin la -e final + <b>-ò, -ai, -à, -emo, -ete, -anno</b>. Los verbos en -are cambian la <b>a</b> por <b>e</b>: <i>parlare → parlerò</i>.</p>",
 t:[{c:"Futuro regular",h:["","parlare","prendere","partire"],r:PR6.map((p,i)=>[p,["parlerò","parlerai","parlerà","parleremo","parlerete","parleranno"][i],["prenderò","prenderai","prenderà","prenderemo","prenderete","prenderanno"][i],["partirò","partirai","partirà","partiremo","partirete","partiranno"][i]]),k:[1,2,3]},
  {c:"Raíces irregulares",h:["Infinitivo","Futuro (io)"],r:[["essere","sarò"],["avere","avrò"],["andare","andrò"],["fare","farò"],["potere","potrò"],["volere","vorrò"],["venire","verrò"]],k:[1]}],
 n:["Para planes cercanos el italiano usa mucho el presente: <i>Sabato vado al mare</i>.","No uses «vado a + infinitivo» para el futuro: solo significa ir a un lugar."]},
{i:"<p>El futuro también sirve para hacer <b>suposiciones sobre el presente</b>: <i>Saranno le dieci</i> (serán las diez), <i>Dove sarà Marco?</i> (¿dónde estará Marco?).</p><p><b>Fra</b> o <b>tra</b> + tiempo = «dentro de»: <i>fra due ore</i>.</p>",
 t:[{c:"Futuro de suposición y fra / tra",h:["Italiano","Español"],r:[["Saranno le dieci.","Serán las diez."],["Avrà trent'anni.","Tendrá unos treinta años."],["Dove sarà la mia valigia?","¿Dónde estará mi maleta?"],["fra due ore","dentro de dos horas"],["tra un mese","dentro de un mes"]],k:[0]}],
 n:["<i>Fra</i> y <i>tra</i> significan lo mismo; se elige la que suena mejor.","En el aeropuerto escucharás <i>il volo è in ritardo</i> (retrasado) y <i>uscita</i> (puerta de embarque)."]},
{i:"<p>El <b>condizionale</b> sirve para deseos, consejos y peticiones corteses. Usa la misma raíz del futuro + <b>-ei, -esti, -ebbe, -emmo, -este, -ebbero</b>.</p><p><i>Vorrei</i>, que conoces desde el restaurante, es el condicional de volere.</p>",
 t:[{c:"parlare: futuro y condicional",h:["","Futuro","Condicional"],r:PR6.map((p,i)=>[p,["parlerò","parlerai","parlerà","parleremo","parlerete","parleranno"][i],["parlerei","parleresti","parlerebbe","parleremmo","parlereste","parlerebbero"][i]]),k:[1,2]},
  {c:"Raíces irregulares",h:["Infinitivo","Condicional (io)"],r:[["essere","sarei"],["avere","avrei"],["andare","andrei"],["fare","farei"],["potere","potrei"],["volere","vorrei"],["dovere","dovrei"]],k:[1]}],
 n:["Consejo: <i>dovresti</i> + infinitivo = deberías: <i>Dovresti riposare</i>.","Deseo: <i>mi piacerebbe</i> + infinitivo = me gustaría."]},
{i:"<p>Con <b>secondo me</b> o <b>per me</b> se usa el indicativo normal: <i>Secondo me, l'italiano è facile</i>.</p><p>Con <b>penso che, credo che, spero che, mi sembra che</b> el italiano usa el <b>congiuntivo</b> (subjuntivo), aunque en español usemos el indicativo: <i>Penso que es…</i> → <i>Penso che sia…</i></p>",
 t:[{c:"Congiuntivo presente regular",h:["","parlare","prendere","partire"],r:[["che io / tu / lui","parli","prenda","parta"],["che noi","parliamo","prendiamo","partiamo"],["che voi","parliate","prendiate","partiate"],["che loro","parlino","prendano","partano"]],k:[1,2,3]},
  {c:"Formas clave irregulares",h:["Infinitivo","che io","Ejemplo"],r:[["essere","sia","Penso che sia difficile."],["avere","abbia","Credo che abbia ragione."],["andare","vada","Spero che vada bene."],["fare","faccia","Penso che faccia freddo."]],k:[2]}],
 n:["Como io, tu y lui tienen la misma forma, a veces se pone el pronombre: <i>Penso che tu sia…</i>","Si el sujeto es el mismo, se usa <i>di</i> + infinitivo: <i>Penso di andare</i> (pienso ir)."]},
{i:"<p>Después de expresar una emoción o una frase impersonal + <b>che</b>, va congiuntivo: <i>Sono contento che tu sia qui</i>.</p><p>Si quien siente y quien actúa es la misma persona, se usa <b>di + infinitivo</b>: <i>Sono contento di essere qui</i>.</p>",
 t:[{c:"Emociones + congiuntivo",h:["Italiano","Español"],r:[["Sono felice che tu sia qui.","Me alegra que estés aquí."],["Mi dispiace che tu sia triste.","Siento que estés triste."],["Ho paura che piova.","Temo que llueva."],["È importante che tu studi.","Es importante que estudies."],["È meglio che tu vada.","Es mejor que te vayas."]],k:[0]},
  {c:"Mismo sujeto: di + infinitivo",h:["Italiano","Español"],r:[["Sono contento di vederti.","Me alegra verte."],["Ho paura di sbagliare.","Tengo miedo de equivocarme."]],k:[0]}],
 n:["Adjetivos de emoción concuerdan: <i>contento / contenta / contenti / contente</i>."]},
{i:"<p>El <b>si impersonal</b> equivale al «se» del español: <i>si dice</i> (se dice), <i>si vendono case</i> (se venden casas). El verbo concuerda con lo que viene después.</p><p>La <b>voz pasiva</b> se forma con <b>essere</b> o <b>venire</b> + participio: <i>L'indice viene calcolato ogni mese</i>. Es muy usada en informes y noticias.</p>",
 t:[{c:"Impersonal y pasiva",h:["Italiano","Español"],r:[["Si dice che…","Se dice que…"],["Si prevede un aumento.","Se prevé un aumento."],["Si vendono case.","Se venden casas."],["L'indice viene calcolato ogni mese.","El índice se calcula cada mes."],["I dati sono stati pubblicati.","Los datos fueron publicados."]],k:[0]},
  {c:"Leer cifras",h:["Cifra","Italiano"],r:[["0,3%","zero virgola tre per cento"],["1,5%","uno virgola cinque per cento"],["−0,2%","meno zero virgola due per cento"],["2026","duemilaventisei"]],k:[1]}],
 n:["En italiano los decimales se escriben con coma, como en Perú: <i>0,5</i>.","Verbos de informe: <i>aumentare, diminuire, calare, salire, scendere, restare stabile</i>."]},
{i:"<p>Cuando hay un pronombre indirecto y uno directo juntos, el indirecto va primero y cambia la <b>i</b> por <b>e</b>: <i>mi + lo → me lo</i>. <i>Gli</i> y <i>le</i> se convierten en <b>glie-</b> y se unen: <i>glielo</i>.</p><p><b>Ne</b> sustituye una cantidad («de eso») y <b>ci</b> un lugar («allí»).</p>",
 t:[{c:"Pronombres combinados",h:["","+ lo","+ la","+ li","+ le","+ ne"],r:[["mi","me lo","me la","me li","me le","me ne"],["ti","te lo","te la","te li","te le","te ne"],["gli / le","glielo","gliela","glieli","gliele","gliene"],["ci","ce lo","ce la","ce li","ce le","ce ne"],["vi","ve lo","ve la","ve li","ve le","ve ne"]],k:[1,2,3,4,5]},
  {c:"Ne y ci",h:["Pronombre","Significado","Ejemplo"],r:[["ne","de eso / cantidad","Quante mele vuoi? Ne voglio due."],["ci","allí / a ese lugar","Vai a Roma? Sì, ci vado domani."]],k:[2]}],
 n:["En pasado con avere, el participio concuerda con lo / la / li / le: <i>La torta? L'ho mangiata.</i>","Con infinitivo se pegan al final: <i>Voglio dartelo</i>."]},
{i:"<p>Algunos verbos llevan pronombres fijos y cambian de significado. Son muy frecuentes al hablar y te harán sonar natural.</p>",

f:[["Hai visto Maria? Sì, l'ho vista.","¿Viste a María? Sí, la vi."],["Dove sono le chiavi? Le ho lasciate qui.","¿Dónde están las llaves? Las dejé aquí."],["Li ho comprati ieri.","Los compré ayer."],["Non l'ho trovato.","No lo encontré."],["L'hai presa tu?","¿La agarraste tú?"],["Le abbiamo già viste.","Ya las vimos."]],
c:[["Hai visto i miei occhiali?","¿Viste mis lentes?"],["Sì, li ho visti in cucina.","Sí, los vi en la cocina."],["E la mia borsa? L'hai presa tu?","¿Y mi bolso? ¿Lo agarraste tú?"],["No, non l'ho presa. Forse l'hai lasciata in macchina.","No, no lo agarré. Quizá lo dejaste en el carro."],["Hai ragione! E le chiavi della macchina?","¡Tienes razón! ¿Y las llaves del carro?"],["Le ho messe sul tavolo.","Las puse sobre la mesa."],["Grazie! Senza di te sarei perso.","¡Gracias! Sin ti estaría perdido."],["Lo so, lo so!","¡Lo sé, lo sé!"]],
n:"Con lo, la, li, le delante, el participio cambia: la → vista, li → visti, le → viste.",
gt:"Pronombres directos + passato prossimo",gi:"<p><b>Paso 1.</b> El pronombre va <b>antes</b> del auxiliar: <i>Ho visto Luca → <b>L'</b>ho visto</i>.</p><p><b>Paso 2.</b> <b>Lo</b> y <b>la</b> se apostrofan delante de ho, hai, ha, hanno: <i>l'ho, l'hai</i>. <b>Li</b> y <b>le</b> nunca: <i>li ho, le ho</i>.</p><p><b>Paso 3.</b> El participio <b>concuerda</b> con el pronombre: <i>la pizza → l'ho mangiat<b>a</b> · i libri → li ho lett<b>i</b> · le foto → le ho fatt<b>e</b></i>.</p>",

gn:["<b>Ne:</b> también concuerda: <i>Quante mele hai comprato? Ne ho comprate tre</i>.","<b>Negativo:</b> non + pronombre + auxiliar: <i>Non l'ho visto</i>."],

tk:"Habla 1 minuto: di qué compraste o hiciste esta semana usando pronombres (Il pane? L'ho comprato…).",
L:{t:"Il trasloco",x:"Ieri io e mia moglie abbiamo traslocato. I mobili li abbiamo portati con un camion, ma le scatole le abbiamo messe in macchina. La sera non trovavo più il caricabatterie del telefono: l'ho cercato dappertutto. Alla fine l'ho trovato dentro la scatola delle pentole!",q:[["¿Cómo llevaron los muebles?","~Con un camión."],["¿Dónde pusieron las cajas?","~En el carro."],["¿Dónde estaba el cargador?","~En la caja de las ollas."]]}},

f:[["Stamattina mi sono svegliato tardi.","Esta mañana me desperté tarde."],["Ci siamo divertiti tantissimo.","Nos divertimos muchísimo."],["Si è sposata l'anno scorso.","Se casó el año pasado."],["Ti sei riposato?","¿Descansaste?"],["Non mi sono sentito bene.","No me sentí bien."],["Si sono trasferiti a Milano.","Se mudaron a Milán."]],
c:[["Buongiorno! Hai una faccia stanca.","¡Buenos días! Tienes cara de cansado."],["Sì, stanotte mi sono addormentato alle tre.","Sí, anoche me dormí a las tres."],["Perché? Cosa è successo?","¿Por qué? ¿Qué pasó?"],["Sono andato a una festa e mi sono divertito troppo!","¡Fui a una fiesta y me divertí demasiado!"],["E stamattina a che ora ti sei alzato?","¿Y esta mañana a qué hora te levantaste?"],["Mi sono alzato alle sette e mi sono preparato in dieci minuti.","Me levanté a las siete y me preparé en diez minutos."],["Si vede! Ti sei vestito con due calzini diversi.","¡Se nota! Te vestiste con dos medias distintas."],["Oh no! Non me ne sono accorto!","¡Oh no! ¡No me di cuenta!"]],
n:"Todos los verbos reflexivos usan ESSERE en pasado, y el participio concuerda: Maria si è alzata.",
gt:"Reflexivos en passato prossimo",gi:"<p><b>Paso 1.</b> Los verbos que terminan en <b>-si</b> (alzarsi, vestirsi) son reflexivos: llevan <i>mi, ti, si, ci, vi, si</i>.</p><p><b>Paso 2.</b> En pasado <b>siempre</b> usan <b>essere</b>: <i>mi <b>sono</b> alzato</i> (nunca «mi ho alzato»).</p><p><b>Paso 3.</b> El participio concuerda con la persona: <i>Luca si è alzat<b>o</b> · Anna si è alzat<b>a</b> · noi ci siamo alzat<b>i</b></i>.</p>",
tb:[{c:"Alzarsi en pasado",h:["Persona","Forma"],r:[["io","mi sono alzato/a"],["tu","ti sei alzato/a"],["lui / lei","si è alzato/a"],["noi","ci siamo alzati/e"],["voi","vi siete alzati/e"],["loro","si sono alzati/e"]],k:[1]}],
gn:["<b>Recíprocos:</b> <i>ci siamo conosciuti</i> = nos conocimos; <i>si sono baciati</i> = se besaron.","<b>Accorgersi</b> (darse cuenta): <i>me ne sono accorto</i>."],
ej:[["Mi sono trasferito a Chimbote nel 2015.","Me mudé a Chimbote en 2015."],["Vi siete divertiti alla festa?","¿Se divirtieron en la fiesta?"],["Mia sorella si è laureata ieri.","Mi hermana se graduó ayer."]],

p:[["Completa: Ieri Anna ___ (alzarsi) alle sei.","si è alzata"],["Completa: Noi ___ (divertirsi) molto.","ci siamo divertiti"],["Corrige: Mi ho vestito.","Mi sono vestito."],["Di: «¿A qué hora te despertaste?»","A che ora ti sei svegliato?"],["Di: «Nos conocimos en Lima».","Ci siamo conosciuti a Lima."]],
tk:"Habla 1 minuto: cuenta tu mañana de hoy desde que te despertaste hasta que saliste de casa, con verbos reflexivos.",
L:{t:"Un matrimonio in Toscana",x:"Mio cugino si è sposato a maggio in un piccolo paese della Toscana. Noi ci siamo preparati per settimane. Il giorno del matrimonio ci siamo svegliati presto e ci siamo vestiti eleganti. Gli sposi si sono baciati sotto un albero e tutti si sono commossi. La sera abbiamo ballato e ci siamo divertiti fino a tardi.",q:[["¿Dónde se casó el primo?","~En un pueblo de la Toscana."],["¿Qué hicieron los novios bajo un árbol?","~Se besaron."],["¿Cómo terminó la noche?","~Bailaron y se divirtieron hasta tarde."]]}},

f:[["L'anno scorso ho viaggiato in Italia.","El año pasado viajé a Italia."],["Avevo prenotato tutto prima.","Había reservado todo antes."],["Mentre visitavamo Firenze, pioveva.","Mientras visitábamos Florencia, llovía."],["Ci siamo goduti il paesaggio.","Disfrutamos del paisaje."],["È stato un viaggio indimenticabile.","Fue un viaje inolvidable."],["Le foto? Le ho fatte tutte col telefono.","¿Las fotos? Las tomé todas con el celular."]],
c:[["Allora, com'è stato il viaggio in Italia?","Entonces, ¿cómo fue el viaje a Italia?"],["Indimenticabile! Siamo stati a Roma, Firenze e Venezia.","¡Inolvidable! Estuvimos en Roma, Florencia y Venecia."],["Che tempo faceva?","¿Qué tiempo hacía?"],["A Roma faceva caldo, ma a Venezia pioveva sempre.","En Roma hacía calor, pero en Venecia llovía siempre."],["Avevate prenotato gli alberghi?","¿Habían reservado los hoteles?"],["Sì, li avevamo prenotati tre mesi prima.","Sí, los habíamos reservado tres meses antes."],["E la cosa più bella?","¿Y lo más bonito?"],["Una sera, mentre camminavamo a Firenze, abbiamo visto il tramonto sull'Arno.","Una tarde, mientras caminábamos en Florencia, vimos el atardecer sobre el Arno."]],
n:"Para narrar bien: imperfetto para el escenario, passato prossimo para los hechos y trapassato para lo que había pasado antes.",
gt:"Repaso: los tiempos del pasado",gi:"<p><b>Paso 1 · Passato prossimo:</b> hechos terminados → <i>siamo andati, abbiamo visto</i>.</p><p><b>Paso 2 · Imperfetto:</b> descripciones, clima, acciones en curso → <i>faceva caldo, camminavamo</i>.</p><p><b>Paso 3 · Trapassato:</b> lo anterior a otro pasado → <i>avevamo prenotato</i>. Con pronombres, el participio concuerda: <i>li avevamo prenotati</i>.</p>",

L:{t:"Cartolina da Venezia",x:"Cara Sofia, ti scrivo da Venezia! Siamo arrivati ieri sera. Avevo letto che c'era tanta gente, ma non immaginavo così tanta. Stamattina, mentre facevamo colazione, è cominciata l'acqua alta e la piazza San Marco si è riempita d'acqua. Abbiamo comprato degli stivali e ci siamo divertiti come bambini. Un abbraccio, Daniel.",q:[["¿Cuándo llegaron?","~Ayer por la noche."],["¿Qué pasó mientras desayunaban?","~Empezó el agua alta."],["¿Qué compraron?","~Unas botas."]]}},

{t:"Futuro anteriore y futuro de probabilidad",g:"Decir lo que habrás hecho y hacer suposiciones: Sarà stanco, avrà perso il treno.",
w:[["entro","dentro de / para (plazo)"],["fra / tra","dentro de"],["finire","terminar"],["laurearsi","graduarse"],["risparmiare","ahorrar"],["forse","quizás"],["probabilmente","probablemente"],["chissà","quién sabe"],["il progetto","el proyecto"],["la scadenza","el plazo"],["consegnare","entregar"],["appena","en cuanto"]],
v:["finire","terminar","Futuro anteriore",["avrò finito","avrai finito","avrà finito","avremo finito","avrete finito","avranno finito"]],
f:[["Entro venerdì avrò finito il progetto.","Para el viernes habré terminado el proyecto."],["Appena avrò finito, ti chiamo.","En cuanto haya terminado, te llamo."],["Dov'è Paolo? Sarà al lavoro.","¿Dónde está Paolo? Estará en el trabajo."],["Che ore sono? Saranno le otto.","¿Qué hora es? Serán las ocho."],["Avrà perso il treno.","Habrá perdido el tren."],["Chissà dove sarà!","¡Quién sabe dónde estará!"]],
c:[["Luca non è ancora arrivato. Dove sarà?","Luca todavía no llegó. ¿Dónde estará?"],["Sarà nel traffico. A quest'ora c'è sempre traffico.","Estará en el tráfico. A esta hora siempre hay tráfico."],["O avrà dimenticato la riunione!","¡O habrá olvidado la reunión!"],["Possibile. Comunque, il rapporto è pronto?","Posible. De todos modos, ¿el informe está listo?"],["Quasi. Entro le cinque l'avrò finito.","Casi. Para las cinco lo habré terminado."],["Perfetto. Appena l'avrai finito, mandalo al direttore.","Perfecto. En cuanto lo hayas terminado, mándalo al director."],["Certo. Ah, ecco Luca!","Claro. ¡Ah, ahí está Luca!"],["Finalmente! Sarai stanco, vero?","¡Por fin! Estarás cansado, ¿verdad?"]],
n:"En italiano el futuro sirve para suponer, como en español: «Sarà stanco» = estará cansado (supongo).",
gt:"Futuro anteriore y futuro de probabilidad",gi:"<p><b>Paso 1 · Futuro anteriore:</b> futuro de avere/essere + participio: <i>avrò finito, sarò arrivato</i> = habré terminado, habré llegado.</p><p><b>Paso 2.</b> Se usa para algo que estará terminado <b>antes</b> de un momento futuro, sobre todo con <i>entro, quando, appena, dopo che</i>: <i>Appena sarò arrivato, ti chiamo</i>.</p><p><b>Paso 3 · Probabilidad:</b> el futuro simple supone algo del presente (<i>Sarà a casa</i> = estará en casa) y el futuro anteriore supone algo del pasado (<i>Avrà dormito poco</i> = habrá dormido poco).</p>",
tb:[{c:"Futuro anteriore",h:["Persona","con AVERE","con ESSERE"],r:[["io","avrò finito","sarò partito/a"],["tu","avrai finito","sarai partito/a"],["lui / lei","avrà finito","sarà partito/a"],["noi","avremo finito","saremo partiti/e"],["voi","avrete finito","sarete partiti/e"],["loro","avranno finito","saranno partiti/e"]],k:[1,2]},{c:"Suposiciones",h:["Italiano","Significa"],r:[["Sarà stanco.","Supongo que está cansado."],["Saranno le dieci.","Deben de ser las diez."],["Avrà perso il treno.","Seguramente perdió el tren."]],k:[0]}],
gn:["<b>Al hablar</b> muchos italianos usan el futuro simple en lugar del anteriore: <i>Quando finisco, ti chiamo</i> también es correcto.","<b>Chissà</b> + futuro = me pregunto: <i>Chissà se verrà</i>."],

p:[["Completa: Entro domani io ___ (finire) il libro.","avrò finito"],["Completa: Appena loro ___ (arrivare), cominciamo.","saranno arrivati"],["Supón: «Debe de tener 40 años».","Avrà quarant'anni."],["Di: «Habrá perdido el bus».","Avrà perso l'autobus."],["¿Qué expresa «Sarà a casa»?","~Una suposición: probablemente está en casa."]],
tk:"Habla 1 minuto: di qué habrás logrado dentro de un año (Fra un anno avrò…) y haz 3 suposiciones sobre tus amigos ahora mismo.",
L:{t:"Dov'è finito il gatto?",x:"Il nostro gatto Pepe non torna a casa da ieri sera. Mia figlia è preoccupata. Io le dico: «Sarà dalla vicina, che gli dà sempre da mangiare» oppure «Avrà trovato una gatta innamorata!». Stamattina, appena avrò finito di lavorare, lo cercherò nel parco. Chissà dove sarà!",q:[["¿Desde cuándo no vuelve el gato?","~Desde ayer por la noche."],["¿Qué supone el padre?","~Que estará donde la vecina o habrá encontrado una gata."],["¿Cuándo lo buscará?","~En cuanto haya terminado de trabajar."]]}},

{t:"Condizionale passato: avrei voluto",g:"Expresar deseos y arrepentimientos del pasado: avrei voluto, sarei venuto.",
w:[["volere","querer"],["dovere","deber"],["potere","poder"],["peccato","qué pena"],["il rimpianto","el arrepentimiento"],["purtroppo","lamentablemente"],["l'occasione","la oportunidad"],["accettare","aceptar"],["rifiutare","rechazar"],["l'invito","la invitación"],["meglio","mejor"],["pentirsi","arrepentirse"]],
v:["volere","querer","Condizionale passato",["avrei voluto","avresti voluto","avrebbe voluto","avremmo voluto","avreste voluto","avrebbero voluto"]],
f:[["Avrei voluto venire, ma ero malato.","Habría querido ir, pero estaba enfermo."],["Avresti dovuto dirmelo!","¡Me lo habrías tenido que decir!"],["Sarei venuto volentieri.","Habría ido con gusto."],["Avremmo potuto vincere.","Habríamos podido ganar."],["Peccato! Sarebbe stato bello.","¡Qué pena! Habría sido bonito."],["Mi ha detto che sarebbe arrivato alle otto.","Me dijo que llegaría a las ocho."]],
c:[["Perché non sei venuto alla cena di sabato?","¿Por qué no viniste a la cena del sábado?"],["Avrei voluto, ma ho dovuto lavorare fino a tardi.","Habría querido, pero tuve que trabajar hasta tarde."],["Peccato! Ti saresti divertito.","¡Qué pena! Te habrías divertido."],["Lo so. Avrei dovuto chiedere un giorno libero.","Lo sé. Habría tenido que pedir un día libre."],["Paolo aveva detto che sarebbe venuto, e invece…","Paolo había dicho que vendría, y en cambio…"],["Neanche lui? Avremmo potuto organizzare un'altra data.","¿Él tampoco? Habríamos podido organizar otra fecha."],["La prossima volta ti avviso prima.","La próxima vez te aviso antes."],["Sì, così non avrò scuse!","¡Sí, así no tendré excusas!"]],
n:"Ojo: en italiano el «futuro en el pasado» usa condizionale passato: Ha detto che sarebbe venuto (dijo que vendría).",
gt:"Condizionale passato",gi:"<p><b>Paso 1.</b> Se forma con el <b>condizionale</b> de avere/essere + participio: <i>avrei mangiato, sarei andato</i>.</p><p><b>Paso 2.</b> Expresa algo que <b>habría pasado</b> pero no pasó: deseos no cumplidos y arrepentimientos. Con <i>dovere</i> = reproche: <i>Avresti dovuto studiare</i> (debiste estudiar).</p><p><b>Paso 3 · Futuro en el pasado:</b> donde el español dice «dijo que vendría», el italiano dice <i>ha detto che <b>sarebbe venuto</b></i>. ¡No uses el condicional simple ahí!</p>",
tb:[{c:"Condizionale passato",h:["Persona","con AVERE","con ESSERE"],r:[["io","avrei voluto","sarei andato/a"],["tu","avresti voluto","saresti andato/a"],["lui / lei","avrebbe voluto","sarebbe andato/a"],["noi","avremmo voluto","saremmo andati/e"],["voi","avreste voluto","sareste andati/e"],["loro","avrebbero voluto","sarebbero andati/e"]],k:[1,2]}],
gn:["<b>Avrei dovuto / potuto / voluto</b> son las tres frases más usadas del condizionale passato.","<b>Doble M:</b> avre<b>mm</b>o (condicional) ≠ avre<b>m</b>o (futuro)."],
ej:[["Avrei preferito restare a casa.","Habría preferido quedarme en casa."],["Saremmo arrivati prima con la macchina.","Habríamos llegado antes con el carro."],["Pensavo che avresti chiamato.","Pensaba que llamarías."]],

tk:"Habla 1 minuto: cuenta 3 cosas que habrías hecho diferente en tu vida (Avrei studiato…, sarei andato…).",
L:{t:"Il colloquio mancato",x:"Martedì avevo un colloquio di lavoro molto importante. Avrei dovuto partire presto, ma la sveglia non ha suonato. Sono arrivato con mezz'ora di ritardo e il direttore era già andato via. Avrei voluto spiegargli tutto. La segretaria mi ha detto che mi avrebbero richiamato. Spero proprio di sì!",q:[["¿Qué habría tenido que hacer?","~Salir temprano."],["¿Por qué llegó tarde?","~La alarma no sonó."],["¿Qué le dijo la secretaria?","~Que lo volverían a llamar."]]}},

c:[["Sono stressato. Non dormo bene da giorni.","Estoy estresado. Hace días que no duermo bien."],["Dovresti fare un po' di sport.","Deberías hacer un poco de deporte."],["Non ho tempo! Lavoro dieci ore al giorno.","¡No tengo tiempo! Trabajo diez horas al día."],["Allora parlane con il tuo capo. Diglielo chiaramente.","Entonces habla de eso con tu jefe. Díselo claramente."],["Hai ragione. E se mi dice di no?","Tienes razón. ¿Y si me dice que no?"],["Non preoccuparti prima del tempo. Provaci!","No te preocupes antes de tiempo. ¡Inténtalo!"],["Va bene, domani gli parlo.","Está bien, mañana le hablo."],["Bravo! E fammi sapere com'è andata.","¡Bien! Y avísame cómo te fue."]],
n:"Con dai, dì, fai, stai, vai el pronombre duplica la consonante: dammi, dimmi, fallo, stammi, vacci.",
gt:"Consejos e imperativo con pronombres",gi:"<p><b>Paso 1 · Consejos:</b> usa el condicional de dovere: <i>dovresti, dovreste</i>; o <i>se fossi in te…</i> + condicional.</p><p><b>Paso 2 · Imperativo afirmativo (tu, noi, voi):</b> el pronombre va <b>pegado al final</b>: <i>prendilo, scrivimi, diteglielo</i>. Con los imperativos cortos (da', di', fa', sta', va') la consonante se <b>duplica</b>: <i>dammi, dillo, fallo</i>.</p><p><b>Paso 3 · Negativo (tu):</b> <i>non</i> + infinitivo, y el pronombre puede ir antes o pegado: <i>Non preoccuparti</i> = <i>Non ti preoccupare</i>.</p>",
tb:[{c:"Imperativo + pronombre",h:["Sin pronombre","Con pronombre","Español"],r:[["prendi il libro","prendilo","tómalo"],["scrivi a me","scrivimi","escríbeme"],["di' a me","dimmi","dime"],["fa' questo","fallo","hazlo"],["da' a me","dammi","dame"],["va' lì","vacci","ve allí"]],k:[1]}],
gn:["<b>Gli no duplica:</b> <i>digli</i> (dile), no «diggli».","<b>Con Lei</b> (formal) el pronombre va antes: <i>Mi dica, Si accomodi</i> (lo verás el día 39)."],
ej:[["Dovresti bere più acqua.","Deberías tomar más agua."],["Dammelo, per favore.","Dámelo, por favor."],["Non dirglielo!","¡No se lo digas!"]],

p:[["Da un consejo: (tú) dormir más.","Dovresti dormire di più."],["Une: di' + mi","dimmi"],["Une: fa' + lo","fallo"],["Niega: Preoccupati!","Non preoccuparti!"],["Di: «¡Avísame!»","Fammi sapere!"]],
tk:"Habla 1 minuto: un amigo quiere aprender italiano. Dale 5 consejos con dovresti y 3 órdenes con imperativo + pronombre.",
L:{t:"La posta del cuore",x:"Cara Anna, il mio ragazzo non mi chiama mai. Che cosa devo fare? Giulia. — Cara Giulia, non preoccuparti troppo. Prima di tutto, parlagli con calma e digli come ti senti. Non fargli scenate! Se fossi in te, gli proporrei una cena tranquilla. E poi fammi sapere com'è andata! Anna.",q:[["¿Cuál es el problema de Giulia?","~Su novio nunca la llama."],["¿Qué le aconseja primero Anna?","~Hablarle con calma y decirle cómo se siente."],["¿Qué haría Anna en su lugar?","~Le propondría una cena tranquila."]]}},

c:[["Buongiorno, mi dica.","Buenos días, dígame."],["Buongiorno. Vorrei aprire un conto corrente.","Buenos días. Quisiera abrir una cuenta corriente."],["Certo. Si accomodi. Ha un documento d'identità?","Claro. Tome asiento. ¿Tiene un documento de identidad?"],["Sì, ecco il passaporto.","Sí, aquí está el pasaporte."],["Perfetto. Compili questo modulo e firmi qui in fondo.","Perfecto. Llene este formulario y firme aquí abajo."],["Scusi, devo scrivere anche il codice fiscale?","Disculpe, ¿también tengo que escribir el código fiscal?"],["Sì, lo scriva qui. Poi vada allo sportello tre.","Sí, escríbalo aquí. Luego vaya a la ventanilla tres."],["Grazie mille, molto gentile.","Muchas gracias, muy amable."]],
n:"El imperativo formal (Lei) usa la forma del congiuntivo: venga, vada, prenda, scusi.",
gt:"Imperativo formal (Lei)",gi:"<p><b>Paso 1.</b> Con <b>Lei</b> (usted) el imperativo toma la forma del <b>congiuntivo presente</b>: los verbos en <b>-are</b> terminan en <b>-i</b> (<i>scusi, aspetti, giri</i>) y los de <b>-ere/-ire</b> en <b>-a</b> (<i>prenda, senta, apra</i>).</p><p><b>Paso 2.</b> Es como el «usted» del español: <i>tome, espere, disculpe</i>. ¡Casi igual!</p><p><b>Paso 3.</b> Los pronombres van <b>antes</b>: <i>Mi dica, Si accomodi, Lo scriva qui</i>. Negativo: <i>Non si preoccupi</i>.</p>",

gn:["<b>Loro</b> (ustedes formal) agrega -no: <i>vengano, si accomodino</i>. En la práctica se usa más <i>voi</i>.","<b>Senta!</b> y <b>Scusi!</b> sirven para llamar a un mozo o a un desconocido."],

tk:"Habla 1 minuto: eres recepcionista de un hotel. Recibe a un cliente con Lei: saluda, pídele documentos e indícale cómo llegar a su habitación.",
L:{t:"Avviso in ufficio postale",x:"Gentili clienti, prendano il numero all'ingresso e aspettino il proprio turno. Per spedire un pacco, compilino il modulo verde e lo consegnino allo sportello due. Per pagare le bollette, vadano allo sportello uno. Non si dimentichino di portare un documento. Grazie per la collaborazione.",q:[["¿Qué hay que hacer al entrar?","~Tomar un número y esperar el turno."],["¿Qué formulario es para paquetes?","~El verde, en la ventanilla dos."],["¿Qué no hay que olvidar?","~Llevar un documento."]]}},

f:[["Vorrei prenotare una camera matrimoniale.","Quisiera reservar una habitación doble."],["Mi scusi, l'aria condizionata è rotta.","Disculpe, el aire acondicionado está malogrado."],["Potrebbe cambiarmi la camera?","¿Podría cambiarme la habitación?"],["Avrei voluto una camera più tranquilla.","Habría querido una habitación más tranquila."],["Non si preoccupi, lo risolviamo subito.","No se preocupe, lo resolvemos enseguida."],["Avevo prenotato con vista mare.","Había reservado con vista al mar."]],
c:[["Buonasera, mi dica.","Buenas noches, dígame."],["Buonasera. Ho un problema con la camera 204.","Buenas noches. Tengo un problema con la habitación 204."],["Mi dispiace. Che cosa è successo?","Lo siento. ¿Qué pasó?"],["Avevo prenotato una camera con vista mare, ma la mia dà sul parcheggio.","Había reservado una habitación con vista al mar, pero la mía da al estacionamiento."],["Mi faccia controllare… Ha ragione, è stato un errore nostro.","Déjeme revisar… Tiene razón, fue un error nuestro."],["Inoltre la doccia non funziona e c'è molto rumore.","Además la ducha no funciona y hay mucho ruido."],["Le chiedo scusa. Le diamo subito la 310, con vista mare.","Le pido disculpas. Le damos enseguida la 310, con vista al mar."],["Grazie, molto gentile. Sarebbe possibile anche la colazione inclusa?","Gracias, muy amable. ¿Sería posible también el desayuno incluido?"]],

{t:"Congiuntivo presente: verbos regulares",g:"Formar el congiuntivo presente y usarlo para opinar: penso che, credo che, mi sembra che.",

v:["pensare","pensar","Congiuntivo presente",["che io pensi","che tu pensi","che lui pensi","che noi pensiamo","che voi pensiate","che loro pensino"]],
f:[["Penso che tu abbia ragione.","Creo que tienes razón."],["Credo che parli bene italiano.","Creo que habla bien italiano."],["Spero che tu stia bene.","Espero que estés bien."],["Mi sembra che lavori troppo.","Me parece que trabaja demasiado."],["Voglio che tu mi ascolti.","Quiero que me escuches."],["Secondo me, è giusto.","Para mí, es correcto."]],
c:[["Secondo te, è difficile imparare l'italiano?","Según tú, ¿es difícil aprender italiano?"],["Penso che sia abbastanza facile per chi parla spagnolo.","Creo que es bastante fácil para quien habla español."],["Sì, ma credo che la grammatica sia complicata.","Sí, pero creo que la gramática es complicada."],["Dipende. Mi sembra che il congiuntivo spaventi tutti!","Depende. ¡Me parece que el subjuntivo asusta a todos!"],["Esatto! Spero che il professore lo spieghi bene.","¡Exacto! Espero que el profesor lo explique bien."],["Credo che tu lo stia già usando senza accorgertene.","Creo que ya lo estás usando sin darte cuenta."],["Davvero? Allora sono più bravo di quanto pensassi!","¿En serio? ¡Entonces soy mejor de lo que pensaba!"],["Certo! Basta che tu continui a praticare.","¡Claro! Basta con que sigas practicando."]],
n:"Diferencia con el español: «creo que» en italiano pide congiuntivo (penso che sia), en español no (creo que es).",
gt:"Congiuntivo presente (regulares)",gi:"<p><b>Paso 1.</b> El congiuntivo es el «subjuntivo». Se usa después de <b>che</b> cuando la frase expresa <b>opinión, deseo, duda o emoción</b>: <i>penso che, spero che, voglio che, ho paura che</i>.</p><p><b>Paso 2 · Formación:</b> verbos en <b>-are</b> → <b>-i</b> (che io parli); en <b>-ere/-ire</b> → <b>-a</b> (che io scriva, che io dorma). ¡Es al revés que el presente normal!</p><p><b>Paso 3.</b> Las tres personas singulares son iguales (<i>che io / tu / lui parli</i>), por eso a menudo se pone el pronombre para aclarar: <i>Penso che <b>tu</b> abbia ragione</i>.</p>",
tb:[{c:"Congiuntivo presente",h:["","parlare","scrivere","dormire"],r:[["che io","parli","scriva","dorma"],["che tu","parli","scriva","dorma"],["che lui / lei","parli","scriva","dorma"],["che noi","parliamo","scriviamo","dormiamo"],["che voi","parliate","scriviate","dormiate"],["che loro","parlino","scrivano","dormano"]],k:[1,2,3]},{c:"¿Indicativo o congiuntivo?",h:["Indicativo (seguro)","Congiuntivo (opinión)"],r:[["So che è vero.","Penso che sia vero."],["È chiaro che parla.","Spero che parli."],["Sono sicuro che viene.","Dubito che venga."]],k:[0,1]}],
gn:["<b>Verbos en -isc</b> (finire, capire): <i>che io finisca, capisca</i>.","<b>Mismo sujeto:</b> si las dos partes tienen el mismo sujeto, se usa <i>di + infinitivo</i>: <i>Penso di avere ragione</i> (no «penso che io abbia»)."],
ej:[["Spero che tu capisca.","Espero que entiendas."],["Dubito che arrivino in tempo.","Dudo que lleguen a tiempo."],["Penso di partire domani.","Pienso partir mañana."]],
oj:"✗ Penso che è vero → ✓ <i>Penso che sia vero</i>.",
s2:{i:"Las terminaciones del congiuntivo.",r:[["-INO / -ANO","parlino, scrivano: la fuerza NO va al final: PAR-li-no","v"],["-IATE","parliate: par-LIA-te","a"]],f:[["-i","che io parli"],["-a","che io scriva"],["-ino","che parlino"],["-ano","che dormano"],["-iate","che parliate"]]},
p:[["Completa: Penso che Marco ___ (lavorare) troppo.","lavori"],["Completa: Spero che voi ___ (dormire) bene.","dormiate"],["Completa: Voglio che loro ___ (scrivere) subito.","scrivano"],["¿Por qué «Penso di partire» y no «penso che io parta»?","~Porque el sujeto es el mismo: se usa di + infinitivo."],["Di: «Me parece que tienes razón».","Mi sembra che tu abbia ragione."]],
tk:"Habla 1 minuto: da tu opinión sobre tu ciudad usando penso che, credo che, mi sembra che y spero che.",
L:{t:"Il lavoro da casa",x:"Molti italiani lavorano da casa almeno due giorni a settimana. Secondo un sondaggio, il 60% pensa che lo smart working migliori la qualità della vita. Tuttavia, alcuni credono che si lavori di più e che sia difficile separare la vita privata dal lavoro. Gli esperti sperano che le aziende trovino un equilibrio.",q:[["¿Cuántos días trabajan desde casa muchos italianos?","~Al menos dos días por semana."],["¿Qué piensa el 60%?","~Que el teletrabajo mejora la calidad de vida."],["¿Qué critican algunos?","~Que se trabaja más y es difícil separar vida privada y trabajo."]]}},

c:[["Mia figlia vuole studiare a Bologna.","Mi hija quiere estudiar en Bolonia."],["Che bello! Credo che sia una delle università più antiche del mondo.","¡Qué bonito! Creo que es una de las universidades más antiguas del mundo."],["Sì, ma ho paura che sia troppo lontano.","Sí, pero tengo miedo de que sea demasiado lejos."],["È normale. Però è importante che lei faccia la sua esperienza.","Es normal. Pero es importante que ella haga su experiencia."],["Hai ragione. Spero solo che stia bene e che abbia amici.","Tienes razón. Solo espero que esté bien y que tenga amigos."],["Vedrai che si troverà benissimo.","Verás que le irá muy bien."],["Speriamo! E voglio che venga a casa almeno a Natale.","¡Ojalá! Y quiero que venga a casa por lo menos en Navidad."],["Sicuramente! Nessuno vuole che i figli vadano via per sempre.","¡Seguro! Nadie quiere que los hijos se vayan para siempre."]],
n:"Los irregulares se aprenden de memoria, pero son pocos: sia, abbia, faccia, vada, venga, possa, voglia, sappia, stia, dia.",
gt:"Congiuntivo presente irregular",gi:"<p><b>Paso 1.</b> Los verbos más usados son irregulares. La buena noticia: casi todos salen de la forma <b>io</b> del presente: <i>faccio → faccia, vado → vada, vengo → venga, esco → esca</i>.</p><p><b>Paso 2.</b> Los que hay que memorizar: <i>essere → <b>sia</b>, avere → <b>abbia</b>, sapere → <b>sappia</b>, dare → <b>dia</b>, stare → <b>stia</b></i>.</p><p><b>Paso 3.</b> Expresiones que siempre piden congiuntivo: <i>è meglio che, è importante che, è necessario che, ho paura che, non credo che</i>.</p>",

L:{t:"Messaggio di una mamma",x:"Ciao amore, spero che tu stia bene e che il viaggio sia andato bene. È importante che tu mangi bene e che tu vada a dormire presto. Non voglio che tu faccia tardi tutte le sere! Ho paura che tu abbia freddo: Milano non è Chimbote. Chiamami quando puoi. Un bacio, mamma.",q:[["¿Qué espera la mamá?","~Que esté bien y que el viaje haya ido bien."],["¿Qué no quiere?","~Que se acueste tarde todas las noches."],["¿De qué tiene miedo?","~De que tenga frío en Milán."]]}},

w:[["bisogna","hay que"],["è necessario che","es necesario que"],["è vietato","está prohibido"],["è obbligatorio","es obligatorio"],["occorre","hace falta"],["conviene","conviene"],["il permesso","el permiso"],["la regola","la regla"],["rispettare","respetar"],["la multa","la multa"],["il documento","el documento"],["in regola","en regla"]],

c:[["Scusi, che documenti servono per il permesso di soggiorno?","Disculpe, ¿qué documentos se necesitan para el permiso de residencia?"],["Bisogna portare il passaporto e quattro foto.","Hay que traer el pasaporte y cuatro fotos."],["È necessario che io venga di persona?","¿Es necesario que venga en persona?"],["Sì, è obbligatorio. E occorre anche la marca da bollo.","Sí, es obligatorio. Y también hace falta la estampilla fiscal."],["Dove si compra?","¿Dónde se compra?"],["In tabaccheria. Conviene comprarla prima di venire.","En la tabaquería. Conviene comprarla antes de venir."],["Perfetto. C'è bisogno di prendere un appuntamento?","Perfecto. ¿Hay que sacar cita?"],["Sì, è meglio che lo prenda online.","Sí, es mejor que la saque en línea."]],
n:"Bisogna + infinitivo = regla general (hay que). Bisogna che + congiuntivo = para alguien concreto.",
gt:"Expresiones impersonales",gi:"<p><b>Paso 1 · General:</b> expresión + <b>infinitivo</b>: <i>Bisogna studiare, È vietato fumare, Conviene partire presto</i>.</p><p><b>Paso 2 · Para alguien concreto:</b> expresión + <b>che + congiuntivo</b>: <i>Bisogna che <b>tu</b> studi, È necessario che <b>voi</b> veniate</i>.</p><p><b>Paso 3.</b> Lo mismo con <i>è importante, è meglio, è possibile, è probabile</i>: con infinitivo si es general, con che + congiuntivo si es para una persona.</p>",

L:{t:"Regole della biblioteca",x:"Per entrare in biblioteca bisogna mostrare la tessera. È vietato mangiare e parlare al telefono nelle sale di lettura. È necessario che i libri presi in prestito vengano restituiti entro trenta giorni. Chi restituisce un libro in ritardo deve pagare una piccola multa. Conviene prenotare i libri online.",q:[["¿Qué hay que mostrar para entrar?","~El carné."],["¿Qué está prohibido?","~Comer y hablar por teléfono en las salas."],["¿En cuánto tiempo hay que devolver los libros?","~En treinta días."]]}},

f:[["Penso che abbia vinto l'Italia.","Creo que ganó Italia."],["Sono contento che tu sia venuto.","Me alegra que hayas venido."],["Mi dispiace che non abbiate trovato posto.","Siento que no hayan encontrado sitio."],["È strano che non abbia chiamato.","Es raro que no haya llamado."],["Spero che sia andato tutto bene.","Espero que todo haya ido bien."],["Peccato che sia finita!","¡Qué pena que se haya terminado!"]],
c:[["Hai saputo dell'esame di Lucia?","¿Supiste del examen de Lucía?"],["No. Credo che l'abbia fatto stamattina.","No. Creo que lo dio esta mañana."],["Sì, ma non ha ancora chiamato. È strano che non abbia scritto niente.","Sí, pero todavía no ha llamado. Es raro que no haya escrito nada."],["Forse è stanca. Spero che sia andato bene.","Quizá está cansada. Espero que le haya ido bien."],["Anch'io. Ha studiato tantissimo.","Yo también. Estudió muchísimo."],["Ecco, mi sta chiamando! … Ha preso trenta e lode!","¡Mira, me está llamando! … ¡Sacó treinta con honores!"],["Fantastico! Sono contentissimo che sia andata così.","¡Fantástico! Me alegra muchísimo que haya ido así."],["Dobbiamo festeggiare stasera!","¡Tenemos que celebrar esta noche!"]],
n:"Congiuntivo passato = congiuntivo de avere/essere + participio. Es el «haya + participio» del español.",
gt:"Congiuntivo passato",gi:"<p><b>Paso 1.</b> Se forma con el congiuntivo presente de <b>avere</b> o <b>essere</b> + participio: <i>che io abbia mangiato, che lei sia partita</i>.</p><p><b>Paso 2.</b> Se usa cuando la opinión es <b>de ahora</b> pero el hecho es <b>pasado</b>: <i>Penso (ahora) che sia partito (antes)</i>.</p><p><b>Paso 3.</b> Con emociones: <i>sono contento che, mi dispiace che, è strano che, peccato che</i> + congiuntivo passato para algo que ya pasó.</p>",

L:{t:"La partita",x:"Ieri sera l'Italia ha giocato contro la Spagna. Molti tifosi pensano che l'arbitro abbia sbagliato a non dare il rigore. Altri credono che la squadra non abbia giocato bene. L'allenatore ha detto che è contento che i giocatori abbiano lottato fino alla fine. Peccato che abbiano perso uno a zero!",q:[["¿Contra quién jugó Italia?","~Contra España."],["¿Qué piensan muchos hinchas?","~Que el árbitro se equivocó al no dar el penal."],["¿Cómo terminó el partido?","~Italia perdió uno a cero."]]}},

f:[["A mio parere, è una buona idea.","En mi opinión, es una buena idea."],["Non sono del tutto d'accordo.","No estoy del todo de acuerdo."],["Da un lato è vero, dall'altro…","Por un lado es verdad, por el otro…"],["Capisco il tuo punto di vista, però…","Entiendo tu punto de vista, pero…"],["Non credo che sia la soluzione.","No creo que sea la solución."],["Hai ragione, non ci avevo pensato.","Tienes razón, no lo había pensado."]],
c:[["Secondo te, i bambini dovrebbero avere il cellulare?","Según tú, ¿los niños deberían tener celular?"],["A mio parere no, almeno fino ai dodici anni.","En mi opinión no, por lo menos hasta los doce años."],["Non sono del tutto d'accordo. Credo che sia utile per la sicurezza.","No estoy del todo de acuerdo. Creo que es útil para la seguridad."],["Da un lato è vero, dall'altro ho paura che passino troppo tempo online.","Por un lado es verdad, por el otro tengo miedo de que pasen demasiado tiempo en línea."],["Dipende dai genitori. Bisogna che controllino l'uso.","Depende de los padres. Hace falta que controlen el uso."],["Hai ragione, ma non è facile controllare tutto.","Tienes razón, pero no es fácil controlarlo todo."],["Allora forse un telefono semplice, senza internet?","¿Entonces quizá un teléfono simple, sin internet?"],["Ecco, su questo sono d'accordo con te!","¡Eso, en eso estoy de acuerdo contigo!"]],
n:"Para debatir bien: reconoce primero lo que dice el otro (capisco, hai ragione) y luego da tu punto (però, tuttavia).",
gt:"Repaso: el congiuntivo para opinar",gi:"<p><b>Paso 1 · Opinión segura</b> (indicativo): <i>So che, È evidente che, Sono sicuro che</i> + indicativo.</p><p><b>Paso 2 · Opinión, duda, deseo, emoción</b> (congiuntivo): <i>Penso che, Dubito che, Spero che, Ho paura che, È importante che</i>.</p><p><b>Paso 3 · Sin che:</b> <i>secondo me, a mio parere, per me</i> van con <b>indicativo</b>: <i>Secondo me <b>è</b> giusto</i> (no «sia»).</p>",
tb:[{c:"Para debatir",h:["Función","Italiano"],r:[["Opinar","Secondo me… / Penso che…"],["Acordar","Sono d'accordo / Hai ragione"],["Desacordar","Non sono d'accordo / Non credo che…"],["Matizar","Dipende… / Da un lato…, dall'altro…"],["Contraargumentar","Capisco, però… / Tuttavia…"],["Concluir","Insomma… / Quindi…"]],k:[1]}],
gn:["<b>Secondo me</b> + indicativo; <b>penso che</b> + congiuntivo. ¡No los mezcles!","<b>Non ci avevo pensato</b> = no lo había pensado (con trapassato)."],

tk:"Habla 1 minuto: ¿es mejor vivir en una ciudad grande o pequeña? Da ventajas y desventajas y una conclusión.",
L:{t:"Forum: la siesta al lavoro",x:"Marco: Secondo me, la pausa dopo pranzo dovrebbe essere obbligatoria. Si lavora meglio! — Elena: Non sono d'accordo. Penso che sia un lusso che le aziende non possono permettersi. — Paolo: Da un lato capisco Marco, dall'altro credo che basti una pausa di venti minuti. — Elena: Su questo hai ragione, Paolo.",q:[["¿Qué opina Marco?","~Que la pausa después del almuerzo debería ser obligatoria."],["¿Por qué no está de acuerdo Elena?","~Cree que es un lujo que las empresas no pueden permitirse."],["¿Qué propone Paolo?","~Una pausa de veinte minutos."]]}},

f:[["Volevo che tu venissi.","Quería que vinieras."],["Pensavo che fosse più facile.","Pensaba que era más fácil."],["Magari avessi più tempo!","¡Ojalá tuviera más tiempo!"],["Parla come se fosse il capo.","Habla como si fuera el jefe."],["Speravo che mi chiamassi.","Esperaba que me llamaras."],["Me ne sono andato prima che cominciasse a piovere.","Me fui antes de que empezara a llover."]],

n:"El congiuntivo imperfetto es facilísimo para hispanohablantes: tuviera = avessi, fuera = fossi, hablara = parlassi.",
gt:"Congiuntivo imperfetto",gi:"<p><b>Paso 1 · Formación:</b> quita -re del infinitivo y agrega <b>-ssi, -ssi, -sse, -ssimo, -ste, -ssero</b>: <i>parla-re → parlassi; ave-re → avessi; dormi-re → dormissi</i>.</p><p><b>Paso 2 · Cuándo:</b> cuando el verbo principal está en <b>pasado</b> o en <b>condicional</b>: <i>Volevo che tu <b>venissi</b>, Vorrei che tu <b>venissi</b></i>.</p><p><b>Paso 3 · Expresiones fijas:</b> <i>magari</i> (ojalá), <i>come se</i> (como si), <i>se</i> (hipótesis) + congiuntivo imperfetto: <i>Magari fosse vero!</i></p>",

gn:["<b>Irregulares:</b> fare → <i>facessi</i>, dire → <i>dicessi</i>, dare → <i>dessi</i>, stare → <i>stessi</i>, bere → <i>bevessi</i>.","<b>Vorrei che</b> + congiuntivo imperfetto: <i>Vorrei che tu restassi</i> = quisiera que te quedaras."],

tk:"Habla 1 minuto: cuenta 3 cosas que pensabas de Italia antes de estudiar italiano (Pensavo che…) y 3 deseos con Magari…",
L:{t:"Lettera al me stesso di vent'anni fa",x:"Caro Daniel, quando avevi vent'anni pensavi che la vita fosse facile e che il lavoro non fosse importante. Volevi che tutto succedesse subito. Magari ti avessi potuto dire di avere pazienza! Vorrei che tu sapessi che studiare lingue ti avrebbe aperto tante porte. Con affetto, il Daniel di oggi.",q:[["¿Qué pensaba Daniel a los veinte años?","~Que la vida era fácil y el trabajo no era importante."],["¿Qué quería?","~Que todo sucediera enseguida."],["¿Qué quisiera que supiera?","~Que estudiar idiomas le abriría muchas puertas."]]}},

{t:"Pronombres relativos: che, cui, il quale, chi",g:"Unir frases con pronombres relativos: la persona con cui lavoro, chi studia impara.",
w:[["che","que"],["cui","que / quien (con preposición)"],["il quale","el cual"],["chi","quien / el que"],["ciò che","lo que"],["il cui","cuyo"],["il collega","el colega"],["il motivo","el motivo"],["il quartiere","el barrio"],["conoscere","conocer"],["fidarsi","confiar"],["dipendere","depender"]],
v:["conoscere","conocer","Presente",["conosco","conosci","conosce","conosciamo","conoscete","conoscono"]],
f:[["La donna che parla è mia sorella.","La mujer que habla es mi hermana."],["Il collega con cui lavoro è simpatico.","El colega con quien trabajo es simpático."],["Ecco il motivo per cui sono qui.","Este es el motivo por el que estoy aquí."],["Chi studia, impara.","Quien estudia, aprende."],["Ciò che dici è vero.","Lo que dices es verdad."],["Il quartiere in cui vivo è tranquillo.","El barrio en el que vivo es tranquilo."]],
c:[["Chi è quella ragazza con cui parlavi?","¿Quién es esa chica con la que hablabas?"],["È la collega di cui ti ho parlato, quella che viene da Napoli.","Es la colega de la que te hablé, la que viene de Nápoles."],["Ah, quella che cucina benissimo?","Ah, ¿la que cocina muy bien?"],["Esatto! Il ristorante in cui siamo andati era di suo zio.","¡Exacto! El restaurante al que fuimos era de su tío."],["Ciò che mi piace di lei è che è sempre allegra.","Lo que me gusta de ella es que siempre está alegre."],["Sì, è una persona di cui ti puoi fidare.","Sí, es una persona en la que puedes confiar."],["Chi la conosce dice che è molto generosa.","Quien la conoce dice que es muy generosa."],["Verissimo. Te la presento domani.","Muy cierto. Te la presento mañana."]],
n:"Regla de oro: si hay preposición (con, di, in, per, a), usa CUI: con cui, di cui, in cui, per cui.",
gt:"Pronombres relativos",gi:"<p><b>Paso 1 · CHE</b> = que, para sujeto u objeto, sin preposición: <i>Il libro <b>che</b> leggo</i>.</p><p><b>Paso 2 · CUI</b> va <b>siempre después de una preposición</b>: <i>la persona <b>con cui</b> parlo, il film <b>di cui</b> parlavamo, la città <b>in cui</b> vivo</i>. Nunca digas «con che».</p><p><b>Paso 3 · Otros:</b> <i>chi</i> = la persona que (sin antecedente): <i>Chi cerca trova</i>. <i>Ciò che / quello che</i> = lo que. <i>Il quale / la quale</i> = más formal, reemplaza a che o cui.</p>",
tb:[{c:"Relativos",h:["Relativo","Cuándo","Ejemplo"],r:[["che","sin preposición","la casa che ho comprato"],["preposición + cui","con preposición","la casa in cui vivo"],["chi","«quien», sin antecedente","Chi dorme non piglia pesci."],["ciò che / quello che","«lo que»","Fai ciò che vuoi."],["il / la quale","formal","il signore al quale ho scritto"],["il cui","«cuyo»","l'autore il cui libro…"]],k:[0,2]}],
gn:["<b>Per cui</b> también significa «por eso»: <i>Ero stanco, per cui sono andato a letto</i>.","<b>Il cui</b> concuerda con lo poseído: <i>la ragazza il cui padre…, la ragazza la cui madre…</i>."],
ej:[["Questo è l'amico di cui ti fidi?","¿Este es el amigo en el que confías?"],["Non capisco ciò che dice.","No entiendo lo que dice."],["La ragione per cui ti chiamo è importante.","La razón por la que te llamo es importante."]],
oj:"✗ la persona con che lavoro → ✓ <i>la persona con cui lavoro</i>.",
s2:{i:"El sonido de CUI y CHI.",r:[["CUI","se dice «kui», una sola sílaba","v"],["CHI","se dice «ki»; CI se dice «chi»","a"]],f:[["cui","con cui"],["cui","di cui"],["chi","chi studia"],["ciò","ciò che"],["sc","conosco"]]},
p:[["Completa: La città ___ vivo è bella. (in…)","in cui"],["Completa: Il film ___ abbiamo visto era lungo.","che"],["Completa: ___ cerca, trova.","Chi"],["Corrige: L'amico con che parlo.","L'amico con cui parlo."],["Di: «Lo que dices es verdad».","Ciò che dici è vero."]],
tk:"Habla 1 minuto: describe a 3 personas importantes de tu vida usando che, con cui y di cui.",
L:{t:"Il mio quartiere",x:"Il quartiere in cui sono cresciuto si trova vicino al porto. È un posto che amo molto, perché ci sono le persone con cui ho passato la mia infanzia. Il mercato di cui ti parlavo apre alle sei di mattina. Chi ci va presto trova il pesce più fresco della città. Ciò che mi manca di più è il profumo del mare.",q:[["¿Dónde está el barrio?","~Cerca del puerto."],["¿Qué consigue quien va temprano al mercado?","~El pescado más fresco de la ciudad."],["¿Qué es lo que más extraña?","~El olor del mar."]]}},

{t:"Ci y ne a fondo",g:"Dominar ci y ne: Ci penso io, ne ho bisogno, ci vuole, me ne vado.",
w:[["ci penso io","yo me encargo"],["ci vuole","se necesita / hace falta"],["ci vogliono","se necesitan"],["ci metto","me demoro"],["ne ho bisogno","lo necesito"],["ne parliamo","hablamos de eso"],["non ne posso più","ya no puedo más"],["me ne vado","me voy"],["ci credo","lo creo"],["ci tengo","me importa"],["volerci","necesitarse (tiempo, cosas)"],["metterci","tardarse"]],
v:["mettere","poner","Passato prossimo",["ho messo","hai messo","ha messo","abbiamo messo","avete messo","hanno messo"]],
f:[["Quanto tempo ci vuole?","¿Cuánto tiempo se necesita?"],["Ci vogliono due ore.","Se necesitan dos horas."],["Ci metto venti minuti a piedi.","Me demoro veinte minutos a pie."],["Non ne posso più!","¡Ya no puedo más!"],["Ne parliamo domani.","Hablamos de eso mañana."],["Ci tengo molto.","Me importa mucho."]],
c:[["Quanto ci vuole per arrivare a Firenze?","¿Cuánto se necesita para llegar a Florencia?"],["In treno ci vogliono circa due ore.","En tren se necesitan unas dos horas."],["E tu quanto ci metti in macchina?","¿Y tú cuánto te demoras en carro?"],["Ci metto tre ore, per il traffico. Non ne posso più!","Me demoro tres horas, por el tráfico. ¡Ya no puedo más!"],["Allora prendi il treno! Hai bisogno del biglietto?","¡Entonces toma el tren! ¿Necesitas el boleto?"],["Sì, ne ho bisogno per venerdì.","Sí, lo necesito para el viernes."],["Ci penso io, lo compro online.","Yo me encargo, lo compro en línea."],["Grazie! Ci tengo ad arrivare in orario.","¡Gracias! Me importa llegar a tiempo."]],
n:"Ci vuole + singular, ci vogliono + plural: ci vuole un'ora, ci vogliono due ore.",
gt:"Ci y ne",gi:"<p><b>Paso 1 · CI</b> = allí / a eso: <i>Vai a Roma? Sì, <b>ci</b> vado</i>. <i>Pensi al lavoro? Sì, <b>ci</b> penso</i>.</p><p><b>Paso 2 · NE</b> = de eso / de ellos / cantidad: <i>Hai bisogno <b>di soldi</b>? Sì, <b>ne</b> ho bisogno · Quante mele? <b>Ne</b> voglio tre</i>.</p><p><b>Paso 3 · Expresiones fijas:</b> <i>ci vuole</i> (se necesita), <i>metterci</i> (tardarse), <i>andarsene</i> (irse): <i>me ne vado, te ne vai, se ne va</i>.</p>",
tb:[{c:"Ci o ne",h:["Pregunta","Respuesta","Reemplaza"],r:[["Vai al mare?","Sì, ci vado.","a + lugar"],["Pensi all'esame?","Sì, ci penso.","a + cosa"],["Parli di politica?","No, non ne parlo.","di + cosa"],["Quanti figli hai?","Ne ho due.","cantidad"],["Vieni dalla festa?","Sì, ne vengo.","da + lugar"]],k:[1,2]}],
gn:["<b>Ci + lo/la = ce lo / ce la</b>: <i>Ce la faccio</i> = lo logro.","<b>Ne con pasado concuerda:</b> <i>Ne ho mangiate tre</i> (de las manzanas)."],
ej:[["Ci vuole pazienza.","Se necesita paciencia."],["Me ne vado, è tardi.","Me voy, es tarde."],["Non ci credo!","¡No lo creo!"]],
oj:"✗ Ci vuole due ore → ✓ <i>Ci vogliono due ore</i>.",
s2:{i:"CI y NE se dicen pegados al verbo.",r:[["Une","ci vado = «chivado», ne ho = «neo»","v"],["GLI","ci vogliono: «chi vóllono»","a"]],f:[["ci","ci vado"],["ci","ci vuole"],["gli","ci vogliono"],["ne","ne ho due"],["ne","me ne vado"]]},
p:[["Responde con ci: Vai in palestra? (sí)","Sì, ci vado."],["Responde con ne: Quanti fratelli hai? (dos)","Ne ho due."],["Completa: Ci ___ tre ore. (volere)","vogliono"],["Di: «Me demoro diez minutos».","Ci metto dieci minuti."],["Di: «Ya no puedo más».","Non ne posso più."]],
tk:"Habla 1 minuto: explica cuánto te demoras en tus trayectos diarios (ci metto…) y qué se necesita para aprender un idioma (ci vuole…, ci vogliono…).",
L:{t:"Come si fa il tiramisù",x:"Per fare un buon tiramisù non ci vuole molto tempo, ma ci vogliono ingredienti di qualità. Ti servono mascarpone, uova, zucchero, caffè e savoiardi. Quanti savoiardi? Ne servono circa trenta. Io ci metto venti minuti a prepararlo, ma poi bisogna lasciarlo in frigo almeno sei ore. Ci tengo a dirlo: il cacao si mette solo alla fine!",q:[["¿Qué se necesita sobre todo?","~Ingredientes de calidad."],["¿Cuántos savoiardi se necesitan?","~Unos treinta."],["¿Cuánto tiempo va en la refrigeradora?","~Al menos seis horas."]]}},

f:[["In Italia si cena tardi.","En Italia se cena tarde."],["Qui si parla italiano.","Aquí se habla italiano."],["Si vendono biciclette usate.","Se venden bicicletas usadas."],["Come si dice «chévere» in italiano?","¿Cómo se dice «chévere» en italiano?"],["Non si beve il cappuccino dopo pranzo.","No se toma capuchino después del almuerzo."],["Si è sempre stanchi il lunedì.","Uno siempre está cansado los lunes."]],
c:[["È vero che in Italia non si beve il cappuccino dopo pranzo?","¿Es verdad que en Italia no se toma capuchino después del almuerzo?"],["Sì, si beve solo la mattina. Dopo pranzo si prende un espresso.","Sí, solo se toma en la mañana. Después del almuerzo se toma un espresso."],["E si lascia la mancia al ristorante?","¿Y se deja propina en el restaurante?"],["Non è obbligatoria. Di solito si paga il coperto.","No es obligatoria. Normalmente se paga el cubierto."],["Interessante. E a che ora si cena?","Interesante. ¿Y a qué hora se cena?"],["Al Sud si cena anche alle dieci!","¡En el sur se cena incluso a las diez!"],["In Perù si mangia tanto a pranzo, invece.","En Perú, en cambio, se come mucho en el almuerzo."],["Allora si vive bene in tutti e due i posti!","¡Entonces se vive bien en los dos lugares!"]],
n:"Igual que en español: «se come», «se venden». Si el sustantivo es plural, el verbo también: si vendono case.",
gt:"Si impersonale y si passivante",gi:"<p><b>Paso 1 · Impersonal:</b> <i>si</i> + verbo en 3ª persona singular = «se» o «uno» (la gente en general): <i>In Italia si mangia bene</i>.</p><p><b>Paso 2 · Pasiva con si:</b> si hay un objeto, el verbo concuerda con él: <i>si vende <b>una casa</b> / si vendono <b>due case</b></i>.</p><p><b>Paso 3 · Con adjetivos y reflexivos:</b> el adjetivo va en plural (<i>si è stanchi</i>) y los reflexivos usan <i>ci si</i>: <i>Ci si alza presto</i> (uno se levanta temprano).</p>",
tb:[{c:"Usos de si",h:["Tipo","Ejemplo","Español"],r:[["impersonal","Si vive bene qui.","Se vive bien aquí."],["pasiva singular","Si affitta un appartamento.","Se alquila un departamento."],["pasiva plural","Si affittano appartamenti.","Se alquilan departamentos."],["con adjetivo","Si è felici in vacanza.","Uno es feliz en vacaciones."],["reflexivo","Ci si diverte.","Uno se divierte."],["en pasado","Si è mangiato bene.","Se comió bien."]],k:[1]}],
gn:["<b>En pasado</b> siempre con essere: <i>Si è parlato molto</i>.","<b>Cartel típico:</b> <i>Affittasi</i> = se alquila; <i>Vendesi</i> = se vende."],
ej:[["Si dice che domani piova.","Se dice que mañana llueve."],["In questo negozio si accettano carte.","En esta tienda se aceptan tarjetas."],["Ci si vede domani!","¡Nos vemos mañana!"]],

tk:"Habla 1 minuto: explica a un italiano las costumbres de Perú usando si: in Perù si mangia…, si festeggia…, si dice…",
L:{t:"Il galateo a tavola",x:"In Italia a tavola si seguono alcune regole. Non si taglia la pasta con il coltello e non si mette il formaggio sul pesce. Il pane non si mangia prima del primo piatto. Si brinda guardandosi negli occhi. E soprattutto non si chiede il ketchup in una pizzeria napoletana!",q:[["¿Qué no se hace con la pasta?","~No se corta con cuchillo."],["¿Qué no se pone sobre el pescado?","~Queso."],["¿Cómo se brinda?","~Mirándose a los ojos."]]}},

f:[["Il Colosseo è stato costruito nel primo secolo.","El Coliseo fue construido en el siglo primero."],["La Gioconda è stata dipinta da Leonardo.","La Gioconda fue pintada por Leonardo."],["Il caffè viene servito al banco.","El café se sirve en la barra."],["Questi prodotti sono fatti in Italia.","Estos productos están hechos en Italia."],["La pizza margherita fu inventata a Napoli.","La pizza margarita fue inventada en Nápoles."],["Il museo verrà chiuso domani.","El museo será cerrado mañana."]],
c:[["Che bella chiesa! Quando è stata costruita?","¡Qué iglesia tan bonita! ¿Cuándo fue construida?"],["È stata costruita nel Quattrocento.","Fue construida en el siglo XV."],["E questi affreschi da chi sono stati dipinti?","¿Y estos frescos por quién fueron pintados?"],["Sono stati dipinti da un allievo di Giotto.","Fueron pintados por un alumno de Giotto."],["Incredibile. Viene ancora usata per la messa?","Increíble. ¿Todavía se usa para la misa?"],["Sì, la messa viene celebrata ogni domenica.","Sí, la misa se celebra cada domingo."],["Si possono fare foto?","¿Se pueden tomar fotos?"],["Sì, ma il flash è vietato: i dipinti potrebbero essere danneggiati.","Sí, pero el flash está prohibido: las pinturas podrían dañarse."]],
n:"La pasiva se forma con ESSERE (o VENIRE) + participio, y el participio concuerda: la chiesa è stata costruita.",
gt:"La forma pasiva",gi:"<p><b>Paso 1.</b> Activa: <i>Leonardo <b>ha dipinto</b> la Gioconda</i>. Pasiva: <i>La Gioconda <b>è stata dipinta</b> da Leonardo</i>. El objeto pasa a ser sujeto.</p><p><b>Paso 2 · Formación:</b> <b>essere</b> en el tiempo que necesites + <b>participio</b> que concuerda + <b>da</b> (por): <i>è costruito, era costruito, sarà costruito</i>.</p><p><b>Paso 3 · Con venire:</b> en tiempos simples se puede usar <i>venire</i> en lugar de essere: <i>Il pane <b>viene</b> fatto ogni mattina</i>. Con <i>andare</i> significa obligación: <i>Il modulo <b>va</b> compilato</i> = hay que llenarlo.</p>",

f:[["Ha detto che era stanco.","Dijo que estaba cansado."],["Mi ha chiesto se volevo un caffè.","Me preguntó si quería un café."],["Ha detto che sarebbe venuto.","Dijo que vendría."],["Mi ha detto di aspettare.","Me dijo que esperara."],["Ha promesso che avrebbe chiamato.","Prometió que llamaría."],["Mi ha chiesto dove abitavo.","Me preguntó dónde vivía."]],
c:[["Hai parlato con il direttore?","¿Hablaste con el director?"],["Sì. Mi ha detto che il progetto gli piaceva molto.","Sí. Me dijo que el proyecto le gustaba mucho."],["Fantastico! E che altro ha detto?","¡Fantástico! ¿Y qué más dijo?"],["Mi ha chiesto se potevo presentarlo alla riunione del giorno dopo.","Me preguntó si podía presentarlo en la reunión del día siguiente."],["E tu che cosa gli hai risposto?","¿Y tú qué le respondiste?"],["Gli ho risposto che ero pronto, ma che avevo bisogno di un proiettore.","Le respondí que estaba listo, pero que necesitaba un proyector."],["E lui?","¿Y él?"],["Mi ha detto di non preoccuparmi e che ci avrebbe pensato lui.","Me dijo que no me preocupara y que él se encargaría."]],
n:"En discurso indirecto los tiempos «retroceden»: presente → imperfetto, futuro → condizionale passato, «domani» → il giorno dopo.",
gt:"Discurso indirecto",gi:"<p><b>Paso 1.</b> Con un verbo introductor en <b>presente</b> (<i>dice che</i>), los tiempos no cambian: <i>«Sono stanco» → Dice che è stanco</i>.</p><p><b>Paso 2.</b> Con el introductor en <b>pasado</b> (<i>ha detto che</i>), los tiempos retroceden: presente → <b>imperfetto</b>; passato prossimo → <b>trapassato</b>; futuro → <b>condizionale passato</b>.</p><p><b>Paso 3 · Órdenes y preguntas:</b> el imperativo pasa a <b>di + infinitivo</b> (<i>«Aspetta!» → Mi ha detto di aspettare</i>); las preguntas sí/no usan <b>se</b> (<i>Mi ha chiesto se…</i>).</p>",
tb:[{c:"Cambios de tiempo",h:["Directo","Indirecto (ha detto che…)"],r:[["«Lavoro.»","lavorava"],["«Ho lavorato.»","aveva lavorato"],["«Lavorerò.»","avrebbe lavorato"],["«Lavora!»","di lavorare"],["«Lavori?»","se lavoravo"]],k:[1]},{c:"Cambios de palabras",h:["Directo","Indirecto"],r:[["oggi","quel giorno"],["domani","il giorno dopo"],["ieri","il giorno prima"],["qui","lì"],["questo","quello"]],k:[1]}],
gn:["<b>Pronombres:</b> cambian según quién habla: <i>«Ti aiuto» → Ha detto che mi avrebbe aiutato</i>.","<b>Al hablar</b> muchos italianos usan el condizionale simple (ha detto che verrebbe), pero lo correcto es <i>sarebbe venuto</i>."],
ej:[["Ha detto che non aveva fame.","Dijo que no tenía hambre."],["Mi ha chiesto di chiudere la porta.","Me pidió que cerrara la puerta."],["Le ho chiesto se fosse sposata.","Le pregunté si estaba casada."]],

p:[["Pasa a indirecto: «Sono stanco», ha detto Luca.","Luca ha detto che era stanco."],["Pasa a indirecto: «Verrò domani», ha detto.","Ha detto che sarebbe venuto il giorno dopo."],["Pasa a indirecto: «Chiudi la porta!»","Mi ha detto di chiudere la porta."],["Pasa a indirecto: «Hai fame?»","Mi ha chiesto se avevo fame."],["¿En qué se convierte «domani»?","il giorno dopo"]],
tk:"Habla 1 minuto: cuenta una conversación importante que tuviste esta semana: qué te dijeron, qué te preguntaron y qué respondiste.",
L:{t:"La telefonata della nonna",x:"Ieri mi ha chiamato la nonna. Mi ha chiesto se stavo bene e se mangiavo abbastanza. Le ho detto che lavoravo molto ma che ero contento. Lei mi ha detto di non lavorare troppo e di andarla a trovare. Alla fine mi ha promesso che avrebbe preparato le lasagne per la domenica dopo.",q:[["¿Qué le preguntó la abuela?","~Si estaba bien y si comía lo suficiente."],["¿Qué le pidió?","~Que no trabajara demasiado y que fuera a visitarla."],["¿Qué le prometió?","~Que prepararía lasañas el domingo siguiente."]]}},

{t:"Gerundio, stare per y infinitivo pasado",g:"Expresar cómo y cuándo pasan las cosas: studiando si impara, sto per uscire, dopo aver mangiato.",
w:[["uscire","salir"],["stare per","estar a punto de"],["dopo aver","después de haber"],["prima di","antes de"],["pur","aun (+ gerundio)"],["sbagliare","equivocarse"],["sbagliando s'impara","equivocándose se aprende"],["camminando","caminando"],["leggendo","leyendo"],["essendo","siendo"],["avendo","teniendo / habiendo"],["finalmente","finalmente"]],
v:["uscire","salir","Presente (irregular)",["esco","esci","esce","usciamo","uscite","escono"]],
f:[["Sto per uscire.","Estoy a punto de salir."],["Sbagliando s'impara.","Equivocándose se aprende."],["Dopo aver mangiato, ho fatto una passeggiata.","Después de haber comido, di un paseo."],["Prima di uscire, chiudi la finestra.","Antes de salir, cierra la ventana."],["Essendo tardi, siamo tornati a casa.","Siendo tarde, volvimos a casa."],["Pur avendo studiato, non ha passato l'esame.","Aun habiendo estudiado, no aprobó el examen."]],
c:[["Pronto? Sei già pronta?","¿Aló? ¿Ya estás lista?"],["Quasi! Sto per uscire di casa.","¡Casi! Estoy a punto de salir de casa."],["Dai, il film comincia tra venti minuti!","¡Vamos, la película empieza en veinte minutos!"],["Lo so. Prima di uscire devo dare da mangiare al cane.","Lo sé. Antes de salir tengo que darle de comer al perro."],["Va bene. Io ti aspetto davanti al cinema.","Está bien. Yo te espero delante del cine."],["Perfetto. Dopo aver visto il film andiamo a cena?","Perfecto. Después de haber visto la película, ¿vamos a cenar?"],["Certo! Pur essendo stanco, ho una fame da lupi.","¡Claro! Aun estando cansado, tengo un hambre feroz."],["Allora corro! Camminando veloce arrivo in dieci minuti.","¡Entonces corro! Caminando rápido llego en diez minutos."]],
n:"Después de prima di y dopo se usa infinitivo, no congiuntivo: prima di uscire, dopo aver mangiato.",
gt:"Gerundio, stare per e infinito passato",gi:"<p><b>Paso 1 · Gerundio</b> (-ando, -endo) sin «stare» expresa <b>modo, causa o tiempo</b>: <i>Sbagliando s'impara</i> (equivocándose), <i>Essendo malato, sono rimasto a casa</i> (como estaba enfermo).</p><p><b>Paso 2 · Stare per + infinitivo</b> = estar a punto de: <i>Il treno sta per partire</i>.</p><p><b>Paso 3 · Infinitivo pasado:</b> <i>aver / esser + participio</i> después de <b>dopo</b>: <i>dopo aver mangiato, dopo essere arrivato</i>. Con <b>prima di</b> va infinitivo simple: <i>prima di mangiare</i>.</p>",
tb:[{c:"Estructuras",h:["Estructura","Ejemplo","Español"],r:[["gerundio (modo)","Studiando si impara.","Estudiando se aprende."],["gerundio (causa)","Avendo fame, ho mangiato.","Como tenía hambre, comí."],["stare per","Sta per piovere.","Está a punto de llover."],["prima di + inf.","Prima di partire…","Antes de partir…"],["dopo + inf. pasado","Dopo essere arrivati…","Después de haber llegado…"],["pur + gerundio","Pur sapendolo…","Aun sabiéndolo…"]],k:[1]}],
gn:["<b>Pronombres con gerundio</b> se pegan al final: <i>vedendolo, parlandogli</i>.","<b>Dopo essere</b> concuerda: <i>dopo essere arrivata</i> (ella)."],
ej:[["Sta per cominciare la partita.","Está por empezar el partido."],["Leggendo molto, ho imparato tante parole.","Leyendo mucho, aprendí muchas palabras."],["Dopo essere usciti, abbiamo preso un gelato.","Después de haber salido, tomamos un helado."]],

p:[["Di: «Estoy a punto de salir».","Sto per uscire."],["Completa: Dopo ___ (finire) il lavoro, sono andato a casa.","aver finito"],["Completa: Prima di ___ (dormire), leggo un po'.","dormire"],["Di: «Equivocándose se aprende».","Sbagliando s'impara."],["Completa: ___ (essere) tardi, siamo tornati.","Essendo"]],
tk:"Habla 1 minuto: cuenta tu rutina de la noche usando prima di…, dopo aver…, y una frase con gerundio.",
L:{t:"Come ho imparato a cucinare",x:"Ho imparato a cucinare guardando mia nonna. Prima di cominciare, lei lavava sempre tutte le verdure. Dopo aver preparato il sugo, lo lasciava riposare. Pur essendo molto brava, sbagliava anche lei qualche volta, e diceva ridendo: «Sbagliando s'impara!». Adesso sto per aprire un piccolo ristorante.",q:[["¿Cómo aprendió a cocinar?","~Mirando a su abuela."],["¿Qué hacía la abuela antes de empezar?","~Lavaba todas las verduras."],["¿Qué está a punto de hacer?","~Abrir un pequeño restaurante."]]}},

{t:"Comparativos y superlativos",g:"Comparar con precisión: più… di, meno… che, migliore, il migliore, ottimo, -issimo.",

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Italiano en 30 días</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#1f2421;--mut:#6b6f6a;--line:#e8e1d4;--verde:#0f7b4f;--rojo:#c8372d;--oro:#d99a1e;--b:#0f7b4f;--i:#d99a1e;--a:#c8372d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(90deg,var(--verde) 0 33.3%,#fff 33.3% 66.6%,var(--rojo) 66.6%);height:6px}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:Fraunces,serif;font-size:2rem;margin:10px 0 4px}
h2{font-family:Fraunces,serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 16px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--verde);transition:.4s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.g{background:var(--verde);color:#fff;border-color:var(--verde)}
.btn.sm{padding:5px 9px;font-size:.85rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lvl{margin:22px 0 8px;display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;position:relative;border-top:4px solid var(--c)}
.day:hover{transform:translateY(-2px);box-shadow:0 4px 14px #0001}
.day b{font-family:Fraunces,serif;font-size:1.3rem}
.day small{display:block;color:var(--mut);margin-top:3px}
.day .ok{position:absolute;top:8px;right:10px;color:var(--verde);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.w{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.w .it{font-weight:600}.w .es{color:var(--mut);font-size:.88rem}
.spk{border:none;background:#f1ece2;border-radius:8px;cursor:pointer;padding:6px 8px;font-size:1rem}
.spk:hover{background:#e6dfd0}
.note{background:#fff8e6;border-left:4px solid var(--oro);padding:10px 12px;border-radius:8px;font-size:.95rem}
table{width:100%;border-collapse:collapse}
td{padding:8px;border-bottom:1px solid var(--line)}
td:first-child{color:var(--mut);width:110px}
.big{font-family:Fraunces,serif;font-size:2.2rem;text-align:center;margin:14px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font:inherit;text-align:left}
.opt.ok{background:#e3f4ea;border-color:var(--verde)}.opt.bad{background:#fbe5e2;border-color:var(--rojo)}
input[type=text]{width:100%;padding:12px;font:inherit;font-size:1.1rem;border:1px solid var(--line);border-radius:10px}
.fb{margin-top:10px;font-weight:500;min-height:1.4em}
.fb.ok{color:var(--verde)}.fb.bad{color:var(--rojo)}
.mut{color:var(--mut)}
.score{font-weight:600}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acc button{width:36px}
input[type=password]{width:100%;padding:12px;font:inherit;font-size:1.1rem;border:1px solid var(--line);border-radius:10px}
.pr{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--verde);font-weight:400}
details.w summary::-webkit-details-marker{color:var(--mut)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--verde);font-weight:600;margin:16px 0 0}
.jump{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:10px 0 0}
.blk{margin-top:30px;scroll-margin-top:60px}
.blk>div,.blk{scroll-margin-top:60px}
.sec{font-family:Fraunces,serif;font-weight:600;font-size:1.4rem;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec i{color:var(--verde)}
.sec small{font-family:Inter,sans-serif;font-style:normal;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-left:6px}
.prose{line-height:1.65;max-width:70ch}.prose p{margin:0 0 10px}
.tblgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 14px}
.cap{text-align:left;padding:10px 12px 4px;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.th{text-align:left;padding:8px;color:var(--mut);font-size:.8rem;font-weight:600}
.notes{line-height:1.6;max-width:70ch;padding-left:20px}.notes li{margin:4px 0}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:1.3rem;cursor:pointer;z-index:20;box-shadow:0 3px 10px #0003}
.idx{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:200px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;z-index:20;box-shadow:0 6px 20px #0002;display:flex;flex-direction:column}
.idx[hidden]{display:none}
.idx button{border:none;background:none;text-align:left;padding:9px 12px;border-radius:9px;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
.idx button.on{background:#e3f4ea;color:var(--verde);font-weight:600}
.idx .up{border-top:1px solid var(--line);border-radius:0;color:var(--mut)}
.rule{border-radius:10px;padding:10px 12px;margin:8px 0}
.rule.v{background:#e3f4ea;color:#0f5c3b}.rule.a{background:#fff3d6;color:#7a5200}
.rule small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.rule div{font-size:1rem;margin-top:3px}
.lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:16px 0 6px}
.sndt{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sr{display:grid;grid-template-columns:92px 1fr 44px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.sr.hd{background:#f1ece2;color:var(--mut);font-size:.8rem;border-top:none}
.clave{border-radius:10px;padding:10px 12px;margin:8px 0}
.clave small{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.clave div{margin-top:3px;line-height:1.5}.clave .cx{display:flex;align-items:center;gap:8px;font-style:italic;font-size:.92rem}
.clave.v{background:#e3f4ea;color:#0f5c3b}.clave.b{background:#e6eef9;color:#1d4a80}.clave.a{background:#fff3d6;color:#7a5200}
.hint{font-size:.85rem;color:var(--mut);margin:2px 0 10px}
.ej{display:inline-block;border:1px dashed #9a958a;border-radius:6px;padding:1px 9px;color:var(--ink);background:#faf8f3;font-style:normal}
body.typing .fab,body.typing .idx{display:none!important}
.tbar{height:8px;border-radius:4px;background:#fff;margin:10px 0 8px;overflow:hidden}.tbar i{display:block;height:100%;width:0;background:var(--verde)}
.ev{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.ev button{padding:10px 6px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.ev .ok{background:#e3f4ea;color:#0f5c3b;border:1px solid #9fd3b6}.ev .mid{background:#fff3d6;color:#7a5200;border:1px solid #f0cf86}.ev .bad{background:#fbe5e2;color:#9b2a22;border:1px solid #f0b3ac}
.hard{display:inline-block;background:#fff3d6;color:#7a5200;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600;margin:6px 0 0}
.micb{width:100%;height:52px;border:none;border-radius:26px;background:var(--rojo);color:#fff;font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer}
.micb.on{background:#7a1d16;animation:pul 1s infinite}@keyframes pul{50%{opacity:.7}}
.er{display:grid;grid-template-columns:28px 1fr 44px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}.er:first-child{border-top:none}
.er small.bad{color:var(--rojo)}
.chat{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.bb{max-width:82%;padding:8px 12px;border-radius:14px;line-height:1.4}.bb small{display:block;font-size:.72rem;color:var(--mut);font-weight:600}
.bb.other{align-self:flex-start;background:#f1ece2;border-bottom-left-radius:4px}
.bb.me{align-self:flex-end;border-bottom-right-radius:4px}.bb.me.ok{background:#e3f4ea;color:#0f5c3b}.bb.me.bad{background:#fbe5e2;color:#9b2a22}
.bb.turn{margin:6px 0 10px auto;border:1.5px dashed var(--verde);color:#0f5c3b;max-width:90%}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:9}
.modal .card{max-width:400px;text-align:center}
@media(max-width:560px){.opts{grid-template-columns:1fr}h1{font-size:1.6rem}}
</style>
</head>
<body>
<header></header>
<div class="wrap" id="app"></div>
<script>
const P=["io","tu","lui/lei","noi","voi","loro"];
const D=[
// ---------- BÁSICO ----------
{t:"Saludos",w:[["ciao","hola / chau"],["buongiorno","buenos días"],["buonasera","buenas tardes/noches"],["arrivederci","adiós"],["grazie","gracias"],["prego","de nada"],["per favore","por favor"],["scusi","disculpe"]],v:["essere","ser / estar","Presente",["sono","sei","è","siamo","siete","sono"]],f:[["Ciao, come stai?","Hola, ¿cómo estás?"],["Sto bene, grazie.","Estoy bien, gracias."]],n:"En italiano la 'c' antes de i/e suena 'ch': ciao = 'chao'."},
{t:"Presentarse",w:[["nome","nombre"],["cognome","apellido"],["piacere","mucho gusto"],["signore","señor"],["signora","señora"],["amico","amigo"],["amica","amiga"],["ragazzo","chico"]],v:["avere","tener / haber","Presente",["ho","hai","ha","abbiamo","avete","hanno"]],f:[["Mi chiamo Marco.","Me llamo Marco."],["Piacere di conoscerti.","Encantado de conocerte."]],n:"La 'h' es muda: ho = 'o', hanno = 'anno'."},
{t:"Números 0-2000",w:[["uno","uno"],["due","dos"],["tre","tres"],["quattro","cuatro"],["cinque","cinco"],["sei","seis"],["sette","siete"],["otto","ocho"],["nove","nueve"],["dieci","diez"]],v:["chiamarsi","llamarse","Presente",["mi chiamo","ti chiami","si chiama","ci chiamiamo","vi chiamate","si chiamano"]],f:[["Quanti anni hai?","¿Cuántos años tienes?"],["Ho trent'anni.","Tengo treinta años."]],n:"Para la edad se usa AVERE (tener), igual que en español."},
{t:"La familia",w:[["padre","padre"],["madre","madre"],["fratello","hermano"],["sorella","hermana"],["figlio","hijo"],["figlia","hija"],["nonno","abuelo"],["nonna","abuela"]],v:["parlare","hablar","Presente (-ARE)",["parlo","parli","parla","parliamo","parlate","parlano"]],f:[["Parlo un po' d'italiano.","Hablo un poco de italiano."],["Mia sorella si chiama Anna.","Mi hermana se llama Anna."]],n:"Con familiares en singular no se usa artículo: mia madre (no 'la mia madre')."},
{t:"Colores",w:[["rosso","rojo"],["blu","azul"],["verde","verde"],["giallo","amarillo"],["nero","negro"],["bianco","blanco"],["arancione","naranja"],["grigio","gris"]],v:["vedere","ver","Presente (-ERE)",["vedo","vedi","vede","vediamo","vedete","vedono"]],f:[["La macchina è rossa.","El carro es rojo."],["Vedo il mare blu.","Veo el mar azul."]],n:"Los adjetivos en -o cambian: rosso/rossa/rossi/rosse. 'Blu' no cambia."},
{t:"Comida",w:[["pane","pan"],["acqua","agua"],["vino","vino"],["formaggio","queso"],["pasta","pasta"],["carne","carne"],["pesce","pescado"],["frutta","fruta"]],v:["mangiare","comer","Presente",["mangio","mangi","mangia","mangiamo","mangiate","mangiano"]],f:[["Mangio la pasta ogni giorno.","Como pasta todos los días."],["Un bicchiere d'acqua, per favore.","Un vaso de agua, por favor."]],n:"'sc' antes de e/i suena 'sh': pesce = 'pe-she'."},
{t:"La casa",w:[["casa","casa"],["cucina","cocina"],["camera","habitación"],["bagno","baño"],["porta","puerta"],["finestra","ventana"],["tavolo","mesa"],["sedia","silla"]],v:["abitare","vivir (residir)","Presente",["abito","abiti","abita","abitiamo","abitate","abitano"]],f:[["Abito a Chimbote.","Vivo en Chimbote."],["La cucina è grande.","La cocina es grande."]],n:"'gn' suena como la 'ñ': bagno = 'baño'."},
{t:"Días y tiempo",w:[["lunedì","lunes"],["martedì","martes"],["mercoledì","miércoles"],["giovedì","jueves"],["venerdì","viernes"],["sabato","sábado"],["domenica","domingo"],["oggi","hoy"]],v:["fare","hacer","Presente (irregular)",["faccio","fai","fa","facciamo","fate","fanno"]],f:[["Che cosa fai oggi?","¿Qué haces hoy?"],["Il sabato faccio sport.","Los sábados hago deporte."]],n:"Los días se escriben con minúscula. 'Il lunedì' = todos los lunes."},
{t:"La ciudad",w:[["strada","calle"],["piazza","plaza"],["negozio","tienda"],["banca","banco"],["ospedale","hospital"],["stazione","estación"],["chiesa","iglesia"],["mercato","mercado"]],v:["andare","ir","Presente (irregular)",["vado","vai","va","andiamo","andate","vanno"]],f:[["Dov'è la stazione?","¿Dónde está la estación?"],["Vado al mercato.","Voy al mercado."]],n:"'ch' suena 'k': chiesa = 'kiesa'. 'gh' suena 'g' fuerte."},
{t:"Preguntas (repaso)",w:[["chi","quién"],["che cosa","qué"],["dove","dónde"],["quando","cuándo"],["perché","por qué / porque"],["come","cómo"],["quanto","cuánto"],["quale","cuál"]],v:["volere","querer","Presente (irregular)",["voglio","vuoi","vuole","vogliamo","volete","vogliono"]],f:[["Quanto costa?","¿Cuánto cuesta?"],["Voglio un caffè.","Quiero un café."]],n:"'gli' suena parecido a 'll' suave: voglio = 'vo-llo'."},
// ---------- INTERMEDIO ----------
{t:"Rutina diaria",w:[["svegliarsi","despertarse"],["colazione","desayuno"],["lavoro","trabajo"],["pranzo","almuerzo"],["cena","cena"],["dormire","dormir"],["presto","temprano"],["tardi","tarde"]],v:["alzarsi","levantarse","Presente (reflexivo)",["mi alzo","ti alzi","si alza","ci alziamo","vi alzate","si alzano"]],f:[["Mi alzo alle sette.","Me levanto a las siete."],["Faccio colazione al bar.","Desayuno en el bar."]],n:"Reflexivos: el pronombre va antes del verbo (mi, ti, si, ci, vi, si)."},
{t:"La ropa",w:[["camicia","camisa"],["pantaloni","pantalón"],["scarpe","zapatos"],["gonna","falda"],["vestito","vestido / traje"],["giacca","chaqueta"],["cappello","sombrero"],["borsa","bolso"]],v:["potere","poder","Presente",["posso","puoi","può","possiamo","potete","possono"]],f:[["Posso provare questa giacca?","¿Puedo probarme esta chaqueta?"],["Le scarpe sono nere.","Los zapatos son negros."]],n:"Las consonantes dobles se pronuncian más largas: giacca, cappello."},
{t:"De compras",w:[["prezzo","precio"],["caro","caro"],["economico","barato"],["sconto","descuento"],["scontrino","boleta"],["contanti","efectivo"],["carta","tarjeta"],["taglia","talla"]],v:["dovere","deber / tener que","Presente",["devo","devi","deve","dobbiamo","dovete","devono"]],f:[["Devo pagare in contanti?","¿Tengo que pagar en efectivo?"],["È troppo caro.","Es demasiado caro."]],n:"Potere, dovere y volere van seguidos de infinitivo: devo andare."},
{t:"En el restaurante",w:[["menù","carta / menú"],["conto","cuenta"],["cameriere","mesero"],["antipasto","entrada"],["primo","primer plato"],["secondo","segundo plato"],["dolce","postre"],["bicchiere","vaso"]],v:["prendere","tomar / pedir","Presente",["prendo","prendi","prende","prendiamo","prendete","prendono"]],f:[["Il conto, per favore.","La cuenta, por favor."],["Prendo un primo e un dolce.","Pido un primer plato y un postre."]],n:"En el restaurante se usa 'prendere' para pedir comida."},
{t:"Pasado con AVERE",w:[["ieri","ayer"],["la settimana scorsa","la semana pasada"],["già","ya"],["ancora","todavía"],["mai","nunca"],["sempre","siempre"],["appena","recién"],["fa","hace (tiempo)"]],v:["mangiare","comer","Passato prossimo",["ho mangiato","hai mangiato","ha mangiato","abbiamo mangiato","avete mangiato","hanno mangiato"]],f:[["Ieri ho mangiato la pizza.","Ayer comí pizza."],["Due giorni fa ho lavorato molto.","Hace dos días trabajé mucho."]],n:"Passato prossimo = avere/essere + participio (-ato, -uto, -ito)."},
{t:"Pasado con ESSERE · Viajes",w:[["viaggio","viaje"],["treno","tren"],["aereo","avión"],["biglietto","boleto"],["valigia","maleta"],["albergo","hotel"],["vacanza","vacaciones"],["mare","mar"]],v:["andare","ir","Passato prossimo",["sono andato/a","sei andato/a","è andato/a","siamo andati/e","siete andati/e","sono andati/e"]],f:[["Sono andato a Roma in treno.","Fui a Roma en tren."],["Siamo arrivati ieri.","Llegamos ayer."]],n:"Verbos de movimiento usan ESSERE y el participio concuerda: andato/andata."},
{t:"El clima",w:[["sole","sol"],["pioggia","lluvia"],["neve","nieve"],["vento","viento"],["caldo","calor"],["freddo","frío"],["nuvoloso","nublado"],["estate","verano"]],v:["venire","venir","Presente (irregular)",["vengo","vieni","viene","veniamo","venite","vengono"]],f:[["Oggi fa caldo.","Hoy hace calor."],["Vieni con me?","¿Vienes conmigo?"]],n:"Para el clima: fa caldo / fa freddo; piove (llueve); nevica (nieva)."},
{t:"Cuerpo y salud",w:[["testa","cabeza"],["mano","mano"],["piede","pie"],["occhio","ojo"],["bocca","boca"],["braccio","brazo"],["gamba","pierna"],["medico","médico"]],v:["sentirsi","sentirse","Presente (reflexivo)",["mi sento","ti senti","si sente","ci sentiamo","vi sentite","si sentono"]],f:[["Mi fa male la testa.","Me duele la cabeza."],["Non mi sento bene.","No me siento bien."]],n:"Plurales irregulares: la mano → le mani, il braccio → le braccia."},
{t:"Imperfecto · Recuerdos",w:[["bambino","niño"],["scuola","escuela"],["spesso","a menudo"],["di solito","normalmente"],["una volta","una vez / antes"],["giocare","jugar"],["ricordo","recuerdo"],["quartiere","barrio"]],v:["essere","ser / estar","Imperfetto",["ero","eri","era","eravamo","eravate","erano"]],f:[["Quando ero bambino, giocavo a calcio.","Cuando era niño, jugaba fútbol."],["Di solito andavo a scuola a piedi.","Normalmente iba a la escuela a pie."]],n:"Imperfetto = costumbres y descripciones del pasado (como '-aba/-ía')."},
{t:"El trabajo",w:[["ufficio","oficina"],["collega","colega"],["capo","jefe"],["riunione","reunión"],["stipendio","sueldo"],["progetto","proyecto"],["orario","horario"],["contratto","contrato"]],v:["fare","hacer","Imperfetto",["facevo","facevi","faceva","facevamo","facevate","facevano"]],f:[["Ho una riunione alle dieci.","Tengo una reunión a las diez."],["Prima facevo un altro lavoro.","Antes hacía otro trabajo."]],n:"Imperfetto regular: -avo (are), -evo (ere), -ivo (ire)."},
// ---------- AVANZADO ----------

{f:[["Buongiorno, signora!","¡Buenos días, señora!"],["Come va?","¿Qué tal?"],["Molto bene, e tu?","Muy bien, ¿y tú?"],["A domani!","¡Hasta mañana!"]],c:[["Ciao! Come stai?","¡Hola! ¿Cómo estás?"],["Bene, grazie. E tu?","Bien, gracias. ¿Y tú?"],["Molto bene! Sei di qui?","¡Muy bien! ¿Eres de aquí?"],["No, sono del Perù.","No, soy de Perú."],["Che bello! Arrivederci!","¡Qué bonito! ¡Adiós!"],["Ciao, a domani!","¡Chau, hasta mañana!"]]},
{f:[["Come ti chiami?","¿Cómo te llamas?"],["Di dove sei?","¿De dónde eres?"],["Sono peruviano.","Soy peruano."],["Lui è il mio amico.","Él es mi amigo."]],c:[["Buongiorno, come si chiama?","Buenos días, ¿cómo se llama?"],["Mi chiamo Daniel. E lei?","Me llamo Daniel. ¿Y usted?"],["Sono Giulia. Piacere!","Soy Giulia. ¡Mucho gusto!"],["Piacere mio. Di dov'è?","El gusto es mío. ¿De dónde es?"],["Sono di Milano. E lei?","Soy de Milán. ¿Y usted?"],["Sono di Chimbote, in Perù.","Soy de Chimbote, en Perú."]]},
{f:[["Il mio numero è...","Mi número es..."],["Quanti siete?","¿Cuántos son ustedes?"],["Siamo in tre.","Somos tres."],["Ho due fratelli.","Tengo dos hermanos."]],c:[["Quanti anni hai?","¿Cuántos años tienes?"],["Ho trentacinque anni. E tu?","Tengo treinta y cinco. ¿Y tú?"],["Io ho ventotto anni.","Yo tengo veintiocho."],["Hai fratelli?","¿Tienes hermanos?"],["Sì, ho due sorelle.","Sí, tengo dos hermanas."],["Io ho un fratello.","Yo tengo un hermano."]]},
{f:[["Hai figli?","¿Tienes hijos?"],["Sono sposato.","Estoy casado."],["Mio padre parla spagnolo.","Mi padre habla español."],["La mia famiglia è grande.","Mi familia es grande."]],c:[["Com'è la tua famiglia?","¿Cómo es tu familia?"],["È grande: ho tre fratelli.","Es grande: tengo tres hermanos."],["E i tuoi genitori?","¿Y tus padres?"],["Abitano a Lima con mia nonna.","Viven en Lima con mi abuela."],["Parlate italiano in famiglia?","¿Hablan italiano en familia?"],["No, parliamo spagnolo.","No, hablamos español."]]},
{f:[["Di che colore è?","¿De qué color es?"],["Il mio colore preferito è il verde.","Mi color favorito es el verde."],["Vedi quella casa bianca?","¿Ves esa casa blanca?"],["Il cielo è azzurro.","El cielo es celeste."]],c:[["Qual è il tuo colore preferito?","¿Cuál es tu color favorito?"],["Il blu. E il tuo?","El azul. ¿Y el tuyo?"],["Il rosso, come la mia macchina.","El rojo, como mi carro."],["Vedi quella macchina gialla?","¿Ves ese carro amarillo?"],["Sì, è molto bella!","¡Sí, es muy bonito!"],["È di mio fratello.","Es de mi hermano."]]},
{f:[["Ho fame.","Tengo hambre."],["Ho sete.","Tengo sed."],["Mi piace il formaggio.","Me gusta el queso."],["Buon appetito!","¡Buen provecho!"]],c:[["Hai fame?","¿Tienes hambre?"],["Sì, molta! Mangiamo?","¡Sí, mucha! ¿Comemos?"],["Che cosa mangi di solito?","¿Qué comes normalmente?"],["Mangio pesce e riso.","Como pescado y arroz."],["Ti piace la pasta?","¿Te gusta la pasta?"],["Sì, moltissimo! Buon appetito!","¡Sí, muchísimo! ¡Buen provecho!"]]},
{f:[["Dove abiti?","¿Dónde vives?"],["La casa ha tre camere.","La casa tiene tres habitaciones."],["Il bagno è a destra.","El baño está a la derecha."],["Benvenuto a casa mia!","¡Bienvenido a mi casa!"]],c:[["Benvenuta a casa mia!","¡Bienvenida a mi casa!"],["Grazie! È molto bella.","¡Gracias! Es muy bonita."],["Questa è la cucina.","Esta es la cocina."],["Dov'è il bagno, per favore?","¿Dónde está el baño, por favor?"],["È a sinistra, vicino alla porta.","Está a la izquierda, cerca de la puerta."],["Grazie mille!","¡Muchas gracias!"]]},
{f:[["Che giorno è oggi?","¿Qué día es hoy?"],["Oggi è venerdì.","Hoy es viernes."],["Che ore sono?","¿Qué hora es?"],["Sono le otto.","Son las ocho."]],c:[["Che cosa fai sabato?","¿Qué haces el sábado?"],["Faccio la spesa al mercato.","Hago las compras en el mercado."],["E domenica?","¿Y el domingo?"],["Domenica non faccio niente!","¡El domingo no hago nada!"],["Facciamo una passeggiata?","¿Damos un paseo?"],["Va bene, alle cinque.","Está bien, a las cinco."]]},
{f:[["Scusi, dov'è la piazza?","Disculpe, ¿dónde está la plaza?"],["Sempre dritto.","Siempre recto."],["Giri a destra.","Gire a la derecha."],["È lontano?","¿Está lejos?"]],c:[["Scusi, dov'è la stazione?","Disculpe, ¿dónde está la estación?"],["Vada sempre dritto.","Siga siempre recto."],["È lontano?","¿Está lejos?"],["No, cinque minuti a piedi.","No, cinco minutos a pie."],["E c'è una banca vicino?","¿Y hay un banco cerca?"],["Sì, in piazza, accanto alla chiesa.","Sí, en la plaza, al lado de la iglesia."]]},
{f:[["Perché studi italiano?","¿Por qué estudias italiano?"],["Quando parti?","¿Cuándo viajas?"],["Chi è lei?","¿Quién es ella?"],["Non capisco.","No entiendo."]],c:[["Che cosa vuoi fare oggi?","¿Qué quieres hacer hoy?"],["Voglio andare al mare.","Quiero ir al mar."],["Quando?","¿Cuándo?"],["Dopo pranzo. Vuoi venire?","Después del almuerzo. ¿Quieres venir?"],["Sì! Come andiamo?","¡Sí! ¿Cómo vamos?"],["In autobus. Costa poco.","En bus. Cuesta poco."]]},
{f:[["A che ora ti alzi?","¿A qué hora te levantas?"],["Mi faccio la doccia.","Me ducho."],["Vado a letto alle undici.","Me acuesto a las once."],["Sono sempre in ritardo.","Siempre llego tarde."]],c:[["A che ora ti alzi?","¿A qué hora te levantas?"],["Mi alzo alle sei e mezza.","Me levanto a las seis y media."],["Così presto?","¿Tan temprano?"],["Sì, il lavoro comincia alle otto.","Sí, el trabajo empieza a las ocho."],["E la sera cosa fai?","¿Y en la noche qué haces?"],["Ceno e vado a letto presto.","Ceno y me acuesto temprano."]]},
{f:[["Che taglia porta?","¿Qué talla usa?"],["Mi sta bene?","¿Me queda bien?"],["È troppo stretto.","Está muy ajustado."],["Avete un'altra taglia?","¿Tienen otra talla?"]],c:[["Buongiorno, posso aiutarla?","Buenos días, ¿puedo ayudarle?"],["Sì, cerco una camicia bianca.","Sí, busco una camisa blanca."],["Che taglia porta?","¿Qué talla usa?"],["La media. Posso provarla?","La mediana. ¿Puedo probármela?"],["Certo, il camerino è lì.","Claro, el probador está allí."],["Mi sta bene. La prendo!","Me queda bien. ¡Me la llevo!"]]},
{f:[["Quanto costa questo?","¿Cuánto cuesta esto?"],["Posso pagare con la carta?","¿Puedo pagar con tarjeta?"],["C'è uno sconto?","¿Hay descuento?"],["Mi dà lo scontrino?","¿Me da la boleta?"]],c:[["Quanto costano queste scarpe?","¿Cuánto cuestan estos zapatos?"],["Ottanta euro.","Ochenta euros."],["Sono un po' care. C'è uno sconto?","Son un poco caros. ¿Hay descuento?"],["Sì, oggi il venti per cento.","Sí, hoy el veinte por ciento."],["Perfetto. Posso pagare con la carta?","Perfecto. ¿Puedo pagar con tarjeta?"],["Certo. Ecco lo scontrino.","Claro. Aquí está la boleta."]]},
{f:[["Un tavolo per due, per favore.","Una mesa para dos, por favor."],["Che cosa mi consiglia?","¿Qué me recomienda?"],["Sono vegetariano.","Soy vegetariano."],["Era tutto buonissimo.","Todo estaba buenísimo."]],c:[["Buonasera, siete pronti per ordinare?","Buenas noches, ¿están listos para pedir?"],["Sì. Che cosa ci consiglia?","Sí. ¿Qué nos recomienda?"],["Gli spaghetti alle vongole sono ottimi.","Los espaguetis con almejas son excelentes."],["Allora prendo quelli e un'acqua.","Entonces pido esos y un agua."],["Perfetto. E da bere?","Perfecto. ¿Y para tomar?"],["Un bicchiere di vino rosso, grazie.","Una copa de vino tinto, gracias."]]},
{f:[["Che cosa hai fatto ieri?","¿Qué hiciste ayer?"],["Ho già mangiato.","Ya comí."],["Non ho mai visto Roma.","Nunca he visto Roma."],["Ho dormito poco.","Dormí poco."]],c:[["Che cosa hai fatto ieri?","¿Qué hiciste ayer?"],["Ho lavorato tutto il giorno.","Trabajé todo el día."],["E la sera?","¿Y en la noche?"],["Ho guardato un film con mia moglie.","Vi una película con mi esposa."],["Hai già mangiato oggi?","¿Ya comiste hoy?"],["No, non ancora. Ho fame!","No, todavía no. ¡Tengo hambre!"]]},
{f:[["Sei mai stato in Italia?","¿Alguna vez has estado en Italia?"],["Siamo partiti alle sei.","Salimos a las seis."],["È arrivata tardi.","Llegó tarde."],["Il viaggio è stato bellissimo.","El viaje fue hermosísimo."]],c:[["Dove sei andato in vacanza?","¿Adónde fuiste de vacaciones?"],["Sono andato a Napoli.","Fui a Nápoles."],["In aereo?","¿En avión?"],["No, sono partito da Roma in treno.","No, salí de Roma en tren."],["Ti è piaciuto?","¿Te gustó?"],["Moltissimo! Sono stato al mare ogni giorno.","¡Muchísimo! Fui al mar todos los días."]]},
{f:[["Che tempo fa?","¿Qué tiempo hace?"],["Piove da ieri.","Llueve desde ayer."],["Prendi l'ombrello!","¡Lleva el paraguas!"],["Domani c'è il sole.","Mañana hay sol."]],c:[["Che tempo fa lì?","¿Qué tiempo hace allí?"],["Fa molto caldo, trenta gradi.","Hace mucho calor, treinta grados."],["Qui piove e fa freddo.","Aquí llueve y hace frío."],["Vieni qui al sole, allora!","¡Entonces ven aquí al sol!"],["Magari! Vengo a luglio.","¡Ojalá! Voy en julio."],["Perfetto, ti aspetto!","¡Perfecto, te espero!"]]},
{f:[["Ho il raffreddore.","Tengo resfriado."],["Ho la febbre.","Tengo fiebre."],["Dov'è la farmacia?","¿Dónde está la farmacia?"],["Devo andare dal medico.","Tengo que ir al médico."]],c:[["Che cosa si sente?","¿Qué siente?"],["Mi fa male la gola e ho la febbre.","Me duele la garganta y tengo fiebre."],["Da quando?","¿Desde cuándo?"],["Da due giorni.","Desde hace dos días."],["Prenda questo sciroppo e riposi.","Tome este jarabe y descanse."],["Grazie, dottore.","Gracias, doctor."]]},
{f:[["Da piccolo abitavo in campagna.","De pequeño vivía en el campo."],["Mia nonna cucinava benissimo.","Mi abuela cocinaba muy bien."],["Ero molto timido.","Era muy tímido."],["Ogni estate andavamo al mare.","Cada verano íbamos al mar."]],c:[["Com'eri da bambino?","¿Cómo eras de niño?"],["Ero molto vivace e giocavo sempre.","Era muy inquieto y jugaba siempre."],["Dove abitavi?","¿Dónde vivías?"],["In un quartiere vicino al porto.","En un barrio cerca del puerto."],["E che cosa facevi d'estate?","¿Y qué hacías en verano?"],["Andavo in spiaggia con i miei cugini.","Iba a la playa con mis primos."]]},
{f:[["Che lavoro fai?","¿En qué trabajas?"],["Lavoro in un ufficio pubblico.","Trabajo en una oficina pública."],["Ho molto da fare.","Tengo mucho que hacer."],["Sono in ferie.","Estoy de vacaciones."]],c:[["Che lavoro fai?","¿En qué trabajas?"],["Sono economista, lavoro con le statistiche.","Soy economista, trabajo con estadísticas."],["Interessante! Ti piace?","¡Interesante! ¿Te gusta?"],["Sì, anche se ho molte riunioni.","Sí, aunque tengo muchas reuniones."],["Prima che lavoro facevi?","¿Antes en qué trabajabas?"],["Facevo l'insegnante.","Era profesor."]]},
{f:[["Che cosa farai domani?","¿Qué harás mañana?"],["Ti chiamerò stasera.","Te llamaré esta noche."],["Fra un anno parlerò italiano.","En un año hablaré italiano."],["Vedremo!","¡Ya veremos!"]],c:[["Che progetti hai per l'anno prossimo?","¿Qué planes tienes para el próximo año?"],["Studierò italiano ogni giorno.","Estudiaré italiano todos los días."],["E poi?","¿Y después?"],["Andrò in Italia a settembre.","Iré a Italia en setiembre."],["Sarà un viaggio bellissimo!","¡Será un viaje hermosísimo!"],["Lo spero. Ti manderò le foto!","Eso espero. ¡Te mandaré las fotos!"]]},
{f:[["Dov'è il check-in?","¿Dónde está el check-in?"],["Il mio volo è cancellato.","Mi vuelo está cancelado."],["Ho perso la valigia.","Perdí la maleta."],["A che ora parte il volo?","¿A qué hora sale el vuelo?"]],c:[["Passaporto, per favore.","Pasaporte, por favor."],["Ecco a lei.","Aquí tiene."],["Quanto tempo resterà in Italia?","¿Cuánto tiempo se quedará en Italia?"],["Due settimane, per turismo.","Dos semanas, por turismo."],["Ha qualcosa da dichiarare?","¿Tiene algo que declarar?"],["No, niente. Grazie.","No, nada. Gracias."]]},
{f:[["Mi potrebbe aiutare?","¿Me podría ayudar?"],["Vorrei prenotare una camera.","Quisiera reservar una habitación."],["Sarebbe possibile pagare dopo?","¿Sería posible pagar después?"],["Ti dispiacerebbe aspettare?","¿Te molestaría esperar?"]],c:[["Buongiorno, vorrei prenotare una camera.","Buenos días, quisiera reservar una habitación."],["Per quante notti?","¿Para cuántas noches?"],["Tre notti. Sarebbe possibile con vista mare?","Tres noches. ¿Sería posible con vista al mar?"],["Sì, costerebbe dieci euro in più.","Sí, costaría diez euros más."],["Va bene. Potrebbe includere la colazione?","Está bien. ¿Podría incluir el desayuno?"],["Certo, è già inclusa.","Claro, ya está incluido."]]},
{f:[["Che ne pensi?","¿Qué opinas?"],["Hai ragione.","Tienes razón."],["Dipende.","Depende."],["Mi sembra che sia vero.","Me parece que es verdad."]],c:[["Che ne pensi di questo film?","¿Qué opinas de esta película?"],["Secondo me è un po' lungo.","Para mí es un poco larga."],["Io invece penso che sia fantastico.","Yo en cambio pienso que es fantástica."],["Credo che la fine sia troppo triste.","Creo que el final es demasiado triste."],["Forse hai ragione.","Quizás tienes razón."],["Però gli attori sono bravissimi!","¡Pero los actores son buenísimos!"]]},
{f:[["Che bello!","¡Qué bonito!"],["Sono felice per te.","Me alegro por ti."],["Non ti preoccupare.","No te preocupes."],["Mi dispiace molto.","Lo siento mucho."]],c:[["Ti vedo stanco. Tutto bene?","Te veo cansado. ¿Todo bien?"],["Sono un po' preoccupato per l'esame.","Estoy un poco preocupado por el examen."],["Non ti preoccupare, sei preparato.","No te preocupes, estás preparado."],["Spero che tu abbia ragione.","Espero que tengas razón."],["Certo! E dopo festeggiamo.","¡Claro! Y después celebramos."],["Grazie, sei un vero amico.","Gracias, eres un verdadero amigo."]]},
{f:[["Il costo della vita è aumentato.","El costo de vida ha aumentado."],["I prezzi del pesce sono scesi.","Los precios del pescado bajaron."],["La variazione mensile è positiva.","La variación mensual es positiva."],["Bisogna che si faccia un'analisi.","Es necesario que se haga un análisis."]],c:[["Com'è andata l'inflazione questo mese?","¿Cómo estuvo la inflación este mes?"],["È aumentata dello zero virgola tre per cento.","Aumentó en cero coma tres por ciento."],["Quali prezzi sono saliti di più?","¿Qué precios subieron más?"],["Gli alimenti, soprattutto la frutta.","Los alimentos, sobre todo la fruta."],["E il pesce?","¿Y el pescado?"],["È calato, grazie alla buona pesca.","Bajó, gracias a la buena pesca."]]},
{f:[["Te lo prometto.","Te lo prometo."],["Ne vuoi un po'?","¿Quieres un poco?"],["Ci penso io.","Yo me encargo."],["Non me ne importa.","No me importa."]],c:[["Hai il libro di Marco?","¿Tienes el libro de Marco?"],["Sì, ma devo darglielo domani.","Sí, pero tengo que dárselo mañana."],["Me lo presti stasera?","¿Me lo prestas esta noche?"],["Va bene, te lo do dopo cena.","Está bien, te lo doy después de la cena."],["Quante pagine ha?","¿Cuántas páginas tiene?"],["Ne ha trecento. Ci vuole tempo!","Tiene trescientas. ¡Toma tiempo!"]]},
{f:[["Che figata!","¡Qué genial!"],["Meno male!","¡Menos mal!"],["Boh, non lo so.","Ni idea, no sé."],["Dai, andiamo!","¡Vamos, anda!"]],c:[["Domani ho il colloquio di lavoro.","Mañana tengo la entrevista de trabajo."],["In bocca al lupo!","¡Buena suerte!"],["Crepi! Non vedo l'ora che finisca.","¡Gracias! No veo la hora de que termine."],["Andrà bene. Poi facciamo due chiacchiere?","Irá bien. ¿Luego charlamos un rato?"],["Sì, ma offri tu: sono al verde!","Sí, pero invitas tú: ¡estoy sin plata!"],["Ahah, va bene!","¡Jaja, está bien!"]]},
{f:[["Se potessi, lo farei.","Si pudiera, lo haría."],["Se fossi ricco, viaggerei.","Si fuera rico, viajaría."],["Magari fosse vero!","¡Ojalá fuera verdad!"],["Se avessi saputo, sarei venuto.","Si hubiera sabido, habría venido."]],c:[["Se vincessi la lotteria, che cosa faresti?","Si ganaras la lotería, ¿qué harías?"],["Comprerei una casa al mare.","Compraría una casa en la playa."],["In Italia o in Perù?","¿En Italia o en Perú?"],["Se potessi, in tutti e due!","¡Si pudiera, en los dos!"],["E lavoreresti ancora?","¿Y seguirías trabajando?"],["Forse sì, ma solo un po'.","Quizás sí, pero solo un poco."]]},

{t:"Pronombres personales y ESSERE",e:"Los pronombres sujeto casi siempre se omiten porque el verbo ya indica la persona (igual que en español). <b>Lei</b> (con mayúscula) es el 'usted' formal y se conjuga como 'lei' (3ª persona).",tb:[["io","yo"],["tu","tú"],["lui / lei","él / ella"],["Lei","usted"],["noi","nosotros"],["voi","ustedes / vosotros"],["loro","ellos / ellas"]],ej:[["Sono peruviano.","Soy peruano."],["Lei è italiana?","¿Usted es italiana?"],["Siamo amici.","Somos amigos."]]},
{t:"Artículos determinados (el, la, los, las)",e:"El artículo depende de cómo empieza la palabra. Masculino: <b>il</b> (consonante), <b>lo</b> (s+consonante, z, gn, ps), <b>l'</b> (vocal). Plural: <b>i</b> / <b>gli</b>. Femenino: <b>la</b>, <b>l'</b> → plural <b>le</b>.",tb:[["il libro → i libri","consonante"],["lo studente → gli studenti","s+consonante / z"],["l'amico → gli amici","vocal (masc.)"],["la casa → le case","femenino"],["l'amica → le amiche","vocal (fem.)"]],ej:[["Il ragazzo ha un amico.","El chico tiene un amigo."],["Gli studenti sono qui.","Los estudiantes están aquí."],["L'acqua è fresca.","El agua está fresca."]]},
{t:"Artículos indeterminados y plural",e:"<b>un</b> (masc.), <b>uno</b> (masc. ante s+consonante o z), <b>una</b> (fem.), <b>un'</b> (fem. ante vocal). Plural de sustantivos: <b>-o → -i</b>, <b>-a → -e</b>, <b>-e → -i</b>.",tb:[["un libro","un libro"],["uno zaino","una mochila"],["una casa","una casa"],["un'amica","una amiga"],["libro → libri / casa → case","plural -o/-a"],["padre → padri / notte → notti","plural -e"]],ej:[["Ho un fratello e una sorella.","Tengo un hermano y una hermana."],["Ho due libri.","Tengo dos libros."],["È un'amica di Marco.","Es una amiga de Marco."]]},
{t:"Posesivos",e:"Normalmente llevan artículo: <b>il mio libro</b>, <b>la mia casa</b>. Excepción: con familiares en singular NO se usa artículo (<b>mia madre</b>), pero en plural sí (<b>i miei fratelli</b>). 'Loro' nunca cambia y siempre lleva artículo.",tb:[["mio / mia — miei / mie","mi(s)"],["tuo / tua — tuoi / tue","tu(s)"],["suo / sua — suoi / sue","su(s) (de él/ella/usted)"],["nostro / nostra — nostri / nostre","nuestro(s)"],["vostro / vostra — vostri / vostre","vuestro(s)"],["il loro / la loro","su(s) (de ellos)"]],ej:[["Mia madre si chiama Rosa.","Mi madre se llama Rosa."],["I miei fratelli abitano a Lima.","Mis hermanos viven en Lima."],["La nostra casa è piccola.","Nuestra casa es pequeña."]]},
{t:"Concordancia de adjetivos",e:"El adjetivo va después del sustantivo y concuerda en género y número. Tipo <b>-o</b>: rosso/rossa/rossi/rosse. Tipo <b>-e</b>: verde/verdi (igual en masc. y fem.). Invariables: <b>blu, rosa, viola</b>.",tb:[["il libro rosso → i libri rossi","masc. -o"],["la casa rossa → le case rosse","fem. -a"],["il prato verde → i prati verdi","-e (masc./fem.)"],["la maglia blu → le maglie blu","invariable"]],ej:[["La macchina è nuova.","El carro es nuevo."],["Ho due gatti neri.","Tengo dos gatos negros."],["Le porte sono verdi.","Las puertas son verdes."]]},
{t:"Presente -ARE y el verbo PIACERE",e:"Verbos en -are: raíz + <b>-o, -i, -a, -iamo, -ate, -ano</b>. <b>Piacere</b> funciona como 'gustar': <b>mi piace</b> + singular o infinitivo, <b>mi piacciono</b> + plural.",tb:[["mi piace","me gusta"],["ti piace","te gusta"],["gli / le piace","le gusta (a él / a ella)"],["ci piace","nos gusta"],["mi piacciono","me gustan"]],ej:[["Mi piace il pane.","Me gusta el pan."],["Mi piacciono le olive.","Me gustan las aceitunas."],["Mangiamo alle due.","Comemos a las dos."]]},
{t:"Preposiciones articuladas",e:"Las preposiciones <b>a, di, da, in, su</b> se unen con el artículo, igual que 'a + el = al' en español, pero con todas las formas.",tb:[["a + il","al"],["di + il","del"],["da + il","dal"],["in + il","nel"],["su + il","sul"],["in + la","nella"],["di + la","della"]],ej:[["Il libro è sul tavolo.","El libro está sobre la mesa."],["Le chiavi sono nella borsa.","Las llaves están en el bolso."],["Vado al mercato.","Voy al mercado."]]},
{t:"La hora y expresiones con FARE",e:"<b>Che ore sono?</b> → <b>Sono le</b> + número (plural), excepto <b>È l'una</b>, <b>è mezzogiorno</b>, <b>è mezzanotte</b>. FARE aparece en muchas expresiones: fare colazione, fare la spesa, fare una passeggiata.",tb:[["È l'una","Es la una"],["Sono le tre","Son las tres"],["Sono le tre e mezza","Son las tres y media"],["Sono le cinque meno un quarto","Son las cinco menos cuarto"],["fare la spesa","hacer las compras"]],ej:[["Che ore sono? Sono le otto.","¿Qué hora es? Son las ocho."],["Faccio colazione alle sette.","Desayuno a las siete."],["Facciamo una passeggiata.","Damos un paseo."]]},
{t:"C'è / ci sono · Presente -ERE / -IRE",e:"<b>C'è</b> + singular, <b>ci sono</b> + plural (= hay). Presente -ere: <b>-o, -i, -e, -iamo, -ete, -ono</b>. -ire: <b>-o, -i, -e, -iamo, -ite, -ono</b>. Algunos -ire agregan <b>-isc-</b>: capisco, finisco.",tb:[["c'è una banca","hay un banco"],["ci sono due negozi","hay dos tiendas"],["vedo, vedi, vede…","-ERE (vedere)"],["dormo, dormi, dorme…","-IRE (dormire)"],["capisco, capisci, capisce…","-IRE con -isc-"]],ej:[["C'è un mercato vicino?","¿Hay un mercado cerca?"],["Ci sono molti negozi.","Hay muchas tiendas."],["Non capisco, scusi.","No entiendo, disculpe."]]},
{t:"Negación y preguntas",e:"Para negar se pone <b>non</b> antes del verbo. La doble negación es correcta: <b>non… mai</b>, <b>non… niente</b>. Para preguntar no cambia el orden: solo sube la entonación.",tb:[["non… mai","nunca"],["non… niente","nada"],["non… nessuno","nadie"],["non… più","ya no"],["non… ancora","todavía no"]],ej:[["Non mangio mai carne.","Nunca como carne."],["Non c'è nessuno.","No hay nadie."],["Non abito più qui.","Ya no vivo aquí."]]},
{t:"Verbos reflexivos",e:"El pronombre (<b>mi, ti, si, ci, vi, si</b>) va antes del verbo conjugado. Con infinitivo se pega al final: <b>devo alzarmi</b>.",tb:[["svegliarsi","mi sveglio (me despierto)"],["lavarsi","mi lavo (me lavo)"],["vestirsi","mi vesto (me visto)"],["divertirsi","mi diverto (me divierto)"],["riposarsi","mi riposo (descanso)"]],ej:[["Mi sveglio alle sei.","Me despierto a las seis."],["Ci vestiamo in fretta.","Nos vestimos rápido."],["Domani devo alzarmi presto.","Mañana tengo que levantarme temprano."]]},
{t:"Demostrativos: QUESTO y QUELLO",e:"<b>Questo</b> = este (cerca). <b>Quello</b> = ese/aquel (lejos) y cambia como el artículo: quel, quello, quell', quei, quegli, quella, quelle.",tb:[["questo vestito / questa gonna","este vestido / esta falda"],["quel cappello","ese sombrero (il)"],["quello zaino","esa mochila (lo)"],["quell'albero","ese árbol (l')"],["quei pantaloni / quegli occhiali","esos (i / gli)"]],ej:[["Quanto costa questa giacca?","¿Cuánto cuesta esta chaqueta?"],["Mi piace quel cappello.","Me gusta ese sombrero."],["Quelle scarpe sono belle.","Esos zapatos son bonitos."]]},
{t:"Modales + números grandes",e:"<b>Dovere, potere, volere</b> + infinitivo. Números: venti, trenta, quaranta, cinquanta, cento, mille (plural: <b>-mila</b>).",tb:[["20 / 30 / 40","venti / trenta / quaranta"],["50 / 60","cinquanta / sessanta"],["100 / 200","cento / duecento"],["1000 / 2000","mille / duemila"]],ej:[["Devo pagare cento euro.","Tengo que pagar cien euros."],["Posso usare la carta?","¿Puedo usar la tarjeta?"],["Vogliamo comprare due camicie.","Queremos comprar dos camisas."]]},
{t:"Pronombres de objeto directo",e:"<b>lo, la, li, le</b> reemplazan al objeto y van antes del verbo conjugado. Con infinitivo se pegan al final: <b>voglio prenderlo</b>.",tb:[["lo","lo (masc. sing.)"],["la","la (fem. sing.)"],["li","los"],["le","las"],["mi / ti / ci / vi","me / te / nos / os"]],ej:[["Il conto? Lo pago io.","¿La cuenta? La pago yo."],["La pizza? La prendo.","¿La pizza? La pido."],["Gli spaghetti? Li mangio sempre.","¿Los espaguetis? Los como siempre."]]},
{t:"Passato prossimo con AVERE",e:"<b>Avere + participio</b>. Participio regular: <b>-are → -ato</b>, <b>-ere → -uto</b>, <b>-ire → -ito</b>. Hay irregulares muy usados.",tb:[["parlare","parlato"],["vendere","venduto"],["dormire","dormito"],["fare","fatto (irreg.)"],["prendere","preso (irreg.)"],["vedere","visto (irreg.)"],["scrivere","scritto (irreg.)"]],ej:[["Ho visto un bel film.","Vi una buena película."],["Abbiamo preso il treno.","Tomamos el tren."],["Che cosa hai fatto?","¿Qué hiciste?"]]},
{t:"Passato prossimo con ESSERE",e:"Usan <b>essere</b> los verbos de movimiento o cambio (andare, venire, partire, arrivare, nascere…) y todos los reflexivos. El participio concuerda con el sujeto: andat<b>o</b>/<b>a</b>/<b>i</b>/<b>e</b>.",tb:[["lui è andato","él fue"],["lei è andata","ella fue"],["loro sono partiti","ellos partieron"],["loro sono partite","ellas partieron"],["mi sono alzato/a","me levanté"]],ej:[["Maria è arrivata ieri.","María llegó ayer."],["Siamo andati al mare.","Fuimos al mar."],["Mi sono svegliato tardi.","Me desperté tarde."]]},
{t:"Clima y comparativos",e:"Clima: <b>fa caldo/freddo</b>, <b>c'è il sole/vento</b>, <b>piove</b>, <b>nevica</b>. Comparar: <b>più… di</b> (más que), <b>meno… di</b> (menos que), <b>… come</b> (tan… como).",tb:[["più caldo di","más caluroso que"],["meno freddo di","menos frío que"],["bello come","tan bonito como"],["il più alto","el más alto"],["migliore / peggiore","mejor / peor"]],ej:[["Oggi fa più freddo di ieri.","Hoy hace más frío que ayer."],["Luglio è più caldo di aprile.","Julio es más caluroso que abril."],["Roma è bella come Firenze.","Roma es tan bonita como Florencia."]]},
{t:"Imperativo y 'mi fa male'",e:"Imperativo informal (tu): <b>prendi, riposa, bevi</b>. Formal (Lei): <b>prenda, riposi, beva</b> (terminación cambiada). Para dolor: <b>mi fa male</b> + singular, <b>mi fanno male</b> + plural.",tb:[["prendere","prendi! / prenda!"],["riposare","riposa! / riposi!"],["bere","bevi! / beva!"],["mi fa male la testa","me duele la cabeza"],["mi fanno male i piedi","me duelen los pies"]],ej:[["Beva molta acqua.","Beba mucha agua."],["Riposa un po'!","¡Descansa un poco!"],["Mi fanno male le gambe.","Me duelen las piernas."]]},
{t:"Imperfetto vs passato prossimo",e:"<b>Imperfetto</b>: costumbres, descripciones y acciones en curso (como '-aba/-ía'). <b>Passato prossimo</b>: acciones puntuales y terminadas. A menudo se combinan: una acción en curso interrumpida por otra.",tb:[["Imperfetto","ogni giorno, di solito, mentre, sempre"],["Passato prossimo","ieri, una volta, all'improvviso"],["giocavo","jugaba (costumbre)"],["ho giocato","jugué (una vez)"]],ej:[["Mentre leggevo, è arrivato Marco.","Mientras leía, llegó Marco."],["Da bambino giocavo sempre.","De niño jugaba siempre."],["Ieri ho giocato a calcio.","Ayer jugué fútbol."]]},
{t:"Imperfetto regular · DA (desde hace)",e:"Imperfetto: <b>-avo</b> (-are), <b>-evo</b> (-ere), <b>-ivo</b> (-ire) + -vi, -va, -vamo, -vate, -vano. Presente + <b>da</b> = acción que sigue: <b>Lavoro qui da tre anni</b>.",tb:[["lavorare","lavoravo"],["avere","avevo"],["dormire","dormivo"],["fare","facevo (irreg.)"],["essere","ero (irreg.)"]],ej:[["Lavoro qui da tre anni.","Trabajo aquí desde hace tres años."],["Prima avevo un altro capo.","Antes tenía otro jefe."],["Studio italiano da un mese.","Estudio italiano desde hace un mes."]]},
{t:"Futuro semplice",e:"Infinitivo sin -e final + <b>-ò, -ai, -à, -emo, -ete, -anno</b>. En -are la <b>a</b> cambia a <b>e</b>: parlare → parl<b>e</b>rò. Irregulares frecuentes: sarò, avrò, andrò, farò, verrò, potrò.",tb:[["parlare","parlerò"],["prendere","prenderò"],["partire","partirò"],["andare","andrò (irreg.)"],["venire","verrò (irreg.)"],["fare","farò (irreg.)"]],ej:[["Domani partirò per Roma.","Mañana partiré a Roma."],["Faremo una festa.","Haremos una fiesta."],["Verrai con noi?","¿Vendrás con nosotros?"]]},
{t:"Futuro de probabilidad · FRA / TRA",e:"El futuro también expresa suposición sobre el presente: <b>Saranno le tre</b> (serán las tres). <b>Fra / tra</b> + tiempo = 'dentro de'.",tb:[["Saranno le dieci.","Serán las diez."],["Avrà trent'anni.","Tendrá unos treinta años."],["fra due ore","dentro de dos horas"],["tra un mese","dentro de un mes"]],ej:[["Il volo partirà fra un'ora.","El vuelo saldrá dentro de una hora."],["Dove sarà la mia valigia?","¿Dónde estará mi maleta?"],["Arriveremo tra poco.","Llegaremos dentro de poco."]]},
{t:"Condizionale presente",e:"Raíz del futuro + <b>-ei, -esti, -ebbe, -emmo, -este, -ebbero</b>. Se usa para cortesía, deseos y consejos (<b>dovresti</b> = deberías).",tb:[["parlare","parlerei"],["essere","sarei"],["avere","avrei"],["potere","potrei"],["dovere","dovrei"],["piacere","mi piacerebbe"]],ej:[["Dovresti riposare.","Deberías descansar."],["Mi piacerebbe viaggiare.","Me gustaría viajar."],["Potrei avere il menù?","¿Podría tener la carta?"]]},
{t:"Congiuntivo presente",e:"Se usa tras verbos de opinión, duda o deseo + <b>che</b>: penso che, credo che, spero che, voglio che. -are: <b>-i, -i, -i, -iamo, -iate, -ino</b>. -ere/-ire: <b>-a, -a, -a, -iamo, -iate, -ano</b>.",tb:[["parlare","che io parli"],["prendere","che io prenda"],["partire","che io parta"],["andare","che io vada (irreg.)"],["fare","che io faccia (irreg.)"]],ej:[["Penso che Marco abbia ragione.","Pienso que Marco tiene razón."],["Credo che parta domani.","Creo que viaja mañana."],["Voglio che tu venga.","Quiero que vengas."]]},
{t:"Congiuntivo con emociones",e:"Tras emociones y frases impersonales + <b>che</b> va congiuntivo: sono contento che, ho paura che, è importante che, è meglio che. Si el sujeto es el mismo se usa <b>di + infinitivo</b>.",tb:[["Sono felice che tu sia qui.","Me alegra que estés aquí."],["È meglio che tu vada.","Es mejor que te vayas."],["Ho paura che piova.","Temo que llueva."],["Ho paura di sbagliare.","Tengo miedo de equivocarme (mismo sujeto)."]],ej:[["È importante che tu studi.","Es importante que estudies."],["Sono contento di vederti.","Me alegra verte."],["Mi dispiace che tu sia triste.","Siento que estés triste."]]},
{t:"Forma impersonal y pasiva",e:"<b>Si</b> + verbo en 3ª persona = 'se' impersonal: <b>si dice</b>, <b>si vendono</b>. Pasiva con <b>essere</b> o <b>venire</b> + participio: <b>l'indice viene calcolato</b>.",tb:[["Si dice che…","Se dice que…"],["Si vendono case.","Se venden casas."],["L'indice viene calcolato ogni mese.","El índice se calcula cada mes."],["I dati sono stati pubblicati.","Los datos fueron publicados."],["Si prevede un aumento.","Se prevé un aumento."]],ej:[["Si prevede un calo dei prezzi.","Se prevé una baja de precios."],["I prezzi vengono rilevati ogni mese.","Los precios se recogen cada mes."],["In Italia si mangia bene.","En Italia se come bien."]]},
{t:"Pronombres combinados · NE y CI",e:"Indirecto + directo: <b>mi, ti, ci, vi</b> → <b>me, te, ce, ve</b>; <b>gli / le</b> → <b>glie-</b> (glielo). <b>Ne</b> = de eso / cantidad. <b>Ci</b> = allí / en eso.",tb:[["mi + lo","me lo"],["ti + la","te la"],["gli / le + lo","glielo"],["ci + li","ce li"],["vi + le","ve le"],["ne","de eso / algunos"],["ci","allí"]],ej:[["Me lo puoi spiegare?","¿Me lo puedes explicar?"],["Quanti caffè? Ne prendo due.","¿Cuántos cafés? Tomo dos."],["Vai a Roma? Sì, ci vado domani.","¿Vas a Roma? Sí, voy mañana."]]},
{t:"Verbos pronominales coloquiales",e:"Verbos con pronombres fijos muy usados al hablar: <b>farcela</b> (lograrlo), <b>andarsene</b> (irse), <b>prendersela</b> (ofenderse), <b>cavarsela</b> (arreglárselas).",tb:[["farcela","ce la faccio (lo logro)"],["andarsene","me ne vado (me voy)"],["prendersela","me la prendo (me ofendo)"],["cavarsela","me la cavo (me las arreglo)"]],ej:[["Non ce la faccio più!","¡Ya no puedo más!"],["È tardi, me ne vado.","Es tarde, me voy."],["Non te la prendere!","¡No te ofendas!"]]},
{t:"Periodo ipotetico (condicionales)",e:"<b>Tipo 1</b> real: se + presente → presente/futuro. <b>Tipo 2</b> posible: se + congiuntivo imperfetto → condizionale. <b>Tipo 3</b> imposible (pasado): se + congiuntivo trapassato → condizionale passato.",tb:[["Se piove, resto a casa.","Tipo 1 (real)"],["Se piovesse, resterei a casa.","Tipo 2 (posible)"],["Se fosse piovuto, sarei rimasto a casa.","Tipo 3 (imposible)"]],ej:[["Se ho tempo, ti chiamo.","Si tengo tiempo, te llamo."],["Se avessi soldi, comprerei una casa.","Si tuviera dinero, compraría una casa."],["Se avessi studiato, avrei passato l'esame.","Si hubiera estudiado, habría aprobado el examen."]]},
{t:"Conectores del discurso",e:"Algunos conectores exigen <b>congiuntivo</b>: sebbene, benché, affinché, prima che, a meno che. Otros van con indicativo: perché (porque), quindi, mentre, però, inoltre.",tb:[["sebbene / benché","aunque (+ cong.)"],["affinché","para que (+ cong.)"],["prima che","antes de que (+ cong.)"],["quindi / dunque","por lo tanto (+ ind.)"],["mentre","mientras (+ ind.)"],["inoltre","además"]],ej:[["Benché sia stanco, lavoro.","Aunque estoy cansado, trabajo."],["Te lo dico affinché tu lo sappia.","Te lo digo para que lo sepas."],["Piove, quindi resto a casa.","Llueve, por lo tanto me quedo en casa."]]}
];
const E=[
{g:"Saludar en cualquier momento del día, preguntar cómo está alguien y despedirte.",s:["En italiano casi todo se lee como se escribe. La regla clave: <b>C</b> y <b>G</b> cambian ante <b>E</b> e <b>I</b>: <i>ce, ci</i> = 'che, chi' (ciao, cena); <i>ca, co, cu</i> = 'ka, ko, ku' (casa). La <b>H</b> es muda y solo endurece: <i>che</i> = 'ke'.",["ciao","cena","casa","che","gelato","spaghetti"]],p:[["¿Cómo saludas a las 9 de la mañana?","Buongiorno!"],["¿Qué respondes cuando te dicen «Grazie»?","Prego!"],["Di: «Estoy bien, gracias».","Sto bene, grazie."],["¿Cómo suena «ch» en «che»?","~Como «k»: ke"],["¿Cuándo usas «buonanotte»?","~Solo al despedirte para ir a dormir."]],t:"Saluda en voz alta a 3 personas imaginarias: una por la mañana, otra por la tarde y otra antes de dormir. Pregúntales cómo están y despídete."},
{g:"Presentarte: tu nombre, de dónde eres y tus datos, en forma informal (tu) y formal (Lei).",s:["Fíjate en la <b>z</b> de <i>grazie</i> (suena 'ts') y en <b>gi</b> de <i>buongiorno</i> (suena 'dy'). La <b>è</b> (es) es abierta, como la 'e' de «perro».",["grazie","piacere","buongiorno","è","come si chiama?"]],p:[["Completa: Noi ___ peruviani.","siamo"],["Completa: Tu ___ di Roma?","sei"],["Di: «No soy italiana».","Non sono italiana."],["Pregunta en forma formal: «¿Cómo se llama?»","Come si chiama?"],["Di: «Tengo dos hermanos».","Ho due fratelli."]],t:"Preséntate en voz alta durante 30 segundos: saludo, nombre, nacionalidad, ciudad y despedida. Hazlo una vez con «tu» y otra con «Lei»."},
{g:"Contar del 0 al 2000, decir tu edad y dictar tu número de teléfono.",s:["Los números están llenos de <b>dobles consonantes</b>: <i>quattro, sette, otto, diciassette</i>. Haz una pequeña pausa antes de la doble. La <b>h</b> de <i>ho, hai, ha, hanno</i> no suena.",["quattro","sette","otto","diciassette","ho","hanno"]],p:[["Escribe en letras: 48","quarantotto"],["Escribe en letras: 73","settantatré"],["Completa: Loro ___ una casa grande.","hanno"],["Di: «Tenemos dos gatos».","Abbiamo due gatti."],["Pregunta la edad en forma formal.","Quanti anni ha?"]],t:"Di en voz alta tu edad, tu número de teléfono cifra por cifra, cuántos hermanos tienes y cuántas personas viven en tu casa."},
{g:"Describir a tu familia y usar los posesivos mio, tuo, suo, nostro, vostro, loro.",s:["Practica <b>gli</b>: <i>famiglia, figlio, moglie</i>. No es 'li' separado: es un solo sonido, con la lengua pegada al paladar, como una 'll' muy marcada.",["famiglia","figlio","figlia","moglie","i miei genitori"]],p:[["Completa: ___ madre è medico. (mi)","Mia madre"],["Completa: ___ fratelli sono alti. (mis)","I miei fratelli"],["Completa: Anna e ___ marito. (su)","suo marito"],["Di: «Hablamos español en familia».","Parliamo spagnolo in famiglia."],["Di: «Su padre (de ellos) es amable».","Il loro padre è gentile."]],t:"Describe a 4 miembros de tu familia: nombre, edad, dónde viven y cómo son (un adjetivo para cada uno)."},
{g:"Describir objetos por su color y hacer concordar los adjetivos.",s:["Alarga las dobles de <i>rosso, giallo, bello</i>. La <b>gi</b> de <i>giallo</i> suena 'dy' y la <b>gi</b> de <i>grigio</i> también: 'GRI-dyo'.",["rosso","giallo","grigio","arancione","azzurro"]],p:[["Concordancia: le borse ___ (rojo)","rosse"],["Concordancia: i pantaloni ___ (azul)","blu"],["Concordancia: la casa ___ (blanco)","bianca"],["¿Por qué «verde» no cambia en femenino?","~Porque termina en -e: verde (singular), verdi (plural)."],["Di: «Veo dos carros negros».","Vedo due macchine nere."]],t:"Describe 6 objetos de tu casa con su color, primero en singular y luego en plural."},
{g:"Hablar de lo que comes, de lo que te gusta y pedir cantidades con el partitivo.",s:["<b>sc + e/i</b> suena 'sh': <i>pesce</i>. <b>cch</b> suena 'k' larga: <i>zucchero, bicchiere</i>. Y <i>piacciono</i> se dice 'PIAT-cho-no'.",["pesce","zucchero","formaggio","bicchiere","mi piacciono"]],p:[["Partitivo: ___ formaggio (algo de queso)","del formaggio"],["Partitivo: ___ uova (unos huevos)","delle uova"],["Completa: Mi ___ le olive.","piacciono"],["Di: «Tengo hambre y sed».","Ho fame e sete."],["Responde que a ti también te gusta.","Anche a me!"]],t:"Cuenta qué comes en un día normal (desayuno, almuerzo y cena) y di 5 cosas que te gustan y 3 que no."},
{g:"Describir tu casa y decir dónde están las cosas con las preposiciones.",s:["<b>gn</b> suena como la ñ: <i>bagno</i> = 'baño'. La <b>z</b> de <i>stanza</i> suena 'ts'. <i>Specchio</i> se lee 'SPEK-kio'.",["bagno","cucina","stanza","specchio","giardino"]],p:[["Completa: Le chiavi sono ___ borsa. (in + la)","nella"],["Completa: Il libro è ___ tavolo. (su + il)","sul"],["Completa: Vado ___ mercato. (a + il)","al"],["Di: «El baño está a la derecha».","Il bagno è a destra."],["Di: «Vivo en una casa con jardín».","Abito in una casa con giardino."]],t:"Haz un recorrido en voz alta por tu casa: nombra 6 ambientes y di qué hay en cada uno y dónde está."},
{g:"Decir la hora, los días de la semana, los meses y organizar tu semana.",s:["Los días de lunes a viernes llevan la fuerza al final y con tilde: lu-ne-DÌ. En cambio <i>sabato</i> y <i>domenica</i> la llevan adelante: SA-ba-to, do-ME-ni-ca.",["lunedì","mercoledì","venerdì","sabato","domenica"]],p:[["Di la hora: 2:30","Sono le due e mezza."],["Di la hora: 6:45","Sono le sette meno un quarto."],["Di la hora: 1:15","È l'una e un quarto."],["¿Qué significa «il sabato»?","~Todos los sábados."],["Di: «Mi cumpleaños es en julio».","Il mio compleanno è a luglio."]],t:"Explica tu horario de la semana: qué haces cada día y a qué hora. Termina diciendo tu mes favorito y por qué."},
{g:"Preguntar y explicar cómo llegar a un lugar.",s:["La <b>s</b> entre vocales suena suave (como zumbido): <i>casa, chiesa</i>. La <b>r</b> vibra clara, como en español: <i>destra, dritto</i>.",["a destra","a sinistra","sempre dritto","il semaforo","la stazione"]],p:[["Pregunta dónde está la estación.","Scusi, dov'è la stazione?"],["Di: «Siga todo recto».","Vada sempre dritto."],["Di: «Hay dos bancos en la plaza».","Ci sono due banche in piazza."],["Pregunta si está lejos.","È lontano?"],["Di: «Gire a la izquierda en el semáforo».","Al semaforo giri a sinistra."]],t:"Explica en voz alta cómo llegar desde tu casa hasta la tienda o el mercado más cercano, usando al menos 5 expresiones de hoy."},
{g:"Hacer todo tipo de preguntas y expresar lo que quieres. Repaso del nivel básico.",s:["Practica <b>gli</b> en <i>voglio, vogliono</i> y la doble <b>cc</b> suave de <i>faccio</i> ('FAT-cho'). En las preguntas, la voz sube al final.",["voglio","vogliono","faccio","perché?","quanto costa?"]],p:[["Completa: Noi ___ (andare) al mare.","andiamo"],["Completa: Loro ___ (fare) la spesa.","fanno"],["Di: «¿Quieres venir?»","Vuoi venire?"],["Di: «No entiendo nada».","Non capisco niente."],["Pregunta cuánto cuesta.","Quanto costa?"]],t:"Mini prueba del nivel básico: hazte 8 preguntas (chi, che cosa, dove, quando, perché, come, quanto, quale) y respóndelas en voz alta. Grábate y escúchate."},
{g:"Contar tu rutina diaria y decir lo que estás haciendo ahora.",s:["Los grupos <b>sv</b> y <b>sb</b> van sin 'e' delante: se dice «sve-LLIAR-si», no «esvelliarsi». Practica: <i>mi sveglio, svegliarsi</i>.",["mi sveglio","svegliarsi","mi vesto","mi riposo","sto mangiando"]],p:[["Completa: Noi ___ (alzarsi) alle otto.","ci alziamo"],["Completa: Lei ___ (vestirsi) in fretta.","si veste"],["Di: «Ahora estoy comiendo».","Sto mangiando."],["Di de dos formas: «Tengo que levantarme».","Mi devo alzare. Devo alzarmi."],["Di: «Me acuesto a medianoche».","Vado a letto a mezzanotte."]],t:"Describe tu rutina completa durante 90 segundos, con al menos 8 acciones y la hora de cada una."},
{g:"Describir ropa, elegir entre objetos (questo / quello) y probarte prendas.",s:["<b>qu</b> siempre suena 'ku': <i>quanto, quello, questo</i>. La doble <b>ll</b> se alarga, nunca suena como 'y'.",["quanto costa?","questo","quello","quella","quelli"]],p:[["Completa: ___ scarpe sono care. (esos)","Quelle"],["Completa: ___ zaino è nuovo. (esa mochila)","Quello"],["Pregunta si puedes probártela.","Posso provarla?"],["Di: «Me queda bien, me la llevo».","Mi sta bene, la prendo."],["Pregunta la talla en forma formal.","Che taglia porta?"]],t:"Simula una compra de dos prendas: pregunta precio, talla y color, pide probártela y decide si la compras. Haz los dos papeles."},
{g:"Comprar, preguntar precios, pagar y pedir descuentos.",s:["<b>sc + a/o/u</b> suena 'sk': <i>sconto, scontrino</i>. Ojo con <i>ottanta</i> y <i>cento</i>: 'ot-TAN-ta', 'CHEN-to'.",["sconto","scontrino","contanti","ottanta euro","duecento"]],p:[["Pregunta si puedes pagar con tarjeta.","Posso pagare con la carta?"],["Escribe en letras: 250","duecentocinquanta"],["Di: «Es demasiado caro».","È troppo caro."],["Conjuga dovere con «noi».","dobbiamo"],["Di: «¿Me da la boleta?»","Mi dà lo scontrino?"]],t:"Simula comprar 3 cosas: pregunta el precio, pide un descuento, elige la forma de pago y pide la boleta."},
{g:"Pedir comida y bebida con cortesía en un restaurante y pedir la cuenta.",s:["Practica la <b>sc</b> suave y la <b>cch</b> dura en palabras de restaurante: <i>pesce</i> (PE-she), <i>bicchiere</i> (bik-KIE-re), <i>zucchero</i> (TSUK-ke-ro).",["pesce","bicchiere","zucchero","il conto, per favore","vorrei"]],p:[["Pide cortésmente un café.","Vorrei un caffè, per favore."],["Pide la cuenta.","Il conto, per favore."],["¿Qué es «il contorno»?","~La guarnición (verduras, papas, ensalada)."],["La pizza? ___ prendo.","La prendo."],["Gli spaghetti? ___ mangio sempre.","Li mangio sempre."]],t:"Haz los dos papeles del diálogo: cliente y mesero. Luego inventa tu pedido completo: bebida, primo, secondo, contorno y dolce."},
{g:"Contar lo que hiciste ayer o la semana pasada.",s:["Los participios irregulares tienen doble consonante: <i>fatto, detto, letto, scritto</i>. Los regulares llevan la fuerza en la penúltima: par-LA-to, a-VU-to, fi-NI-to.",["ho mangiato","ho fatto","ho visto","ho preso","abbiamo letto"]],p:[["Completa: Ieri ___ (io, comprare) il pane.","ho comprato"],["Completa: Loro ___ (fare) colazione al bar.","hanno fatto"],["Completa: ___ (tu, leggere) il giornale?","Hai letto"],["Di: «Todavía no he terminado».","Non ho ancora finito."],["Di: «Hace tres días escribí un correo».","Tre giorni fa ho scritto un'email."]],t:"Cuenta durante 90 segundos lo que hiciste ayer, de la mañana a la noche, usando al menos 8 verbos en pasado con avere."},
{g:"Contar viajes y movimientos, haciendo concordar el participio.",s:["La <b>r</b> vibra con fuerza, sobre todo la doble <b>rr</b>: <i>arrivato, terra</i>. Practica <i>siamo arrivati</i> marcando la rr.",["sono arrivato","siamo arrivati","sono partita","il treno","siamo tornati"]],p:[["Completa: Maria ___ (uscire) alle otto.","è uscita"],["Completa: Noi ___ (arrivare) tardi. (grupo mixto)","siamo arrivati"],["Completa: Le ragazze ___ (divertirsi) molto.","si sono divertite"],["Pregunta dónde nació alguien (tú).","Dove sei nato?"],["¿Avere o essere? «___ mangiato e poi ___ uscito.»","Ho mangiato e poi sono uscito."]],t:"Cuenta tu último viaje o paseo (2 minutos): adónde fuiste, con quién, cómo llegaste, qué hiciste y cuándo volviste. Mezcla verbos con avere y con essere."},
{g:"Hablar del clima, las estaciones y comparar.",s:["La <b>gg</b> de <i>pioggia</i> suena 'dy' alargada: 'PIOD-dya'. La <b>v</b> italiana se pronuncia con los dientes sobre el labio: <i>vento, inverno</i>.",["pioggia","freddo","vento","inverno","nuvoloso"]],p:[["Di: «Hace frío».","Fa freddo."],["Di: «Llueve desde ayer».","Piove da ieri."],["Conjuga venire con «io».","vengo"],["Di: «Hoy hace más calor que ayer».","Oggi fa più caldo di ieri."],["Di: «¿Qué tiempo hace?»","Che tempo fa?"]],t:"Describe el clima de tu ciudad en cada estación del año y compáralo con el de Italia usando più… di / meno… di."},
{g:"Explicar qué te duele y entender las indicaciones del médico.",s:["<b>sch</b> suena 'sk': <i>schiena</i> = 'SKIE-na'. La <b>g</b> ante a/o/u es fuerte: <i>gola, gamba</i>.",["schiena","gola","stomaco","mi fa male","febbre"]],p:[["Di: «Me duele la cabeza».","Mi fa male la testa."],["Di: «Me duelen los pies».","Mi fanno male i piedi."],["Plural de «la mano».","le mani"],["Plural de «il braccio».","le braccia"],["Imperativo formal de prendere.","Prenda!"]],t:"Simula una consulta médica: di tus síntomas, desde cuándo los tienes y repite en voz alta lo que te indica el médico."},
{g:"Describir cómo eras y lo que hacías antes, y combinar los dos pasados.",s:["El imperfetto tiene un ritmo muy regular: la fuerza cae en el sufijo: par-LA-vo, a-VE-vo, dor-MI-vo. En «loro» retrocede: par-LA-va-no.",["ero","avevo","giocavo","andavamo","parlavano"]],p:[["Completa: Da bambina ___ (io, avere) un gatto.","avevo"],["Completa: Noi ___ (essere) molto felici.","eravamo"],["Completa: Mentre ___ (io, cucinare), è squillato il telefono.","cucinavo"],["Di: «Cada domingo visitábamos a la abuela».","Ogni domenica visitavamo la nonna."],["¿Cuál es la pista para usar imperfetto?","~Si en español dirías «-aba / -ía», casi siempre es imperfetto."]],t:"Describe tu infancia durante 2 minutos: cómo eras, dónde vivías, qué hacías cada verano. Termina con una anécdota: «una volta, mentre…»."},
{g:"Hablar de tu trabajo actual y del anterior. Repaso del nivel intermedio.",s:["<i>ufficio</i> se lee 'uf-FI-cho' (la i no suena). <i>riunione</i>: 'riu-NIO-ne'. <i>stipendio</i>: 'sti-PEN-dio'.",["ufficio","riunione","stipendio","collega","progetto"]],p:[["Di: «Trabajo aquí desde hace tres años».","Lavoro qui da tre anni."],["Conjuga fare en imperfetto con «noi».","facevamo"],["Pregunta: «¿En qué trabajas?»","Che lavoro fai?"],["Di: «Tengo una reunión a las diez».","Ho una riunione alle dieci."],["Conjuga avere en imperfetto con «io».","avevo"]],t:"Mini prueba del nivel intermedio (90 segundos): qué trabajo haces, qué hacías antes, cómo es tu día en la oficina y qué hiciste ayer."},
{g:"Hablar de tus planes y del futuro.",s:["El futuro lleva la fuerza en la última sílaba, siempre con tilde en «io»: par-le-RÒ, an-DRÒ, sa-RÀ.",["sarò","andrò","farò","parlerò","sarà"]],p:[["Completa: Domani ___ (io, andare) in ufficio.","andrò"],["Completa: L'anno prossimo ___ (noi, essere) in Italia.","saremo"],["Di: «Te llamaré esta noche».","Ti chiamerò stasera."],["Conjuga fare en futuro con «io».","farò"],["Di: «¿Dónde estará Marco?»","Dove sarà Marco?"]],t:"Habla 1 minuto sobre tus planes para el próximo año: dónde estarás, qué harás, qué aprenderás y adónde viajarás."},
{g:"Moverte en un aeropuerto: check-in, aduana, retrasos y equipaje.",s:["<i>bagaglio</i> une la g fuerte y la <b>gli</b>: 'ba-GA-llio'. La <b>z</b> de <i>partenza</i> suena 'ts'.",["bagaglio","partenza","passaporto","ritardo","dogana"]],p:[["Di: «El vuelo está retrasado».","Il volo è in ritardo."],["Conjuga avere en futuro con «io».","avrò"],["Pregunta a qué hora sale el vuelo.","A che ora parte il volo?"],["Di: «Saldré dentro de dos horas».","Partirò fra due ore."],["Di: «Perdí la maleta».","Ho perso la valigia."]],t:"Simula tu llegada a Italia: pasa por migraciones (cuánto tiempo te quedas y por qué), recoge tu maleta y pide un taxi al hotel."},
{g:"Pedir y ofrecer cosas con mucha cortesía, dar consejos y hacer reservas.",s:["El condicional tiene dobles <b>bb</b> y <b>mm</b> que se alargan: <i>sarebbe, potremmo, vorremmo</i>.",["vorrei","potrei","sarebbe","potremmo","mi piacerebbe"]],p:[["Completa: ___ (tu, potere) aiutarmi?","Potresti"],["Di: «Me gustaría visitar Florencia».","Mi piacerebbe visitare Firenze."],["Pregunta: «¿Sería posible cambiar la habitación?»","Sarebbe possibile cambiare la camera?"],["Aconseja: «Deberías descansar».","Dovresti riposare."],["Di: «Quisiera reservar una mesa».","Vorrei prenotare un tavolo."]],t:"Llama a un hotel imaginario y reserva una habitación usando el condicional: fechas, tipo de habitación, desayuno y forma de pago."},
{g:"Dar tu opinión, estar de acuerdo o en desacuerdo, usando el congiuntivo.",s:["Une las palabras sin pausas y usa los conectores como pequeños descansos: <i>allora…, secondo me…, comunque…</i>",["secondo me","penso che sia","sono d'accordo","non sono d'accordo","comunque"]],p:[["Completa: Penso che Marco ___ (essere) stanco.","sia"],["Completa: Secondo me, Roma ___ (essere) bellissima.","è"],["Expresa desacuerdo con cortesía.","Non sono d'accordo, secondo me…"],["Di: «Creo que tienes razón».","Credo che tu abbia ragione."],["¿Por qué «secondo me» va con indicativo?","~Porque no es un verbo de opinión + che; con «penso che» sí va congiuntivo."]],t:"Da tu opinión sobre 3 temas (el clima de tu ciudad, aprender idiomas y el trabajo desde casa) usando penso che, secondo me y però."},
{g:"Expresar cómo te sientes y reaccionar a lo que sienten los demás.",s:["En las exclamaciones la voz sube y baja con fuerza: <i>Che bello!</i> En las disculpas baja suave: <i>Mi dispiace.</i>",["Che bello!","Mi dispiace.","Non ti preoccupare.","felice","arrabbiato"]],p:[["Di: «Espero que tengas razón».","Spero che tu abbia ragione."],["Di: «Me alegro por ti».","Sono felice per te."],["Conjuga avere en congiuntivo con «loro».","che abbiano"],["Di: «No te preocupes».","Non ti preoccupare."],["Di: «Tengo miedo de equivocarme».","Ho paura di sbagliare."]],t:"Cuenta 3 momentos de tu vida (uno feliz, uno triste y uno de nervios) y cómo te sentiste en cada uno."},
{g:"Leer y comentar datos de precios, inflación y economía.",s:["Los decimales se leen con <i>virgola</i> y el porcentaje con <i>per cento</i>: 0,3% = 'zero virgola tre per cento'.",["zero virgola tre per cento","inflazione","aumento","mensile","consumatore"]],p:[["Lee: 0,5%","zero virgola cinque per cento"],["Di: «Los precios subieron».","I prezzi sono aumentati."],["Di: «Se prevé un aumento».","Si prevede un aumento."],["Conjuga fare en congiuntivo con «io».","che io faccia"],["Di: «El índice se calcula cada mes».","L'indice viene calcolato ogni mese."]],t:"Presenta en 1 minuto un resultado de inflación mensual: cuánto varió, qué subió, qué bajó y tu opinión sobre la causa."},
{g:"Evitar repeticiones con los pronombres lo, la, gli, le, ne y ci.",s:["Las contracciones se dicen como una sola palabra: <i>l'ho visto</i> suena 'LO VIS-to'. <i>Glielo</i> se lee 'LLIE-lo'.",["l'ho visto","glielo do","ne voglio due","ci vado domani","me lo dai?"]],p:[["Sustituye: Vedo Marco domani.","Lo vedo domani."],["Sustituye: Telefono a Anna.","Le telefono."],["Sustituye: Ho letto le lettere.","Le ho lette."],["Responde con ne: Quanti figli hai? (2)","Ne ho due."],["Responde con ci: Vai al mercato oggi?","Sì, ci vado oggi."]],t:"Responde en voz alta 8 preguntas sobre tu semana usando pronombres: ¿llamaste a tu madre?, ¿compraste pan?, ¿cuántos cafés tomas?, ¿vas al trabajo mañana?"},
{g:"Usar expresiones idiomáticas para sonar natural.",s:["Las expresiones se dicen de corrido, como una sola palabra: «in-boc-ca-al-LU-po». Imita la melodía, no solo las palabras.",["In bocca al lupo!","Crepi!","Non vedo l'ora!","Che figata!","Meno male!"]],p:[["¿Qué respondes a «In bocca al lupo»?","Crepi!"],["Di: «Estoy sin dinero».","Sono al verde."],["Conjuga dire con «noi».","diciamo"],["Di: «Llueve a cántaros».","Piove a catinelle."],["Di: «No digas nada».","Acqua in bocca!"]],t:"Cuenta una pequeña historia (real o inventada) usando al menos 4 expresiones de hoy."},
{g:"Imaginar situaciones con «se…» y decir qué harías.",s:["Alarga la doble <b>ss</b> de <i>fossi, avessi, potessi</i>: si no, suena 'fosi'. El condicional lleva fuerza en -REI: fa-REI, an-DREI.",["se fossi","se avessi","se potessi","farei","andrei"]],p:[["Completa: Se ___ (io, avere) tempo, viaggerei.","avessi"],["Completa: Se fossi ricco, ___ (io, comprare) una casa.","comprerei"],["Completa (tipo 1): Se piove, ___ (io, restare) a casa.","resto"],["Di: «Si yo fuera tú, estudiaría».","Se fossi in te, studierei."],["Conjuga essere en congiuntivo imperfetto con «loro».","fossero"]],t:"Responde en voz alta: ¿qué harías si ganaras la lotería, si vivieras en Italia y si hablaras italiano perfecto?"},
{g:"Conectar ideas con fluidez y hacer la evaluación final del curso.",s:["Para sonar fluido, une las ideas con conectores y no hagas pausas largas: <i>allora…, insomma…, comunque…, quindi…</i>",["allora","insomma","comunque","quindi","sebbene"]],p:[["Une con «aunque»: «Fa freddo. Esco lo stesso.»","Anche se fa freddo, esco lo stesso."],["Di: «Aunque está cansado, trabaja».","Benché sia stanco, lavora."],["Conjuga sapere con «noi».","sappiamo"],["Di: «Te lo digo para que lo sepas».","Te lo dico affinché tu lo sappia."],["Di: «Llueve, por lo tanto me quedo en casa».","Piove, quindi resto a casa."]],t:"Evaluación final (5 minutos, grábate): 1) preséntate; 2) describe a tu familia; 3) cuenta tu rutina; 4) narra un viaje en pasado; 5) explica tus planes del próximo año; 6) da tu opinión sobre aprender italiano. Escúchate y anota qué días repasar."}

function pron(w){let s=w.toLowerCase();
  s=s.replace(/(^|[^cg])h/g,"$1").replace(/sch/g,"sk").replace(/sci([aou])/g,"sh$1").replace(/sc([eièé])/g,"sh$1")
   .replace(/gli([aeou])/g,"lli$1").replace(/gli\b/g,"lli").replace(/gn/g,"ñ")
   .replace(/cch/g,"kk").replace(/ch/g,"k").replace(/gh([eièé])/g,"gu$1")
   .replace(/cci([aou])/g,"tch$1").replace(/cc([eièé])/g,"tch$1").replace(/ci([aou])/g,"ch$1").replace(/c([eièé])/g,"ch$1")
   .replace(/ggi([aou])/g,"ddy$1").replace(/gg([eièé])/g,"ddy$1").replace(/gi([aou])/g,"dy$1").replace(/g([eièé])/g,"dy$1")
   .replace(/zz/g,"ts").replace(/z/g,"ts").replace(/qu/g,"ku");
  return s===w.toLowerCase()?"":s}

{i:"<p><b>Essere</b> significa ser <b>y</b> estar. Es el verbo más importante: apréndelo de memoria hoy. En italiano casi siempre se omite el pronombre: <i>Sono peruviano</i> ya significa «yo soy peruano».</p><p>Para hablar de usted se usa <b>Lei</b> (con mayúscula) y el verbo en tercera persona: <i>Lei è italiano?</i></p>",

 n:["<b>Negación:</b> se pone <i>non</i> antes del verbo: <i>Non sono italiano</i>.","<b>Pregunta:</b> el orden no cambia, solo la voz sube al final: <i>Sei italiano?</i>","<b>Tu o Lei:</b> usa <i>tu</i> con amigos, familia y jóvenes; <i>Lei</i> con desconocidos, en tiendas y oficinas."]},
{i:"<p>Los sustantivos que terminan en <b>-o</b> suelen ser masculinos y los que terminan en <b>-a</b>, femeninos. Los que terminan en <b>-e</b> pueden ser de cualquier género: apréndelos siempre con su artículo.</p><p><b>Lo / gli</b> se usan ante palabras masculinas que empiezan por <b>s + consonante</b>, <b>z</b>, <b>gn</b>, <b>ps</b> o <b>y</b>. Ante vocal se usa <b>l'</b>.</p>",
 t:[{c:"Artículo determinado (el, la, los, las)",h:["Uso","Singular","Plural"],r:[["masculino normal","il libro","i libri"],["masc. s+consonante, z","lo studente","gli studenti"],["masc. ante vocal","l'amico","gli amici"],["femenino","la casa","le case"],["fem. ante vocal","l'amica","le amiche"]],k:[1,2]}],
 n:["Las palabras con tilde final no cambian en plural: <i>il caffè → i caffè, la città → le città</i>.","<i>Gli</i> se pronuncia como una «ll» muy marcada: <i>gli amici</i>."]},
{i:"<p>El artículo indeterminado (un, una) también depende de cómo empieza la palabra. El plural de los sustantivos sigue una regla muy simple según la última letra.</p><p>Con los números, desde el 20 se pierde la última vocal antes de <i>uno</i> y <i>otto</i>: <i>ventuno, ventotto, trentuno</i>. Y <i>tre</i> lleva tilde al final de un número compuesto: <i>ventitré</i>.</p>",

{i:"<p>En italiano el posesivo va <b>con artículo</b>: <i>la mia casa, il tuo libro</i>.</p><p>Excepción: con un familiar en <b>singular</b> y sin adjetivo se quita el artículo: <i>mia madre, tuo fratello</i>. En plural vuelve: <i>i miei fratelli</i>. Con <b>loro</b> siempre hay artículo: <i>il loro padre</i>.</p>",

 n:["<i>Suo</i> concuerda con la cosa poseída, no con el dueño: <i>Marco e sua sorella</i>, <i>Anna e suo marito</i>.","Adjetivos útiles: alto, basso, giovane, anziano, simpatico, gentile, bello, carino."]},
{i:"<p>El adjetivo va normalmente <b>después</b> del sustantivo y concuerda en género y número, como en español.</p><p>Hay dos tipos: los que terminan en <b>-o</b> (4 formas) y los que terminan en <b>-e</b> (2 formas, iguales para masculino y femenino). Algunos colores no cambian nunca: <b>blu, rosa, viola, beige</b>.</p>",

{i:"<p>Los verbos en <b>-are</b> son los más numerosos: quita <i>-are</i> y añade <b>-o, -i, -a, -iamo, -ate, -ano</b>. Ojo: en «loro» la fuerza va atrás: <i>PAR-la-no, MAN-gia-no</i>.</p><p><b>Piacere</b> funciona exactamente como «gustar»: lo que gusta es el sujeto. <b>Piace</b> con una cosa o un infinitivo, <b>piacciono</b> con varias cosas.</p>",

{i:"<p>Las preposiciones <b>di, a, da, in, su</b> se unen al artículo en una sola palabra. Es uno de los puntos más importantes del italiano: aparece en casi cada frase.</p>",
